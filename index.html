function groupStoriesByAuthor(stories){
  const map = new Map();
  (stories || []).forEach(s => {
    if(!map.has(s.authorId)) map.set(s.authorId, []);
    map.get(s.authorId).push(s);
  });
  return Array.from(map.values());
}

function StoryTray({ stories, profile, onOpenStory, onAddStory }){
  const groups = groupStoriesByAuthor(stories);
  const myGroup = groups.find(g => g[0].authorId === profile.visitorId);
  const others = groups.filter(g => g[0].authorId !== profile.visitorId);
  others.sort((a, b) => {
    const aUnseen = a.some(s => !s.viewed);
    const bUnseen = b.some(s => !s.viewed);
    if(aUnseen !== bUnseen) return aUnseen ? -1 : 1;
    return 0;
  });

  return e("div", { className:"story-tray" },
    e("button", {
      type:"button", className:"story-bubble",
      onClick: myGroup ? () => onOpenStory(profile.visitorId) : onAddStory,
    },
      e("span", { className:"story-ring " + (myGroup ? "story-ring-seen" : "story-ring-add") },
        myGroup
          ? e(Avatar, { url:myGroup[0].authorAvatarUrl, name:profile.name, size:56 })
          : e("span", { className:"story-add-icon" }, Icon("plus"))
      ),
      e("span", { className:"story-bubble-label" }, "Your story")
    ),
    others.map(g => {
      const latest = g[0];
      const hasUnseen = g.some(s => !s.viewed);
      return e("button", { key:latest.authorId, type:"button", className:"story-bubble", onClick:()=>onOpenStory(latest.authorId) },
        e("span", { className:"story-ring " + (hasUnseen ? "story-ring-unseen" : "story-ring-seen") },
          e(Avatar, { url:latest.authorAvatarUrl, name:latest.authorName, size:56 })
        ),
        e("span", { className:"story-bubble-label" }, (latest.authorName || "").split(" ")[0] || "Someone")
      );
    })
  );
}

function StoryViewerOverlay({ stories, authorId, profile, onClose, onRequestAdd }){
  useBackClose(onClose);
  const authorStories = (stories || []).filter(s => s.authorId === authorId);
  const [idx, setIdx] = useState(0);
  const current = authorStories[idx];

  useEffect(() => {
    if(current && profile) Api.viewStory(current.id, profile.visitorId, profile.token).catch(()=>{});
  }, [current && current.id]);

  if(!current) return null;

  function next(){
    if(idx < authorStories.length - 1) setIdx(idx + 1);
    else onClose();
  }
  function prev(){
    if(idx > 0) setIdx(idx - 1);
  }

  const isMine = authorId === profile.visitorId;

  return e("div", { className:"story-overlay", onClick:onClose },
    e("div", { className:"story-overlay-inner", onClick: ev=>ev.stopPropagation() },
      e("div", { className:"story-progress-row" },
        authorStories.map((s, i) => e("div", { key:s.id, className:"story-progress-seg" + (i <= idx ? " story-progress-seg-filled" : "") }))
      ),
      e("div", { className:"story-overlay-head" },
        e(Avatar, { url:current.authorAvatarUrl, name:current.authorName, size:32 }),
        e("span", { className:"story-overlay-name" }, current.authorName),

      current.caption ? e("p", { className:"story-caption" }, current.caption) : null,
      e("div", { className:"story-tap-zones" },

  );

function AddStorySheet({ profile, onCreated, onClose }){
  useBackClose(onClose);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [photoFile, setPhotoFile] = useState(null);
  const [videoFile, setVideoFile] = useState(null);
  const [videoPreviewUrl, setVideoPreviewUrl] = useState(null);
  const [caption, setCaption] = useState("");
  const [posting, setPosting] = useState(false);
  const [error, setError] = useState(null);

  function pickPhoto(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    downscaleImage(file, 1080, 0.78).then(dataUrl => {
      setPhotoPreview(dataUrl);
      setPhotoFile(dataUrlToBlob(dataUrl));
      setVideoFile(null); setVideoPreviewUrl(null);
    }).catch(()=>setError("Couldn't read that photo — try another."));
  }

  function pickVideo(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    setError(null);
    const objectUrl = URL.createObjectURL(file);
    const probe = document.createElement("video");
    probe.preload = "metadata";
    probe.onloadedmetadata = () => {
      const dur = probe.duration;
      if(!isFinite(dur) || dur < 1){
        setError("Couldn't read that clip's length — try another file.");
        URL.revokeObjectURL(objectUrl);
        return;
      }
      if(dur > 20){
        setError("Keep stories to about 15 seconds — this one's " + Math.round(dur) + "s long.");
        URL.revokeObjectURL(objectUrl);
        return;
      }
      setVideoFile(file);
      setVideoPreviewUrl(objectUrl);
      setPhotoFile(null); setPhotoPreview(null);
    };
    probe.onerror = () => {
      setError("Couldn't read that video file — try another.");
      URL.revokeObjectURL(objectUrl);
    };
    probe.src = objectUrl;
  }

  async function submit(){
    if(!photoFile && !videoFile) return;
    setPosting(true); setError(null);
    try{
      const created = await Api.createStory({
        authorId: profile.visitorId, authToken: profile.token,
        photoBlob: photoFile, videoFile, caption: caption.trim(),
      });
      onCreated(created);
    }catch(err){
      setError(err.message || "Couldn't share that story right now.");
    }finally{
      setPosting(false);
    }
  }

  return e("div", { className:"sheet-backdrop", onClick:onClose },
    e("div", { className:"sheet", onClick: ev=>ev.stopPropagation() },
      e("div", { className:"sheet-handle" }),
      e("div", { className:"sheet-head" },
        e("h2", { className:"display", style:{ fontSize:20, fontWeight:700 } }, "Add to your story"),
        e("button", { className:"close-btn", onClick:onClose, "aria-label":"Close" }, Icon("x"))
      ),
      e("p", { style:{ fontSize:12.5, color:"var(--ink-soft)", marginBottom:12 } }, "Visible to your followers for 24 hours, then it disappears."),
      e("div", { className:"photo-frame", style:{ aspectRatio:"9/14", maxHeight:320 } },
        photoPreview ? e("img", { src:photoPreview, alt:"" })
          : videoPreviewUrl ? e("video", { src:videoPreviewUrl, controls:true, playsInline:true, style:{ width:"100%", height:"100%", objectFit:"cover" } })
          : e("label", { className:"photo-frame-label", htmlFor:"story-photo-input" }, Icon("camera"), e("span", null, "Add a photo or clip"))
      ),
      e("input", { id:"story-photo-input", type:"file", accept:"image/*", className:"visually-hidden", onChange:pickPhoto }),
      e("input", { id:"story-video-input", type:"file", accept:"video/*", className:"visually-hidden", onChange:pickVideo }),
      e("div", { style:{ display:"flex", gap:8, margin:"10px 0" } },
        e("label", { htmlFor:"story-photo-input", className:"btn btn-ghost btn-sm" }, "Photo"),
        e("label", { htmlFor:"story-video-input", className:"btn btn-ghost btn-sm" }, "Short clip")
      ),
      e("div", { className:"field" },
        e("label", { htmlFor:"story-caption" }, "Caption (optional)"),
        e("input", { id:"story-caption", type:"text", value:caption, maxLength:200, onChange: ev=>setCaption(ev.target.value) })
      ),
      error ? e(Banner, { kind:"error" }, error) : null,
      e("button", { className:"btn btn-accent btn-block", disabled:posting || (!photoFile && !videoFile), onClick:submit },
        posting ? "Sharing…" : "Share to story")
    )
  );
}

    Api.getMessages(conversationId, profile.visitorId, profile.token).then(setMessages).catch(()=>{});
  }, [conversationId, profile.visitorId, profile.token]);

  useEffect(() => {
    refresh();

  useEffect(() => {

  return e("div", { style:{ display:"flex", flexDirection:"column", height:"100%" } },
    e("button", { className:"btn-text", style:{ padding:0, marginBottom:14 }, onClick:onBack }, "← Messages"),
    e("h1", { className:"screen-title", style:{ marginBottom:14, fontSize:19 } }, otherName || "Conversation"),
    error ? e(Banner, { kind:"error" }, error) : null,
    e("div", { ref:listRef, className:"conversation-list" },
      messages === null ? e(Thinking, { label:"Loading…" })
        : messages.length === 0 ? e(EmptyState, { icon:"community" }, "Say hello — this is the start of your conversation.")
        : messages.map(m => e("div", {
            key:m.id,
            className: "message-bubble " + (m.senderId === profile.visitorId ? "message-bubble-mine" : "message-bubble-theirs"),
          }, m.text))
    ),
    e("div", { className:"conversation-input-row" },
      e("input", { type:"text", value:text, maxLength:2000, placeholder:"Message " + (otherName || "") + "…",
        onChange: ev=>setText(ev.target.value),
        onKeyDown: ev => { if(ev.key === "Enter") send(); } }),
      e("button", { className:"btn btn-accent btn-sm", disabled:sending || !text.trim(), onClick:send }, Icon("send"))
    )
  );
}

/* =====================================================================
   ROOT APP
===================================================================== */

function App(){
  const [profile, setProfile] = useState(() => loadLocal("lore_profile", null));
  const [kibbeResult, setKibbeResult] = useState(() => loadLocal("lore_kibbe", null));
  const [styleBlend, setStyleBlend] = useState(() => loadLocal("lore_style_blend", null));
  const [colorResult, setColorResult] = useState(() => loadLocal("lore_colorseason", null));
  const [closet, setCloset] = useState(() => loadLocal("lore_closet", []));
  const [screen, setScreen] = useState("home");
  const [viewingProfileId, setViewingProfileId] = useState(null);
  const [viewingConversation, setViewingConversation] = useState(null); // {id, otherId, otherName} | null
  const [unreadNotifCount, setUnreadNotifCount] = useState(0);
  const [unreadMsgCount, setUnreadMsgCount] = useState(0);
  // Holds whatever FCM token this install last registered (set by the
  // push-notification effect below), so signOut() can best-effort tell the
  // server to drop it — Capacitor's PushNotifications plugin has no
  // synchronous "current token" getter, only the async registration event.
  const deviceTokenRef = useRef(null);

  // Style-LORE Premium entitlement. The server (has_premium(), synced
  // from RevenueCat's webhook — see api/revenuecat_webhook.php) is always
  // the real source of truth for anything that spends money server-side
  // (the AI Stylist, the closet's 300-item cap), but the client keeps its
  // own copy too so screens can show/hide upgrade prompts instantly.
  // closetFreeLimit mirrors includes/helpers.php's CLOSET_FREE_LIMIT so
  // the UI's cap warning never drifts out of sync with what the server
  // actually enforces.
  const [isPremium, setIsPremium] = useState(false);
  const [closetFreeLimit, setClosetFreeLimit] = useState(20);
  // null, or a short string saying why the paywall was opened ("closet",
  // "checker") purely for the paywall's own copy — never used for access
  // control (the server checks that independently on every call).
  const [paywallReason, setPaywallReason] = useState(null);
  function openPaywall(reason){ setPaywallReason(reason || true); }

  // Hardware/browser back button — see the useBackClose block near the top
  // of this file for the sheet/overlay side of this. App-level navigation
  // keeps a real navigation STACK: every distinct (screen, viewingProfileId,
  // viewingConversation) combination the user actually visits gets its own
  // history entry, so the hardware/browser back button always returns to
  // whatever was on screen before — not just Home. (An earlier version of
  // this tracked only a flat "home vs. not home" depth, which is why back
  // always landed on Home regardless of how many tabs had been visited —
  // reported by Kenneth on 2026-09-14 and fixed here.)
  //
  // Each screen change or overlay open/close does AT MOST one
  // history.pushState() or history.go() call per React commit, never both —
  // mixing them in the same commit is what risks corrupting browser history,
  // since history.go() resolves asynchronously while pushState() is
  // synchronous, and React runs a commit's effect cleanups before any of its
  // new effect setups.
  const navStackRef = useRef([{ screen: "home", viewingProfileId: null, viewingConversation: null }]);
  const handlingPopRef = useRef(false);
  const suppressNavPopRef = useRef(0);
  function navFrameKey(f){
    return f.screen + "|" + (f.viewingProfileId || "") + "|" + (f.viewingConversation ? f.viewingConversation.id : "");
  }
  useEffect(() => {
    function onPopState(){
      if(suppressNavPopRef.current > 0){ suppressNavPopRef.current--; return; }
      const stack = navStackRef.current;
      if(stack.length <= 1) return; // already at the root — let the normal browser/OS back action happen.
      handlingPopRef.current = true;
      const prevFrame = stack[stack.length - 2];
      setScreen(prevFrame.screen);
      setViewingProfileId(prevFrame.viewingProfileId);
      setViewingConversation(prevFrame.viewingConversation);
    }
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
  }, []);
  useEffect(() => {
    const stack = navStackRef.current;
    const frame = { screen, viewingProfileId, viewingConversation };
    const key = navFrameKey(frame);
    const topKey = navFrameKey(stack[stack.length - 1]);

    if(key === topKey){
      // No real change in the tracked fields (e.g. initial mount, or some
      // other state updated) — nothing to do.
      handlingPopRef.current = false;
      return;
    }

    if(handlingPopRef.current){
      // The browser already moved back on its own (this is reacting to a
      // real hardware/back-button press) — just drop our own top entry to
      // match. No history call: the browser already navigated for us.
      stack.pop();
      handlingPopRef.current = false;
      return;
    }

    // Does this state land on a frame already earlier in the stack? That
    // means an in-app "← Back"/close control (not the hardware button)
    // produced it — collapse our stack, and the real browser history, back
    // to that point instead of pushing a new entry forward.
    let matchIdx = -1;
    for(let i = stack.length - 2; i >= 0; i--){
      if(navFrameKey(stack[i]) === key){ matchIdx = i; break; }
    }

    try{
      if(matchIdx !== -1){
        const steps = (stack.length - 1) - matchIdx;
        stack.length = matchIdx + 1;
        // history.go() fires exactly ONE popstate no matter how many
        // entries it skips over — suppress by 1, not by `steps`.
        suppressNavPopRef.current += 1;
        window.history.go(-steps);
      } else {
        stack.push(frame);
        window.history.pushState({ navDepth: stack.length - 1 }, "");
      }
    }catch(err){ /* history API unavailable — app still works, just no back-button integration */ }
  }, [screen, viewingProfileId, viewingConversation]);

  // A ?verify=<token> or ?reset=<token> link from an email takes over the
  // whole screen regardless of login state, then is stripped from the URL
  // so a refresh doesn't re-trigger it.
  const [pendingLinkAction, setPendingLinkAction] = useState(() => {
    const params = new URLSearchParams(window.location.search);
    const verify = params.get("verify");
    const reset = params.get("reset");
    if(verify) return { kind:"verify", token:verify };
    if(reset) return { kind:"reset", token:reset };
    return null;
  });
  useEffect(() => {
    if(pendingLinkAction && (window.location.search.includes("verify=") || window.location.search.includes("reset="))){
      const url = new URL(window.location.href);
      url.searchParams.delete("verify");
      url.searchParams.delete("reset");
      window.history.replaceState({}, "", url.pathname + url.search + url.hash);
    }
  }, []);

  const blend = kibbeResult ? kibbeResult.kibbeBlend : null;
  const kibbeTypeName = (kibbeResult && kibbeResult.kibbeTypeId && KIBBE_BY_ID[kibbeResult.kibbeTypeId]) ? KIBBE_BY_ID[kibbeResult.kibbeTypeId].name : null;
  const topStyleWords = styleBlend ? topWords(styleBlend, STYLE_WORDS, 5).map(w => w.id) : [];

  useEffect(() => { if(profile) saveLocal("lore_profile", profile); }, [profile]);
  useEffect(() => { if(kibbeResult) saveLocal("lore_kibbe", kibbeResult); }, [kibbeResult]);
  useEffect(() => { if(styleBlend) saveLocal("lore_style_blend", styleBlend); }, [styleBlend]);
  useEffect(() => { if(colorResult) saveLocal("lore_colorseason", colorResult); }, [colorResult]);
  useEffect(() => { saveLocal("lore_closet", closet); }, [closet]);

  // Mirrors the local closet up to the server (see api/closet.php) so
  // whichever items are marked Public can be shown on the profile and in
  // Community's Closets tab. The device's local array stays the source of
  // truth for editing (including each item's own visibility).
  //
  // api/closet.php does a full delete+reinsert per sync, keyed only by
  // account_id -- there's no version/timestamp for the server to order by.
  // Two edits in quick succession (e.g. add an item, then immediately mark
  // it Public) fire two overlapping requests, and a plain fire-and-forget
  // fetch has no guarantee the second (newer) one's response lands after
  // the first: if the network reorders them, the older "hidden" snapshot
  // can land last and silently stomp the newer "public" one, which is
  // exactly the bug Kenneth saw (2026-09-12: an item marked Public showed
  // up as hidden). closetSyncChainRef below chains every sync onto a
  // promise, so requests are always sent one at a time in issuance order
  // and each one reads closetRef.current at send time -- the true latest
  // state -- rather than whatever `closet` value was captured when it was
  // scheduled, so a slow request can no longer overwrite a newer one.
  //
  // A sync failure used to just vanish into a bare .catch(()=>{}) here --
  // which is exactly how the "public closet items not showing up" bug
  // (2026-09-12) went unnoticed for days: the server was rejecting every
  // single sync (a missing `subscriptions` table -- see
  // monetization-setup-checklist.md) and nothing, anywhere, ever showed
  // that. closetSyncStatus below (read by ClosetScreen) plus the
  // automatic retry-with-backoff make sure that failure mode can't hide
  // silently again.
  const closetRef = useRef(closet);
  useEffect(() => { closetRef.current = closet; }, [closet]);
  const closetSyncChainRef = useRef(Promise.resolve());
  const closetSyncAttemptRef = useRef(0);
  const closetSyncRetryTimerRef = useRef(null);
  // "idle" (signed out / nothing synced yet) | "saving" | "saved" | "error".
  const [closetSyncStatus, setClosetSyncStatus] = useState("idle");

  const runClosetSync = useCallback(() => {
    if(!profile || !profile.visitorId) return;
    setClosetSyncStatus("saving");
    closetSyncChainRef.current = closetSyncChainRef.current.then(() =>
      Api.syncCloset(profile.visitorId, profile.name, profile.token, closetRef.current)
        .then(() => {
          closetSyncAttemptRef.current = 0;
          setClosetSyncStatus("saved");
        })
        .catch(() => {
          setClosetSyncStatus("error");
          // Auto-retry with backoff (2s/4s/8s/16s/30s) so a one-off blip
          // clears itself without anyone having to notice or tap anything
          // -- capped at 5 attempts so a genuinely broken server doesn't
          // retry forever in the background. A real edit (below), or the
          // "Retry now" button in ClosetScreen, resets this counter.
          closetSyncAttemptRef.current = Math.min(closetSyncAttemptRef.current + 1, 5);
          if(closetSyncAttemptRef.current >= 5) return;
          const delay = Math.min(30000, 2000 * Math.pow(2, closetSyncAttemptRef.current - 1));
          if(closetSyncRetryTimerRef.current) clearTimeout(closetSyncRetryTimerRef.current);
          closetSyncRetryTimerRef.current = setTimeout(runClosetSync, delay);
        })
    );
  }, [profile && profile.visitorId, profile && profile.name, profile && profile.token]);

  useEffect(() => {
    if(!profile || !profile.visitorId) return;
    closetSyncAttemptRef.current = 0;
    if(closetSyncRetryTimerRef.current) clearTimeout(closetSyncRetryTimerRef.current);
    runClosetSync();
  }, [profile && profile.visitorId, profile && profile.name, profile && profile.token, closet]);

  useEffect(() => () => { if(closetSyncRetryTimerRef.current) clearTimeout(closetSyncRetryTimerRef.current); }, []);

  // Lightweight polling for the topbar's bell/mail unread badges — cheap
  // enough to run continuously since both endpoints are simple indexed
  // queries. Skips entirely while signed out.
  useEffect(() => {
    if(!profile || !profile.visitorId) return;
    let cancelled = false;
    function poll(){
      Api.getNotifications(profile.visitorId, profile.token).then(d => {
        if(!cancelled) setUnreadNotifCount(d.unreadCount || 0);
      }).catch(()=>{});
      Api.getConversations(profile.visitorId, profile.token).then(rows => {
        if(!cancelled) setUnreadMsgCount(rows.filter(c => c.unread).length);
      }).catch(()=>{});
    }
    poll();
    const t = setInterval(poll, 10000);
    return () => { cancelled = true; clearInterval(t); };
  }, [profile && profile.visitorId, profile && profile.token, screen, viewingConversation]);

  // Push notifications (Android, via Capacitor + Firebase Cloud Messaging).
  // window.Capacitor only exists when this page is running inside the
  // native app shell (mobile/capacitor.config.json wraps this exact live
  // site rather than a bundled copy) — a plain browser tab skips all of
  // this. Capacitor auto-injects the bridge/plugin globals on every page
  // load it controls, remote URL included, so no extra script tag is
  // needed here beyond installing the native plugin (mobile/package.json)
  // and syncing it into the Android project. Registers this device's push
  // token with the server (api/device_tokens.php) so a like/comment/
  // follow/message/group-join also raises a real phone notification (see
  // send_push_notification() in includes/helpers.php); tapping one routes
  // to the same place the in-app NotificationsScreen's handleTap() would
  // (a message opens its conversation, anything else with an actor opens
  // that profile, otherwise the Notifications screen).
  useEffect(() => {
    if(!profile || !profile.visitorId) return;
    const Capacitor = window.Capacitor;
    const isNative = Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
    const Push = isNative && Capacitor.Plugins && Capacitor.Plugins.PushNotifications;
    if(!Push) return;

    let cancelled = false;
    const listeners = [];

    function routeFromNotificationData(data){
      if(!data) { goTo("notifications"); return; }
      if(data.type === "message" && data.conversationId){
        openConversation({ id:data.conversationId, otherId:data.otherId || null, otherName:data.otherName || "" });
      } else if(data.actorId){
        openProfile(data.actorId);
      } else {
        goTo("notifications");
      }
    }

    async function setUp(){
      let perm = await Push.checkPermissions();
      if(perm.receive !== "granted"){
        perm = await Push.requestPermissions();
      }
      if(perm.receive !== "granted" || cancelled) return;

      listeners.push(await Push.addListener("registration", (token) => {
        if(cancelled || !token || !token.value) return;
        deviceTokenRef.current = token.value;
        Api.registerDeviceToken(profile.visitorId, profile.token, token.value, "android").catch(()=>{});
      }));
      listeners.push(await Push.addListener("registrationError", () => {}));
      listeners.push(await Push.addListener("pushNotificationActionPerformed", (action) => {
        routeFromNotificationData(action && action.notification && action.notification.data);
      }));

      if(!cancelled) await Push.register();
    }
    setUp().catch(()=>{});

    return () => {
      cancelled = true;
      listeners.forEach(l => { try{ l.remove(); }catch(err){} });
    };
  }, [profile && profile.visitorId, profile && profile.token]);

  // Style-LORE Premium status — refetched on sign-in, and again whenever
  // the paywall closes (a purchase may have just gone through). This is
  // the one source every screen reads isPremium/closetFreeLimit from;
  // RevenueCat's webhook is what keeps has_premium() in sync server-side
  // in the background, independent of whether this tab/app is even open.
  useEffect(() => {
    if(!profile || !profile.visitorId){ setIsPremium(false); return; }
    let cancelled = false;
    Api.getSubscriptionStatus(profile.visitorId).then(({ isPremium, closetFreeLimit }) => {
      if(cancelled) return;
      setIsPremium(!!isPremium);
      if(closetFreeLimit) setClosetFreeLimit(closetFreeLimit);
    }).catch(()=>{});
    return () => { cancelled = true; };
  }, [profile && profile.visitorId, paywallReason === null]);

  // RevenueCat — native purchase flow for Style-LORE Premium. Configured
  // with this account's own id as RevenueCat's "app user id" (rather than
  // letting it generate an anonymous one) so a purchase always attaches
  // to the same account this person is signed into everywhere else — see
  // the appUserID note atop api/revenuecat_webhook.php for why that means
  // no separate id-mapping table is needed server-side. Same isNative /
  // profile.visitorId-gated useEffect shape as the push-notification setup
  // above, for the same reason: both are native-only and both need a
  // signed-in account id before they mean anything.
  const purchasesConfiguredForRef = useRef(null);
  useEffect(() => {
    if(!profile || !profile.visitorId) return;
    const Capacitor = window.Capacitor;
    const isNative = Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
    const Purchases = isNative && Capacitor.Plugins && Capacitor.Plugins.Purchases;
    if(!Purchases || !REVENUECAT_PUBLIC_SDK_KEY_ANDROID) return;
    if(purchasesConfiguredForRef.current === profile.visitorId) return;
    purchasesConfiguredForRef.current = profile.visitorId;

    let cancelled = false;
    const listeners = [];

    function applyCustomerInfo(info){
      const active = info && info.entitlements && info.entitlements.active;
      if(active && active[REVENUECAT_ENTITLEMENT_ID]) setIsPremium(true);
    }

    async function setUp(){
      await Purchases.configure({ apiKey: REVENUECAT_PUBLIC_SDK_KEY_ANDROID, appUserID: profile.visitorId });
      if(cancelled) return;
      listeners.push(await Purchases.addListener("customerInfoUpdate", (event) => {
        // Fires immediately after a purchase completes, well before
        // RevenueCat's webhook reaches our own server — trust it right
        // away so the UI unlocks instantly instead of waiting on a round
        // trip. api/subscription/status stays the source of truth for
        // every screen load after this session ends.
        applyCustomerInfo(event && event.customerInfo);
      }));
      try{
        const { customerInfo } = await Purchases.getCustomerInfo();
        if(!cancelled) applyCustomerInfo(customerInfo);
      }catch(err){ /* fine — the server status fetch above already covers this */ }
    }
    setUp().catch(()=>{});

    return () => {
      cancelled = true;
      listeners.forEach(l => { try{ l.remove(); }catch(err){} });
    };
  }, [profile && profile.visitorId]);

  // Auto-populate this account's public profile with a style summary
  // derived from their own quiz results — "Style" per Kenneth's request,
  // not something anyone types in. Fires whenever either quiz's result
  // changes; harmless to call again with the same values (the backend
  // just upserts). Also sends the full kibbeResult/styleBlend objects
  // (not just the short display summary), so this account's actual quiz
  // results — not just the top-line chips — can follow them to a new
  // device, and can be compared against another account's on the Compare
  // screen. Silently ignored on failure — this is a nice-to-have sync,
  // never something that should interrupt using the app.
  useEffect(() => {
    if(!profile || !profile.visitorId) return;
    if(!kibbeTypeName && topStyleWords.length === 0) return;
    Api.updateStyleSummary(profile.visitorId, {
      kibbeTypeName, styleWords: topStyleWords,
      kibbeResult: kibbeResult || null, styleBlend: styleBlend || null,
      authToken: profile.token,
    }).catch(()=>{});
  }, [profile && profile.visitorId, profile && profile.token, kibbeTypeName, JSON.stringify(topStyleWords), JSON.stringify(kibbeResult), JSON.stringify(styleBlend)]);

  // Hydrate this account's own quiz results from the server on login/mount
  // when this browser has neither locally yet (a fresh device, or right
  // after "Sign out" + log back in) — lets someone see their own Kibbe
  // Quiz / Style Quiz results without retaking either one, as long as
  // they've synced from at least one other device/browser before. Runs
  // once per sign-in; never overwrites results this device already has
  // (a fresh local retake always wins over whatever the server has).
  const hydratedForRef = useRef(null);
  useEffect(() => {
    if(!profile || !profile.visitorId) return;
    if(kibbeResult || styleBlend) return; // this device already has results — never overwrite
    if(hydratedForRef.current === profile.visitorId) return; // already tried this sign-in
    hydratedForRef.current = profile.visitorId;
    Api.getProfile(profile.visitorId).then(row => {
      if(row && row.kibbeResult && row.kibbeResult.kibbeBlend) setKibbeResult(row.kibbeResult);
      if(row && row.styleBlend) setStyleBlend(row.styleBlend);
    }).catch(()=>{});
  }, [profile && profile.visitorId, kibbeResult, styleBlend]);

  function completeGate(newProfile){
    setProfile(newProfile);
  }
  function markEmailVerified(){
    setProfile(prev => prev ? Object.assign({}, prev, { emailVerified: true }) : prev);
    setPendingLinkAction(null);
  }
  function completeReset(newProfile){
    setProfile(newProfile);
    setPendingLinkAction(null);
  }
  function signOut(){
    if(deviceTokenRef.current && profile && profile.visitorId){
      Api.unregisterDeviceToken(profile.visitorId, profile.token, deviceTokenRef.current).catch(()=>{});
    }
    setProfile(null);
    removeLocal("lore_profile"); // clear now that logging back in requires a real password
  }
  function handleAccountDeleted(){
    // The account is gone server-side; also clear every local key tied to
    // it so a shared/public device doesn't keep showing this person's quiz
    // results, closet, or style profile after they've deleted their account.
    ["lore_profile", "lore_kibbe", "lore_style_blend", "lore_colorseason", "lore_closet"].forEach(removeLocal);
    setProfile(null);
    setKibbeResult(null);
    setStyleBlend(null);
    setColorResult(null);
    setCloset([]);
  }
  function goTo(nextScreen){
    setViewingProfileId(null);
    setViewingConversation(null);
    setScreen(nextScreen);
  }
  function openProfile(id){
    setViewingConversation(null);
    setViewingProfileId(id);
  }
  function closeProfile(){
    setViewingProfileId(null);
  }
  function renameLocalProfile(nextName){
    setProfile(prev => prev ? Object.assign({}, prev, { name: nextName }) : prev);
  }
  function openConversation(convo){
    setViewingProfileId(null);
    setViewingConversation(convo);
  }
  async function openConversationWith(otherId, otherName){
    try{
      const { id } = await Api.startConversation({
        visitorId: profile.visitorId, visitorName: profile.name, authToken: profile.token,
        otherId, otherName,
      });
      setViewingProfileId(null);
      setViewingConversation({ id, otherId, otherName });
    }catch(err){ /* rare — leave them on the profile */ }
  }
  function closeConversation(){
    setViewingConversation(null);
  }

  if(pendingLinkAction && pendingLinkAction.kind === "verify"){
    return e(VerifyEmailScreen, { token: pendingLinkAction.token, onDone: markEmailVerified });
  }
  if(pendingLinkAction && pendingLinkAction.kind === "reset"){
    return e(ResetPasswordScreen, {
      token: pendingLinkAction.token,
      onDone: completeReset,
      onCancel: () => setPendingLinkAction(null),
    });
  }

  if(!profile){
    return e(AccountGate, { onComplete: completeGate });
  }

  let body;
  if(viewingConversation){
    body = e(ConversationScreen, {
      profile, conversationId: viewingConversation.id, otherName: viewingConversation.otherName,
      onBack: closeConversation,
    });
  }
  else if(viewingProfileId){
    body = e(ProfileScreen, {
      id: viewingProfileId, viewer: profile,
      onBack: closeProfile, onOpenProfile: openProfile, onNameChange: renameLocalProfile, onMessage: openConversationWith,
      viewerKibbeBlend: blend, viewerStyleWordBlend: styleBlend, viewerKibbeTypeName: kibbeTypeName, viewerTopStyleWords: topStyleWords
    });
  }
  else if(screen === "home") body = e(HomeScreen, { profile, blend, styleBlend, onNavigate:goTo, onSignOut:signOut, onOpenProfile:openProfile, onAccountDeleted:handleAccountDeleted });
  else if(screen === "quiz") body = e(StyleQuizScreen, { kibbeResult, styleLanguageResult:styleBlend, onSaveKibbe:setKibbeResult, onSaveStyle:setStyleBlend });
  else if(screen === "color") body = e(ColorScreen, { colorResult, onSaveColor:setColorResult });
  else if(screen === "closet") body = e(ClosetScreen, { closet, setCloset, blend, styleWordBlend:styleBlend, kibbeTypeName, topStyleWords, profile, isPremium, closetFreeLimit, onUpgrade:openPaywall, syncStatus:closetSyncStatus, onRetrySync:runClosetSync });
  else if(screen === "checker") body = e(CheckerScreen, { blend, styleWordBlend:styleBlend, kibbeTypeName, topStyleWords, visitorId: profile.visitorId, authToken: profile.token, isPremium, onUpgrade:openPaywall });
  else if(screen === "community") body = e(CommunityScreen, { profile, blend, onOpenProfile:openProfile });
  else if(screen === "notifications") body = e(NotificationsScreen, { profile, onBack:()=>goTo("home"), onOpenProfile:openProfile, onOpenConversation:openConversation });
  else if(screen === "inbox") body = e(InboxScreen, { profile, onBack:()=>goTo("home"), onOpenConversation:openConversation });

  return e("div", { className:"app" },
    e("header", { className:"topbar" },
      e("span", { className:"wordmark", style:{ display:"inline-flex", alignItems:"center", gap:"0.12em" } },
        e(LogoMark, { size:"0.85em" }), "Style-LORE"),
      e("div", { style:{ display:"flex", alignItems:"center", gap:8 } },
        e("span", { className:"topbar-sub" }, viewingConversation ? "messages" : viewingProfileId ? "profile" : screen),
        e("div", { className:"topbar-icons" },
          e("button", { className:"topbar-icon-btn", "aria-label":"Notifications", onClick:()=>goTo("notifications") },
            Icon("bell"),
            unreadNotifCount > 0 ? e("span", { className:"topbar-icon-badge" }, unreadNotifCount > 9 ? "9+" : unreadNotifCount) : null
          ),
          e("button", { className:"topbar-icon-btn", "aria-label":"Messages", onClick:()=>goTo("inbox") },
            Icon("mail"),
            unreadMsgCount > 0 ? e("span", { className:"topbar-icon-badge" }, unreadMsgCount > 9 ? "9+" : unreadMsgCount) : null
          )
        )
      )
    ),
    e("main", { className:"app-main" }, body),
    e(BottomNav, { screen, onNavigate:goTo }),
    paywallReason ? e(PaywallSheet, {
      reason: paywallReason,
      onClose: () => setPaywallReason(null),
      onPurchased: () => { setIsPremium(true); setPaywallReason(null); },
    }) : null
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
})();
</script>

</body>
</html>
