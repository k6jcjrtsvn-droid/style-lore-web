<style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;0,6..96,800;1,6..96,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#FBF0F3;
    --paper-raised:#FFF8F9;
    --ink:#2E1620;
    --ink-soft:#6C4C56;
    --line:#EACBD3;
    --line-soft:#F2DEE3;
    --accent:#C92C69;
    --accent-ink:#FFF7F9;
    --accent-soft:#F7D9E5;
    --danger:#B3483D;
    --danger-soft:#F3DFDA;
    --good:#4C6A45;
    --good-soft:#E4EBDF;

    --kibbe-dramatic:#24243D;
    --kibbe-soft-dramatic:#4B2142;
    --kibbe-flamboyant-natural:#7A4A24;
    --kibbe-natural:#4F6B3A;
    --kibbe-soft-natural:#8C7A5C;
    --kibbe-dramatic-classic:#1F3A5C;
    --kibbe-classic:#35577A;
    --kibbe-soft-classic:#6C84A0;
    --kibbe-flamboyant-gamine:#B3491C;
    --kibbe-gamine:#B3821F;
    --kibbe-soft-gamine:#C98BA0;
    --kibbe-theatrical-romantic:#7C2348;
    --kibbe-romantic:#A15A73;

    --shadow: 0 1px 2px rgba(28,26,22,.06), 0 8px 24px -12px rgba(28,26,22,.18);
    --radius-s: 6px;
    --radius-m: 12px;
    --radius-l: 20px;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1015;
      --paper-raised:#25141A;
      --ink:#F6E6EB;
      --ink-soft:#BB93A1;
      --line:#3D212B;
      --line-soft:#2D181F;
      --accent:#F0A0C4;
      --accent-ink:#2E0F1C;
      --accent-soft:#472531;
      --danger:#E08579;
      --danger-soft:#3A2320;
      --good:#9FBB8F;
      --good-soft:#212B1D;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1015;
    --paper-raised:#25141A;
    --ink:#F6E6EB;
    --ink-soft:#BB93A1;
    --line:#3D212B;
    --line-soft:#2D181F;
    --accent:#F0A0C4;
    --accent-ink:#2E0F1C;
    --accent-soft:#472531;
    --danger:#E08579;
    --danger-soft:#3A2320;
    --good:#9FBB8F;
    --good-soft:#212B1D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  html{scrollbar-color: var(--line) transparent;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  /* On a wide (desktop-browser) viewport, frame the app like a card floating
     on a soft backdrop instead of flush pink-on-pink edge to edge. */
  @media (min-width:560px){
    body{
      background:
        radial-gradient(1200px 800px at 15% -10%, var(--accent-soft) 0%, transparent 55%),
        radial-gradient(1000px 700px at 100% 100%, var(--line-soft) 0%, transparent 50%),
        var(--paper);
      padding:32px 16px;
    }
    .app{
      box-shadow: 0 1px 3px rgba(28,10,18,.06), 0 24px 60px -24px rgba(28,10,18,.35);
      border-radius: var(--radius-l);
      min-height:calc(100vh - 64px);
      overflow:hidden;
    }
  }
  #root{min-height:100vh;}
  ::selection{background:var(--accent-soft); color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}
  input,textarea{font-family:inherit;}
  img{max-width:100%;}

  /* Slim, on-brand scrollbar (WebKit/Chromium) */
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:999px; border:2px solid var(--paper);}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-soft);}

  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums;}
  .display{font-family:'Bodoni Moda', Georgia, 'Times New Roman', serif;}

  h1,h2,h3{text-wrap:balance; margin:0;}
  p{margin:0;}

  button{cursor:pointer; border:none; background:none; color:inherit;}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  button:disabled{opacity:.5; cursor:not-allowed;}

  /* ---------- App shell ---------- */
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    position:relative;
  }
  .app-main{

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
(function(){
"use strict";
const e = React.createElement;
const { useState, useEffect, useRef, useCallback } = React;

/* =====================================================================
   BACK BUTTON — makes the phone/tablet's hardware or browser back button
   close whatever's on top (a sheet, the story viewer, a profile, a DM
   thread) instead of leaving the app.

   Two pieces:
   1. useBackClose() — for any modal/sheet that's simply mounted while
      open and unmounted while closed (ComposeSheet, EditProfileSheet,
      CreateGroupSheet, AddStorySheet, StoryViewerOverlay). Call it with
      no arguments at the top of the component; it pushes one history
      entry on mount and consumes it on unmount, wiring itself into the
      shared stack below.
   2. The shared stack + a single popstate listener. Only one listener
      for the whole app — whichever layer is on top gets the back press.
      A "suppress" counter avoids double-handling: when a layer is
      closed by an explicit tap (not the back button), we consume its
      history entry ourselves via history.go(), and that entry's own
      popstate event needs to be ignored rather than closing whatever
      layer happens to be on top by then.
===================================================================== */
const _backStack = [];
let _backSeq = 0;
let _suppressPopEvents = 0;
window.addEventListener("popstate", () => {
  if(_suppressPopEvents > 0){ _suppressPopEvents--; return; }
  const top = _backStack.pop();
  if(top) top.close();
});
function useBackClose(onClose){
  const onCloseRef = useRef(onClose);
  onCloseRef.current = onClose;
  useEffect(() => {
    const token = ++_backSeq;
    _backStack.push({ token, close: () => onCloseRef.current() });
    try{ window.history.pushState({ backToken: token }, ""); }catch(err){}
    return () => {
      const idx = _backStack.findIndex(x => x.token === token);
      if(idx !== -1){
        _backStack.splice(idx, 1);
        _suppressPopEvents++;
        try{ window.history.back(); }
        catch(err){ _suppressPopEvents--; }
      }
    };
  }, []);
}

/* =====================================================================
   DATA
===================================================================== */

/* Kibbe typing runs on a 5-family structural core (Dramatic / Natural /
   Classic / Gamine / Romantic), each of which can carry a secondary yin
   (soft, curved) or yang (sharp, structured) influence that resolves it
   down to one of 13 named image identities. FAMILIES drives the body
   questions and the "body type" structural read; KIBBE_TYPES is the full
   13-way result, matched from a family blend + a separate yin/yang
   modifier score via nearest-target-vector matching (matchKibbeType). */
const FAMILIES = [
  { id:"dramatic", name:"Dramatic", color:"var(--kibbe-dramatic)" },
  { id:"natural", name:"Natural", color:"var(--kibbe-natural)" },
  { id:"classic", name:"Classic", color:"var(--kibbe-classic)" },
  { id:"gamine", name:"Gamine", color:"var(--kibbe-gamine)" },
  { id:"romantic", name:"Romantic", color:"var(--kibbe-romantic)" },
];
const FAMILY_BY_ID = Object.fromEntries(FAMILIES.map(x => [x.id, x]));

const KIBBE_TYPES = [
  { id:"dramatic", name:"Dramatic", family:"dramatic", color:"var(--kibbe-dramatic)", tag:"Long lines, sharp edges, big statements.",
    desc:"Your frame reads tall, sharp, and elongated — every line looks like it was drawn with a straightedge. Clothes work best when they follow that same architecture: crisp tailoring, long unbroken column shapes, and one bold focal point rather than a lot of small details." },
  { id:"soft-dramatic", name:"Soft Dramatic", family:"dramatic", color:"var(--kibbe-soft-dramatic)", tag:"Sharp lines, softened by curve.",
    desc:"You carry Dramatic's height and angularity, but with a fuller, more fluid undertone running through it. The look that works is still long and striking, just built in fabrics and shapes that drape and pool instead of standing stiff — a sharp silhouette in a soft, liquid fabric." },
  { id:"flamboyant-natural", name:"Flamboyant Natural", family:"natural", color:"var(--kibbe-flamboyant-natural)", tag:"Broad-boned, elongated, easy in scale.",
    desc:"You've got Natural's broad, blunt bone structure stretched out over a taller, more elongated frame. Clothes should stay unfussy and slightly oversized in scale, but can carry more length and drama than typical Natural pieces — a long open jacket rather than a cropped one." },
  { id:"natural", name:"Natural", family:"natural", color:"var(--kibbe-natural)", tag:"Blunt, broad, unfussy.",
    desc:"Your bone structure and features read broad and blunt rather than sharp or curved — a genuinely relaxed, athletic line. The most flattering clothes are similarly unstructured: soft tailoring, natural fibers, easy movement, and nothing that fights the body with tight seaming or delicate detail." },
  { id:"soft-natural", name:"Soft Natural", family:"natural", color:"var(--kibbe-soft-natural)", tag:"Broad frame, softened edges.",
    desc:"You share Natural's relaxed, broad-boned foundation, but with extra softness in the flesh and features that takes the edge off. Look for clothes that stay easy and unstructured like Natural's, but choose fabrics with a bit of weight and drape rather than anything stiff or crisp." },
  { id:"dramatic-classic", name:"Dramatic Classic", family:"classic", color:"var(--kibbe-dramatic-classic)", tag:"Balanced lines, sharpened.",
    desc:"You have Classic's clean, even proportions, but with an added crispness and angularity that wants a slightly bolder hand. Tailored, symmetrical pieces are still the foundation, just with sharper collars, straighter lines, and less embellishment than a pure Classic would wear." },
  { id:"classic", name:"Classic", family:"classic", color:"var(--kibbe-classic)", tag:"Balanced, clean, symmetrical.",
    desc:"Your proportions sit in true balance — no strong curve or sharp angle dominates. Tailored, well-proportioned clothing with clean lines and moderate detail will always look intentional on you; the goal is polish and symmetry rather than a strong directional statement." },
  { id:"soft-classic", name:"Soft Classic", family:"classic", color:"var(--kibbe-soft-classic)", tag:"Balanced lines, softened.",
    desc:"You carry Classic's even, balanced proportions with an added gentleness in the flesh and features. Tailored pieces still look best, but with softer fabrics, rounded necklines, and slightly more curve in the silhouette than a pure Classic would choose." },
  { id:"flamboyant-gamine", name:"Flamboyant Gamine", family:"gamine", color:"var(--kibbe-flamboyant-gamine)", tag:"Compact frame, sharp contrast.",
    desc:"You're compact in scale with features or coloring that create real contrast — dark against light, sharp against round. Play that contrast up rather than smoothing it over: mix unexpected pieces, bold color blocking, and playful proportions in petite scale." },
  { id:"gamine", name:"Gamine", family:"gamine", color:"var(--kibbe-gamine)", tag:"Compact, mixed, playful.",
    desc:"Your frame is small and neat, and your features blend both angular and curved qualities rather than settling on one. Clothes that mix textures or proportions in unexpected combinations — a structured jacket with a soft skirt — read better on you than anything too uniform or too matronly." },
  { id:"soft-gamine", name:"Soft Gamine", family:"gamine", color:"var(--kibbe-soft-gamine)", tag:"Compact frame, curve-leaning.",
    desc:"You share Gamine's small, mixed-feature frame, but the curved, soft qualities outweigh the sharp ones. Playful mixed proportions still work, just lean toward rounder necklines, softer fabrics, and a touch more curve in the silhouette than a Flamboyant Gamine would wear." },
  { id:"theatrical-romantic", name:"Theatrical Romantic", family:"romantic", color:"var(--kibbe-theatrical-romantic)", tag:"Curved lines, sharpened.",
    desc:"You have Romantic's soft, curved foundation with an added touch of structure or angularity running through it. Fitted, curve-following silhouettes are still the goal, but with a crisper edge — a defined waist, a sharper neckline — rather than an entirely soft, flowing shape." },
  { id:"romantic", name:"Romantic", family:"romantic", color:"var(--kibbe-romantic)", tag:"Curved, soft, rounded.",
    desc:"Every line on you reads round and soft rather than straight or sharp. Clothing that follows and celebrates those curves — fitted waists, soft draping, rounded necklines — will always sit better than boxy or severely tailored shapes that fight the body's natural curve." },
];
const KIBBE_BY_ID = Object.fromEntries(KIBBE_TYPES.map(x => [x.id, x]));

/* Target vectors for nearest-match resolution: 5 family fractions (sum to
   1) plus a yin(-1)/yang(+1) modifier. Pure families sit at their own
   corner with mod 0; each variant leans mostly into its family with a
   30% secondary family plus a moderate modifier in the matching direction. */
const KIBBE_TARGETS = [
  { id:"dramatic", vec:{ dramatic:1, mod:0 } },
  { id:"soft-dramatic", vec:{ dramatic:.7, romantic:.3, mod:-.6 } },
  { id:"flamboyant-natural", vec:{ natural:.7, dramatic:.3, mod:.6 } },
  { id:"natural", vec:{ natural:1, mod:0 } },
  { id:"soft-natural", vec:{ natural:.7, romantic:.3, mod:-.6 } },
  { id:"dramatic-classic", vec:{ classic:.7, dramatic:.3, mod:.6 } },
  { id:"classic", vec:{ classic:1, mod:0 } },
  { id:"soft-classic", vec:{ classic:.7, romantic:.3, mod:-.6 } },
  { id:"flamboyant-gamine", vec:{ gamine:.7, dramatic:.3, mod:.6 } },
  { id:"gamine", vec:{ gamine:1, mod:0 } },
  { id:"soft-gamine", vec:{ gamine:.7, romantic:.3, mod:-.6 } },
  { id:"theatrical-romantic", vec:{ romantic:.7, dramatic:.3, mod:.6 } },
  { id:"romantic", vec:{ romantic:1, mod:0 } },
];

/* =====================================================================
   ON-DEVICE STYLE RUBRIC — Closet verdicts & Checker fit checks
   Everything below runs entirely in the browser: no network call, no
   API key, no external service. It is a small rule-based "expert
   system" that reads a free-text item description for style-language
   keywords, compares the result against the ideal traits for the
   person's Kibbe blend, and returns a plain-language verdict. It is
   not a substitute for a trained eye — it is a quick, private,
   offline gut-check.
===================================================================== */

const STYLE_AXES = [
  { id:"structure",      lowLabel:"soft & relaxed",     highLabel:"crisp & structured" },
  { id:"ornamentation",  lowLabel:"plain & minimal",     highLabel:"ornate & detailed" },
  { id:"line",           lowLabel:"curved & flowing",    highLabel:"angular & sharp" },
  { id:"scale",          lowLabel:"delicate & petite",   highLabel:"bold & oversized" },
];

const STYLE_AXIS_WORDS = {
  structure: [
    { value:1, words:["structured","tailored","crisp","stiff","boxy","sharp-shoulder","sharp shoulder","architectural","sculpted","rigid","suiting","blazer","trench"] },
    { value:0, words:["soft","relaxed","slouchy","unstructured","draped","fluid","flowy","loose","cozy","jersey","knit","slinky"] },
  ],
  ornamentation: [
    { value:1, words:["lace","ruffle","ruffled","embroidered","beaded","sequin","sequined","floral","frilly","bow","embellished","printed","pattern","patterned","detailed","fringe","tassel"] },
    { value:0, words:["plain","minimal","solid","clean","simple","unadorned","basic","sleek","understated"] },
  ],
  line: [
    { value:1, words:["angular","geometric","straight","boxy","asymmetric","asymmetrical","graphic","hard edge","pointed","sharp"] },
    { value:0, words:["curved","curvy","flowing","rounded","soft edge","wrap","bias-cut","bias cut","draped","circle skirt"] },
  ],
  scale: [
    { value:1, words:["oversized","chunky","statement","bold","voluminous","exaggerated","large","maxi","wide-leg","wide leg"] },
    { value:0, words:["delicate","petite","fitted","slim","dainty","fine","mini","cropped","tiny","skinny"] },
  ],
};

const FAMILY_AXIS_PROFILE = {
  dramatic: { structure:.9,  ornamentation:.15, line:.9,  scale:.8 },
  natural:  { structure:.25, ornamentation:.2,  line:.35, scale:.55 },
  classic:  { structure:.6,  ornamentation:.3,  line:.5,  scale:.45 },
  gamine:   { structure:.65, ornamentation:.45, line:.65, scale:.4 },
  romantic: { structure:.1,  ornamentation:.8,  line:.15, scale:.4 },
};

function extractStyleAxes(text){
  const t = " " + (text || "").toLowerCase() + " ";
  const out = {};
  for (const axisId of Object.keys(STYLE_AXIS_WORDS)){
    let hi = 0, lo = 0;
    const matched = [];
    for (const group of STYLE_AXIS_WORDS[axisId]){
      for (const w of group.words){
        if (t.includes(w)){
          if (group.value === 1) hi++; else lo++;
          matched.push(w);
        }
      }
    }
    if (hi + lo > 0){
      out[axisId] = { value: hi / (hi + lo), confidence: Math.min(1, (hi + lo) / 3), matched };
    }
  }
  return out;
}

function idealAxesFromBlend(blend){
  if (!blend) return null;
  const familyPct = { dramatic:0, natural:0, classic:0, gamine:0, romantic:0 };
  let total = 0;
  for (const kt of KIBBE_TYPES){
    const pct = blend[kt.id] || 0;
    familyPct[kt.family] = (familyPct[kt.family] || 0) + pct;
    total += pct;
  }
  if (total <= 0) return null;
  const ideal = {};
  for (const axisId of Object.keys(FAMILY_AXIS_PROFILE.dramatic)){
    let sum = 0;
    for (const fam of Object.keys(familyPct)) sum += (familyPct[fam] / total) * FAMILY_AXIS_PROFILE[fam][axisId];
    ideal[axisId] = sum;
  }
  return ideal;
}

/* Partial axis signals for a subset of the open-vocabulary STYLE_WORDS
   (see the Style Quiz) -- drawn straight from each word's own on-screen
   description, not guessed independently. Words with no clear silhouette
   signal (colorful, monochrome, vintage, retro) are left out on purpose
   rather than forced onto axes they don't actually describe. */
const STYLE_WORD_AXIS_HINTS = {
  boho:           { structure:.15, ornamentation:.75, line:.2 },
  classic:        { structure:.6,  ornamentation:.25, line:.5 },
  elegant:        { structure:.55, ornamentation:.35, line:.3 },
  street:         { structure:.35, scale:.65 },
  western:        { structure:.4,  ornamentation:.55 },
  minimalist:     { structure:.55, ornamentation:.05, scale:.35 },
  preppy:         { structure:.65, ornamentation:.35 },
  edgy:           { structure:.6,  line:.8,  scale:.6 },
  athleisure:     { structure:.25, scale:.5 },
  glamorous:      { ornamentation:.85, scale:.65 },
  cottagecore:    { structure:.15, ornamentation:.7,  line:.15 },
  effortless:     { structure:.25, ornamentation:.2 },
  sexy:           { structure:.5,  line:.35, scale:.25 },
  comfortable:    { structure:.1,  ornamentation:.15 },
  romantic:       { structure:.1,  ornamentation:.8,  line:.1 },
  sporty:         { structure:.35, ornamentation:.1 },
  polished:       { structure:.65, ornamentation:.25 },
  whimsical:      { ornamentation:.65, scale:.55 },
  bold:           { ornamentation:.55, scale:.85 },
  sophisticated:  { structure:.55, ornamentation:.2,  scale:.35 },
  playful:        { ornamentation:.6,  scale:.55 },
  rugged:         { structure:.35, scale:.6 },
  ethereal:       { structure:.1,  ornamentation:.55, line:.1 },
  structured:     { structure:.9 },
  relaxed:        { structure:.15 },
  eclectic:       { ornamentation:.6,  scale:.55 },
  feminine:       { structure:.2,  ornamentation:.55, line:.15 },
  androgynous:    { structure:.55, ornamentation:.15, line:.6 },
  luxe:           { structure:.5,  ornamentation:.5 },
  understated:    { ornamentation:.15, scale:.3 },
  statement:      { ornamentation:.6,  scale:.85 },
  flowy:          { structure:.1,  line:.1 },
  tailored:       { structure:.85, line:.55 },
  grunge:         { structure:.3,  ornamentation:.25, scale:.5 },
  coastal:        { structure:.2,  ornamentation:.25, scale:.4 },
  confident:      { scale:.6 },
};

/* Ideal axis targets from the person's own Style Quiz word blend, weighted
   by how strongly each word scored -- their stated taste, independent of
   what their Kibbe body-type blend says harmonizes with their frame. */
function idealAxesFromStyleWords(styleWordBlend){
  if (!styleWordBlend) return null;
  const sums = {}, weights = {};
  for (const wordId of Object.keys(styleWordBlend)){
    const hints = STYLE_WORD_AXIS_HINTS[wordId];
    const pct = styleWordBlend[wordId] || 0;
    if (!hints || pct <= 0) continue;
    for (const axisId of Object.keys(hints)){
      sums[axisId] = (sums[axisId] || 0) + hints[axisId] * pct;
      weights[axisId] = (weights[axisId] || 0) + pct;
    }
  }
  const out = {};
  for (const axisId of Object.keys(sums)) out[axisId] = sums[axisId] / weights[axisId];
  return Object.keys(out).length ? out : null;
}

/* The actual personalized target: blends "what harmonizes with your body's
   natural lines" (Kibbe blend) with "what you said you actually want to
   wear" (Style Quiz words) when both exist, so a verdict reflects the
   real person, not just their body-type math. Falls back cleanly to
   whichever signal is available if only one quiz has been taken. */
function idealAxesForPerson(profile){
  const fromKibbe = profile && profile.kibbeBlend ? idealAxesFromBlend(profile.kibbeBlend) : null;
  const fromWords = profile && profile.styleWordBlend ? idealAxesFromStyleWords(profile.styleWordBlend) : null;
  if (!fromKibbe && !fromWords) return null;
  const out = {};
  for (const axisId of STYLE_AXES.map(a => a.id)){
    const k = fromKibbe ? fromKibbe[axisId] : undefined;
    const w = fromWords ? fromWords[axisId] : undefined;
    if (k !== undefined && w !== undefined) out[axisId] = k * 0.6 + w * 0.4;
    else if (k !== undefined) out[axisId] = k;
    else if (w !== undefined) out[axisId] = w;
  }
  return Object.keys(out).length ? out : null;
}

function verdictFromExtractedAxes(extracted, profile, opts){
  opts = opts || {};
  const typeName = profile && profile.kibbeTypeName;
  const topStyleWords = (profile && profile.topStyleWords) || [];
  const axesFound = Object.keys(extracted);
  if (axesFound.length === 0){
    return {
      status:"unclear", score:null, verdictPill:"neutral",
      headline: opts.noSignalHeadline || "Not enough detail to judge",
      detail: opts.noSignalDetail || "Couldn't find enough to compare against your type.",
      axisNotes: [], personalWords: [],
    };
  }
  const ideal = idealAxesForPerson(profile);
  if (!ideal){
    return {
      status:"unclear", score:null, verdictPill:"neutral",
      headline:"Take the Kibbe quiz first",
      detail: opts.noIdealDetail || "Once your blend is set (the style quiz sharpens it further), the checker can compare this against it.",
      axisNotes: [], personalWords: [],
    };
  }
  let weightedDiff = 0, weightTotal = 0;
  const axisNotes = [];
  const topWordSet = new Set(topStyleWords);
  const personalWords = [];
  for (const axisId of axesFound){
    const info = extracted[axisId];
    const idealVal = ideal[axisId];
    const diff = idealVal === undefined ? null : Math.abs(info.value - idealVal);
    if (diff !== null){
      weightedDiff += diff * info.confidence;
      weightTotal += info.confidence;
    }
    const axisDef = STYLE_AXES.find(a => a.id === axisId);
    axisNotes.push({
      axis: axisId,
      matched: info.matched,
      itemReads: info.value >= 0.5 ? axisDef.highLabel : axisDef.lowLabel,
      typeWants: idealVal === undefined ? null : (idealVal >= 0.5 ? axisDef.highLabel : axisDef.lowLabel),
      aligned: diff === null ? true : diff < 0.35,
    });
    for (const w of info.matched){
      if (topWordSet.has(w) && !personalWords.includes(w)) personalWords.push(w);
    }
  }
  const avgDiff = weightTotal > 0 ? weightedDiff / weightTotal : 0.5;
  const score = Math.round((1 - avgDiff) * 100);
  const typeSuffix = typeName ? ` for your ${typeName} blend` : "";
  let status, headline, verdictPill;
  if (score >= 70){ status = "match"; verdictPill = "match"; headline = "Reads as a solid match" + typeSuffix; }
  else if (score >= 45){ status = "caution"; verdictPill = "neutral"; headline = "Mixed signals" + typeSuffix + " — could work with tweaks"; }
  else { status = "mismatch"; verdictPill = "avoid"; headline = "Fights " + (typeName ? "your " + typeName + " blend's" : "your type's") + " natural lines"; }
  const detail = typeof opts.scoredDetail === "function" ? opts.scoredDetail({ score, status }) : (opts.scoredDetail || null);
  return { status, score, verdictPill, headline, detail, axisNotes, personalWords };
}

function styleCheckVerdict(description, profile){
  const typeName = profile && profile.kibbeTypeName;
  const topStyleWords = (profile && profile.topStyleWords) || [];
  const extracted = extractStyleAxes(description);
  const against = typeName
    ? ` against your ${typeName} blend` + (topStyleWords.length ? ` and the words you leaned into on the style quiz (${topStyleWords.slice(0, 3).join(", ")})` : "")
    : " against your type";
  return verdictFromExtractedAxes(extracted, profile, {
    noSignalHeadline: "Not enough style detail to judge",
    noSignalDetail: 'Try naming the silhouette or fabric — words like "structured", "flowy", "embellished", "oversized", or "fitted" give the checker something concrete to compare' + against + '.',
    noIdealDetail: "Once your blend is set (the style quiz sharpens it further), the checker can compare this item's traits against it.",
  });
}

/* Photo-path counterpart to styleCheckVerdict() above — same shared
   verdictFromExtractedAxes() engine, fed axis evidence read from image
   pixels (see GarmentOnDeviceAnalyzer below) instead of typed words. */
function photoStyleVerdict(extractedAxes, profile, usedBodyCrop){
  return verdictFromExtractedAxes(extractedAxes, profile, {
    noSignalHeadline: "Couldn't read enough from that photo",
    noSignalDetail: "Try a clearer, well-lit photo with the outfit clearly visible against a plain background — that gives the on-device analyzer real edges and colors to read.",
    noIdealDetail: "Once your blend is set (the style quiz sharpens it further), the checker can compare this photo against it.",
    scoredDetail: usedBodyCrop
      ? "Read from the photo's structure, color palette, and how the outfit sits against your silhouette — not a professional styling opinion."
      : "Read from the photo's structure and color palette — not a professional styling opinion.",
  });
}

function styleGapAnalysis(closet, profile){
  const ideal = idealAxesForPerson(profile);
  if (!ideal || !closet || closet.length === 0) return null;
  const typeName = profile && profile.kibbeTypeName;
  const capsuleLabel = typeName ? `your ${typeName} capsule` : "your capsule";
  const sums = {}, weights = {};
  let itemsWithSignal = 0;
  for (const item of closet){
    const extracted = extractStyleAxes(item.description);
    if (Object.keys(extracted).length > 0) itemsWithSignal++;
    for (const axisId of Object.keys(extracted)){
      sums[axisId] = (sums[axisId] || 0) + extracted[axisId].value * extracted[axisId].confidence;
      weights[axisId] = (weights[axisId] || 0) + extracted[axisId].confidence;
    }
  }
  const gaps = [];
  const gapLabels = [];
  for (const axisId of Object.keys(ideal)){
    if (!weights[axisId] || weights[axisId] < 0.6) continue;
    const closetAvg = sums[axisId] / weights[axisId];
    const diff = ideal[axisId] - closetAvg;
    if (Math.abs(diff) >= 0.22){
      const axisDef = STYLE_AXES.find(a => a.id === axisId);
      const wantLabel = diff > 0 ? axisDef.highLabel : axisDef.lowLabel;
      gaps.push(`Your logged pieces lean away from ${wantLabel} — a few more items that read ${wantLabel} would round out ${capsuleLabel}.`);
      gapLabels.push(wantLabel);
    }
  }
  return { itemsWithSignal, totalItems: closet.length, gaps, gapLabels };
}

/* =====================================================================
   AFFILIATE SHOPPING SCAFFOLD — placeholder-safe by design. No product
   names, prices, or images are fabricated here; this only builds a real,
   live outbound search a person could just as easily run themselves, so
   there's nothing dishonest to show before Kenneth has an actual
   affiliate feed. Swap shopSearchUrl()'s body for a real ShopStyle
   Collective API/deep-link call once that account is approved (see
   claude/monetization-setup-checklist.md) — every caller of ShopTheGap
   below stays exactly the same either way, since they only ever pass a
   style-axis label ("crisp & structured"), never a product.
===================================================================== */
function shopSearchUrl(query){
  return "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(query + " women's fashion");
}
function shopQueryFromAxisLabel(label){
  return label.replace(/\s*&\s*/g, " ") + " clothing";
}
// Small row of outbound "Shop [label]" links for a set of style-axis
// labels (e.g. from a closet gap-analysis miss, or a checker verdict's
// non-aligned axes) — dedups and caps at 3 so this never crowds out the
// actual verdict/analysis above it.
function ShopTheGap({ labels }){
  const unique = Array.from(new Set((labels || []).filter(Boolean))).slice(0, 3);
  if (unique.length === 0) return null;
  return e("div", { style:{ display:"flex", flexWrap:"wrap", gap:8, marginTop:10, marginBottom:16 } },
    unique.map(label => e("a", {
      key:label, href: shopSearchUrl(shopQueryFromAxisLabel(label)),
      target:"_blank", rel:"noopener noreferrer",
      style:{ padding:"6px 12px", border:"1px solid var(--line)", borderRadius:20, fontSize:12.5, color:"var(--ink)", textDecoration:"none" },
    }, "Shop " + label))
  );
}

/* The single Kibbe type id with the highest weight in a blend map (the
   shape stored in kibbeBlend / returned as profileRow.kibbeBlend) — used
   by compareProfiles below instead of trusting a separately-synced
   display-name string, so a compare is correct even if that summary
   field is stale or missing. */
function topKibbeTypeId(blend){
  if(!blend) return null;
  let bestId = null, bestPct = -1;
  for(const id of Object.keys(blend)){
    const pct = blend[id] || 0;
    if(pct > bestPct){ bestPct = pct; bestId = id; }
  }
  return bestPct > 0 ? bestId : null;
}

/* Compares two people's own quiz results — reuses the same
   idealAxesForPerson() engine the Checker and Closet gap-analysis use, so
   "how similar are we" is computed the identical way "does this item
   match me" is: same four structure/ornamentation/line/scale axes, same
   60/40 Kibbe-blend/Style-Quiz-word weighting. Entirely on-device, same
   as the rest of this rubric — no account, key, or network call needed to
   render a comparison once both people's data is in hand (see
   ProfileScreen's CompareSheet, which fetches the other person's data via
   the ordinary GET /api/profiles/:id call before rendering this).
   `a` and `b` are profile-like objects: { kibbeBlend, styleWordBlend,
   topStyleWords }. Returns { ready:false, ... } when one or both people
   haven't taken either quiz yet, rather than guessing. */
function compareProfiles(a, b){
  const aHasData = !!(a && (a.kibbeBlend || a.styleWordBlend));
  const bHasData = !!(b && (b.kibbeBlend || b.styleWordBlend));
  if(!aHasData || !bHasData){
    return { ready:false, missingA: !aHasData, missingB: !bHasData };
  }

  const axesA = idealAxesForPerson(a);
  const axesB = idealAxesForPerson(b);
  const axisRows = [];
  let simSum = 0, simCount = 0;
  if(axesA && axesB){
    for(const axisDef of STYLE_AXES){
      const av = axesA[axisDef.id], bv = axesB[axisDef.id];
      if(av === undefined || bv === undefined) continue;
      const diff = Math.abs(av - bv);
      simSum += (1 - diff);
      simCount++;
      axisRows.push({
        axis: axisDef.id,
        aLabel: av >= 0.5 ? axisDef.highLabel : axisDef.lowLabel,
        bLabel: bv >= 0.5 ? axisDef.highLabel : axisDef.lowLabel,
        aligned: diff < 0.25,
      });
    }
  }
  const overallScore = simCount > 0 ? Math.round((simSum / simCount) * 100) : null;

  const aWords = a.topStyleWords || [];
  const bWordSet = new Set(b.topStyleWords || []);
  const sharedWords = aWords.filter(w => bWordSet.has(w));

  const aTypeId = topKibbeTypeId(a.kibbeBlend);
  const bTypeId = topKibbeTypeId(b.kibbeBlend);
  const sameType = !!(aTypeId && bTypeId && aTypeId === bTypeId);
  const aFamily = aTypeId ? KIBBE_BY_ID[aTypeId].family : null;
  const bFamily = bTypeId ? KIBBE_BY_ID[bTypeId].family : null;
  const sameFamily = !!(aFamily && bFamily && aFamily === bFamily);

  let headline;
  if(overallScore !== null){
    if(overallScore >= 75) headline = "Very similar style profiles";
    else if(overallScore >= 50) headline = "Some real overlap, some differences";
    else headline = "Fairly different style profiles";
  } else {
    headline = sameType ? "Same Kibbe type" : (sharedWords.length ? "Some shared style words" : "Not enough overlapping data yet");
  }

  return {
    ready: true,
    overallScore,
    axisRows,
    sharedWords,
    sameType,
    sameFamily,
    aTypeName: aTypeId ? KIBBE_BY_ID[aTypeId].name : (a.kibbeTypeName || null),
    bTypeName: bTypeId ? KIBBE_BY_ID[bTypeId].name : (b.kibbeTypeName || null),
    headline,
  };
}

function computeModScore(answers){
  let sum = 0, count = 0;
  MOD_QUESTIONS.forEach(q => {
    const idx = answers[q.id];
    if(idx === undefined || idx === null) return;
    const opt = q.options[idx];
    if(!opt || opt.mod === null || opt.mod === undefined) return;
    sum += opt.mod; count += 1;
  });
  return count ? sum / count : 0;

function initialsOf(name){
  const parts = (name || "?").trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return "?";
  if(parts.length === 1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

/* Generic weighted-blend engine — works over any {id: weight} scoring as
   long as you pass the list of category metadata (ids) it should total
   against. Reused for the family blend (FAMILIES), the 13-way Kibbe
   display blend, and the style-language blend (STYLE_WORDS). */
// Optional, skippable lean for the Style Quiz's word round (see the
// "Shopping for…" selector on its intro screen). Covers roughly a
// quarter of STYLE_WORDS — the ones with a clear traditional lean — and
// leaves the rest (androgynous included) untouched either way. When set,
// it only nudges words the person's own answers already scored some
// weight on; it never introduces a word they didn't earn. Left unset
// (skipped, or "Both"), scoring is byte-for-byte the same as before this
// selector existed.
const STYLE_GENDER_LEAN = {
  western:1, athleisure:1, sporty:1, rugged:1, street:1, structured:1, tailored:1, edgy:1, grunge:1, preppy:1,
  romantic:-1, feminine:-1, ethereal:-1, glamorous:-1, cottagecore:-1, boho:-1, whimsical:-1, flowy:-1, elegant:-1, sexy:-1,
};
const GENDER_LEAN_BOOST = 1.2;

function computeBlend(answers, questions, ids, genderLean){
  const totals = {};
  ids.forEach(x => totals[x.id] = 0);
  questions.forEach(q => {
    const chosenIdx = answers[q.id];
    if(chosenIdx === undefined || chosenIdx === null) return;
    const opt = q.options[chosenIdx];
    if(!opt || !opt.w) return;
    Object.entries(opt.w).forEach(([id, w]) => { totals[id] = (totals[id]||0) + w; });
  });
  if(genderLean === "men" || genderLean === "women"){
    const dir = genderLean === "men" ? 1 : -1;
    Object.keys(totals).forEach(id => {
      if(STYLE_GENDER_LEAN[id] === dir) totals[id] = totals[id] * GENDER_LEAN_BOOST;
    });
  }
  return normalizeBlend(totals, ids);
}

function normalizeBlend(totals, ids){
  const sum = Object.values(totals).reduce((a,b) => a+b, 0);
  const pct = {};
  ids.forEach(x => {
    pct[x.id] = sum > 0 ? Math.round((totals[x.id]||0) / sum * 100) : 0;
  });
  let diff = 100 - Object.values(pct).reduce((a,b)=>a+b,0);
  if(sum > 0 && diff !== 0){
    const order = ids.map(x=>x.id).sort((a,b) => pct[b]-pct[a]);
    pct[order[0]] += diff;
  }
  return pct;
}

function mergeBlends(a, b, weightA, weightB, ids){
  const out = {};
  ids.forEach(x => {
    out[x.id] = Math.round((a[x.id]||0) * weightA + (b[x.id]||0) * weightB);
  });
  let diff = 100 - Object.values(out).reduce((s,v)=>s+v,0);
  if(diff !== 0){
    const order = ids.map(x=>x.id).sort((x,y) => out[y]-out[x]);
    out[order[0]] += diff;
  }
  return out;
}

function sortedBlend(blend, ids){
  return ids
    .map(x => ({ ...x, pct: blend[x.id]||0 }))
    .sort((a,b) => b.pct - a.pct);
}

function topBlendLabel(blend, ids){
  const sorted = sortedBlend(blend, ids);
  if(!sorted.length || sorted[0].pct === 0) return null;
  if(sorted[1] && sorted[1].pct >= sorted[0].pct * 0.6 && sorted[1].pct >= 15){
    return sorted[0].name + " · " + sorted[1].name;
  }
  return sorted[0].name;
}

/* Returns however many words from an open vocabulary blend actually
   scored above zero (capped at n) — a style-language result should be
   "however many words fit," not padded out to a fixed count. */
function topWords(blend, ids, n){
  return sortedBlend(blend, ids).filter(x => x.pct > 0).slice(0, n || 4);
}

/* Resolves a family blend + yin/yang modifier down to one of the 13
   Kibbe types via weighted Euclidean distance in a 6-dimensional space
   (5 family fractions + modifier), converted to a full 13-way pseudo-
   blend via inverse-distance normalization so the existing BlendBar/
   BlendList components can display it unchanged. */
function matchKibbeType(familyPct, modScore){
  const f = {};
  FAMILIES.forEach(x => f[x.id] = (familyPct[x.id]||0) / 100);
  const dists = KIBBE_TARGETS.map(t => {
    let sq = 0;
    FAMILIES.forEach(x => { sq += Math.pow((f[x.id]||0) - (t.vec[x.id]||0), 2); });
    sq += Math.pow(((modScore||0) - (t.vec.mod||0)) * 0.5, 2);
    return { id:t.id, d:Math.sqrt(sq) };
  });
  const best = dists.reduce((a,b) => b.d < a.d ? b : a, dists[0]);
  const inv = dists.map(x => ({ id:x.id, w: 1/(x.d+0.08) }));
  const invSum = inv.reduce((s,x)=>s+x.w,0);
  const blend = {};
  inv.forEach(x => { blend[x.id] = Math.round(x.w/invSum*100); });
  let diff = 100 - Object.values(blend).reduce((a,b)=>a+b,0);
  if(diff !== 0) blend[best.id] += diff;
  const confidence = Math.max(30, Math.min(99, Math.round((1 - best.d/1.1) * 100)));
  return { typeId: best.id, blend, confidence };
}

function matchSeason(features){
  const f = { undertone:.5, depth:.5, chroma:.5, contrast:.5, ...features };
  let best = COLOR_SEASONS[0], bestDist = Infinity;
  COLOR_SEASONS.forEach(s => {
    const t = s.target;
    const d = Math.sqrt(
      Math.pow(f.undertone - t.undertone, 2) +
      Math.pow(f.depth - t.depth, 2) +
      Math.pow(f.chroma - t.chroma, 2) +
      Math.pow(f.contrast - t.contrast, 2)
    );
    if(d < bestDist){ bestDist = d; best = s; }
  });
  const confidence = Math.max(30, Math.min(99, Math.round((1 - bestDist / 1.2) * 100)));
  return { season: best, confidence };
}

function computeColorFeatures(answers){
  const sums = { undertone:0, depth:0, chroma:0, contrast:0 };
  const counts = { undertone:0, depth:0, chroma:0, contrast:0 };
  COLOR_QUESTIONS.forEach(q => {
    const idx = answers[q.id];
    if(idx === undefined || idx === null) return;
    const opt = q.options[idx];
    if(!opt) return;
    Object.entries(opt.v).forEach(([axis, val]) => { sums[axis] += val; counts[axis] += 1; });
  });
  const features = {};
  Object.keys(sums).forEach(axis => { features[axis] = counts[axis] ? sums[axis] / counts[axis] : .5; });
  return features;
}

function mergeFeatures(a, b, wa, wb){
  const out = {};
  ["undertone","depth","chroma","contrast"].forEach(k => {
    out[k] = (a && a[k] !== undefined ? a[k] : .5) * wa + (b && b[k] !== undefined ? b[k] : .5) * wb;
  });
  return out;
}

// sRGB -> CIE Lab (D65), used to turn a sampled photo pixel into
// perceptually-meaningful lightness/color values.
function rgbToLab(r, g, b){
  function lin(c){ c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  const R = lin(r), G = lin(g), B = lin(b);
  let X = R*0.4124564 + G*0.3575761 + B*0.1804375;
  let Y = R*0.2126729 + G*0.7151522 + B*0.0721750;
  let Z = R*0.0193339 + G*0.1191920 + B*0.9503041;
  X /= 0.95047; Y /= 1.0; Z /= 1.08883;
  function f(t){ return t > 0.008856 ? Math.cbrt(t) : (7.787*t + 16/116); }
  const fx = f(X), fy = f(Y), fz = f(Z);
  return { L: 116*fy - 16, a: 500*(fx-fy), b: 200*(fy-fz) };
}

function samplePixel(canvas, x, y, radius){
  const ctx = canvas.getContext("2d");
  const r = radius || 4;
  const sx = Math.max(0, Math.min(canvas.width - 1, Math.round(x - r)));
  const sy = Math.max(0, Math.min(canvas.height - 1, Math.round(y - r)));
  const w = Math.max(1, Math.min(canvas.width - sx, r*2 + 1));
  const h = Math.max(1, Math.min(canvas.height - sy, r*2 + 1));
  const data = ctx.getImageData(sx, sy, w, h).data;
  let rt=0, gt=0, bt=0, n=0;
  for(let i=0; i<data.length; i+=4){ rt+=data[i]; gt+=data[i+1]; bt+=data[i+2]; n++; }
  return { r: rt/n, g: gt/n, b: bt/n };
}

// Turn three sampled photo colors (skin, hair, eye) into the same
// undertone/depth/chroma/contrast axes the color quiz produces, so a
// photo read can be blended 50/50 with quiz answers by mergeFeatures().
function featuresFromSamples(skinRGB, hairRGB, eyeRGB){
  const skin = rgbToLab(skinRGB.r, skinRGB.g, skinRGB.b);
  const hair = rgbToLab(hairRGB.r, hairRGB.g, hairRGB.b);
  const eye = rgbToLab(eyeRGB.r, eyeRGB.g, eyeRGB.b);
  const avgL = skin.L * 0.6 + hair.L * 0.4;
  const depth = clamp01(1 - (avgL - 20) / (85 - 20));
  const warmth = skin.b - skin.a * 0.5;
  const undertone = clamp01((warmth + 10) / 45);
  const chromaRaw = Math.hypot(skin.a, skin.b) * 0.5 + Math.hypot(hair.a, hair.b) * 0.3 + Math.hypot(eye.a, eye.b) * 0.2;
  const chroma = clamp01(chromaRaw / 40);
  const spread = Math.max(Math.abs(skin.L - hair.L), Math.abs(skin.L - eye.L));
  const contrast = clamp01(spread / 55);
  return { undertone, depth, chroma, contrast };
}

function downscaleImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * maxDim/height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl){
  const parts = dataUrl.split(",");
  const mimeMatch = /data:(.*?);base64/.exec(parts[0]);
  const mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function timeAgo(ts){
  const s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
  if(s < 60) return s + "s ago";
  const m = Math.floor(s/60); if(m < 60) return m + "m ago";
  const h = Math.floor(m/60); if(h < 24) return h + "h ago";
  const d = Math.floor(h/24); if(d < 30) return d + "d ago";
  return new Date(ts).toLocaleDateString();
}

/* Short-video posts either upload a real file (handled server-side) or
   link out to wherever a longer clip already lives. YouTube/Vimeo links
   render as an inline embed; anything else renders as a plain "watch"
   link that opens in a new tab. */
function parseVideoLink(raw){
  if(!raw || !raw.trim()) return null;
  let url;
  try{ url = new URL(raw.trim()); }
  catch(err){ return null; }
  if(url.protocol !== "http:" && url.protocol !== "https:") return null;
  const host = url.hostname.replace(/^www\./, "").replace(/^m\./, "");
  if(host === "youtube.com" || host === "youtube-nocookie.com"){
    const shortMatch = url.pathname.match(/^\/shorts\/([\w-]+)/);
    const id = url.searchParams.get("v") || (shortMatch && shortMatch[1]);
    if(id) return { kind:"youtube", embed:"https://www.youtube-nocookie.com/embed/"+id, href:url.href };
  }
  if(host === "youtu.be"){
    const id = url.pathname.replace(/^\//, "").split("/")[0];
    if(id) return { kind:"youtube", embed:"https://www.youtube-nocookie.com/embed/"+id, href:url.href };
  }
  if(host === "vimeo.com"){
    const id = url.pathname.split("/").filter(Boolean)[0];
    if(id && /^\d+$/.test(id)) return { kind:"vimeo", embed:"https://player.vimeo.com/video/"+id, href:url.href };
  }
  return { kind:"link", href:url.href };
}

/* =====================================================================
   ON-DEVICE KIBBE PHOTO ANALYSIS (replaces the Anthropic-backed
   /api/kibbe/photo-analyze endpoint for the Kibbe-quiz photo-refine step
   only -- Closet's gap analysis and Checker's fit verdict are language-
   reasoning features, not vision, and are out of scope for this. They
   run their own separate on-device rubric (see STYLE_AXES et al. near
   KIBBE_TARGETS above) -- untouched by this comment block, just no
   longer gated behind an Anthropic key at all.

   Runs entirely in the browser via MediaPipe Tasks Vision (PoseLandmarker,
   "lite" model tier, loaded lazily from jsdelivr/storage.googleapis.com on
   first use -- never on page load). The photo never leaves the device.

   Full design rationale, the rubric's honest limitations (it estimates
   bone/scale proportions only -- it cannot measure flesh/soft-tissue curve
   or facial bone sharpness, both real Kibbe factors), and the synthetic-
   proportion tests that validated this scoring logic are written up in the
   "on-device-kibbe-photo-analysis" project doc.
===================================================================== */
const KibbeOnDeviceAnalyzer = (function(){
  const VISION_BUNDLE_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";
  const WASM_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";
  const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

  // ---- pose landmark indices (BlazePose topology) ----
  const LM = {
    NOSE:0, LEFT_EYE:2, RIGHT_EYE:5,
    LEFT_SHOULDER:11, RIGHT_SHOULDER:12, LEFT_ELBOW:13, RIGHT_ELBOW:14,
    LEFT_WRIST:15, RIGHT_WRIST:16, LEFT_HIP:23, RIGHT_HIP:24,
    LEFT_KNEE:25, RIGHT_KNEE:26, LEFT_ANKLE:27, RIGHT_ANKLE:28,
  };
  const REQUIRED_LANDMARKS = [
    LM.LEFT_SHOULDER, LM.RIGHT_SHOULDER, LM.LEFT_ELBOW, LM.RIGHT_ELBOW,
    LM.LEFT_WRIST, LM.RIGHT_WRIST, LM.LEFT_HIP, LM.RIGHT_HIP,
    LM.LEFT_KNEE, LM.RIGHT_KNEE, LM.LEFT_ANKLE, LM.RIGHT_ANKLE,
  ];
  const VISIBILITY_THRESHOLD = 0.5;
  const MIN_SEGMENT_METERS = 0.05;

  function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y, dz=(a.z||0)-(b.z||0); return Math.sqrt(dx*dx+dy*dy+dz*dz); }
  function midpoint(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2, z:((a.z||0)+(b.z||0))/2 }; }
  function clamp(x,lo,hi){ return Math.max(lo, Math.min(hi, x)); }

  function findGatingProblems(landmarks){
    const problems = [];
    if(!Array.isArray(landmarks) || landmarks.length < 29) return ["Pose detection didn't return a full set of body landmarks."];
    for(const idx of REQUIRED_LANDMARKS){
      const lm = landmarks[idx];
      if(!lm || typeof lm.visibility !== "number" || lm.visibility < VISIBILITY_THRESHOLD){
        problems.push("Landmark " + idx + " not visible enough.");
      }
    }
    return problems;
  }

  function computeRawRatios(landmarks){
    const gateProblems = findGatingProblems(landmarks);
    if(gateProblems.length > 0){
      const err = new Error("Couldn't get a clear enough full-body pose from that photo — try a photo with your whole body visible, standing normally.");
      err.gatingProblems = gateProblems;
      throw err;
    }
    const lShoulder=landmarks[LM.LEFT_SHOULDER], rShoulder=landmarks[LM.RIGHT_SHOULDER];
    const lElbow=landmarks[LM.LEFT_ELBOW], rElbow=landmarks[LM.RIGHT_ELBOW];
    const lWrist=landmarks[LM.LEFT_WRIST], rWrist=landmarks[LM.RIGHT_WRIST];
    const lHip=landmarks[LM.LEFT_HIP], rHip=landmarks[LM.RIGHT_HIP];
    const lKnee=landmarks[LM.LEFT_KNEE], rKnee=landmarks[LM.RIGHT_KNEE];
    const lAnkle=landmarks[LM.LEFT_ANKLE], rAnkle=landmarks[LM.RIGHT_ANKLE];

    const leftArmLen = dist(lShoulder,lElbow) + dist(lElbow,lWrist);
    const rightArmLen = dist(rShoulder,rElbow) + dist(rElbow,rWrist);
    const leftLegLen = dist(lHip,lKnee) + dist(lKnee,lAnkle);
    const rightLegLen = dist(rHip,rKnee) + dist(rKnee,rAnkle);

    const shoulderMid = midpoint(lShoulder,rShoulder);
    const hipMid = midpoint(lHip,rHip);
    const ankleMid = midpoint(lAnkle,rAnkle);
    const torsoLen = dist(shoulderMid, hipMid);

    const shoulderWidth = dist(lShoulder, rShoulder);
    const hipWidth = dist(lHip, rHip);
    const avgArmLen = (leftArmLen+rightArmLen)/2;
    const avgLegLen = (leftLegLen+rightLegLen)/2;

    const eyeMid = midpoint(landmarks[LM.LEFT_EYE]||landmarks[LM.NOSE], landmarks[LM.RIGHT_EYE]||landmarks[LM.NOSE]);
    const heightProxy = dist(eyeMid, ankleMid);

    const segments = [avgArmLen, avgLegLen, torsoLen, shoulderWidth, hipWidth, heightProxy];
    if(segments.some(s => !isFinite(s) || s < MIN_SEGMENT_METERS)){
      const err = new Error("Couldn't get a clear enough full-body pose from that photo — try a photo with your whole body visible, standing normally.");
      err.gatingProblems = ["One or more measured segments were degenerately small — likely a bad detection."];
      throw err;
    }

    const vli = (avgLegLen + avgArmLen) / torsoLen;
    const fsi = shoulderWidth / heightProxy;
    // Signed, not absolute -- positive means hips read wider than shoulders
    // (the hip-dominant/curvier read associated with Romantic), negative
    // means shoulders read wider or the frame is architectural/blunt
    // (Dramatic/Natural). See the project doc for why abs() was wrong here.
    const lbi = (hipWidth - shoulderWidth) / Math.max(shoulderWidth, hipWidth);
    return { vli, fsi, lbi };
  }

  // Directional heuristic constants (not a real anthropometric study) --
  // see the project doc for how these centers were derived.
  const NORMALIZATION = {
    vli: { center:3.0, spread:0.5 },
    fsi: { center:0.24, spread:0.05 },
    lbi: { center:0.0, spread:0.15 },
  };
  function normalize(raw){
    const n = (value, key) => clamp((value - NORMALIZATION[key].center) / NORMALIZATION[key].spread, -1, 1);
    return { vli:n(raw.vli,"vli"), fsi:n(raw.fsi,"fsi"), lbi:n(raw.lbi,"lbi") };
  }

  const FAMILY_TARGETS = {
    dramatic:{ vli:0.8, fsi:0.4, lbi:-0.6 },
    natural:{ vli:0.3, fsi:0.8, lbi:-0.7 },
    classic:{ vli:0.0, fsi:0.0, lbi:0.0 },
    gamine:{ vli:-0.4, fsi:-0.8, lbi:0.0 },
    romantic:{ vli:-0.6, fsi:-0.3, lbi:0.8 },
  };
  const AXIS_WEIGHTS = { vli:1.0, fsi:1.0, lbi:0.5 }; // lbi is the weakest, most-caveated axis
  const SOFTMAX_TEMPERATURE = 0.6;

  function softmax(values, temperature){
    const max = Math.max(...values);
    const exps = values.map(v => Math.exp((v-max)/temperature));
    const sum = exps.reduce((a,b)=>a+b, 0);
    return exps.map(e => e/sum);
  }

  function scoreNormalizedPoint(normalized){
    const families = Object.keys(FAMILY_TARGETS);
    const negDistances = families.map(fam => {
      const t = FAMILY_TARGETS[fam];
      const d2 = AXIS_WEIGHTS.vli*Math.pow(normalized.vli-t.vli,2)
               + AXIS_WEIGHTS.fsi*Math.pow(normalized.fsi-t.fsi,2)
               + AXIS_WEIGHTS.lbi*Math.pow(normalized.lbi-t.lbi,2);
      return -d2;
    });
    const weights = softmax(negDistances, SOFTMAX_TEMPERATURE);
    const blend = {};
    families.forEach((fam,i) => { blend[fam] = weights[i]; });
    return blend;
  }

  function analyzeLandmarks(worldLandmarks){
    const raw = computeRawRatios(worldLandmarks);
    const normalized = normalize(raw);
    return { blend: scoreNormalizedPoint(normalized) };
  }

  // ---- MediaPipe loading (lazy singleton -- never fetched until first use) ----
  let landmarkerPromise = null;
  async function getLandmarker(){
    if(!landmarkerPromise){
      landmarkerPromise = (async () => {
        const { FilesetResolver, PoseLandmarker } = await import(VISION_BUNDLE_URL);
        const filesetResolver = await FilesetResolver.forVisionTasks(WASM_BASE);
        return PoseLandmarker.createFromOptions(filesetResolver, {
          baseOptions: { modelAssetPath: MODEL_URL },
          runningMode: "IMAGE",
          numPoses: 1,
          outputSegmentationMasks: false,
        });
      })().catch(err => { landmarkerPromise = null; throw err; }); // allow retry on next call if loading failed
    }
    return landmarkerPromise;
  }

  function blobToImage(blob){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Couldn't read that photo — try another."));
      img.src = URL.createObjectURL(blob);
    });
  }

  async function analyzeKibbePhotoOnDevice(photoBlob){
    const img = await blobToImage(photoBlob);
    let landmarker;
    try{
      landmarker = await getLandmarker();
    }catch(err){
      URL.revokeObjectURL(img.src);
      throw new Error("Couldn't load the on-device analyzer — check your connection and try again.");
    }
    let result;
    try{
      result = landmarker.detect(img);
    }finally{
      URL.revokeObjectURL(img.src);
    }
    if(!result || !result.worldLandmarks || !result.worldLandmarks[0]){
      throw new Error("Couldn't detect a body pose in that photo — try a clearer, full-body photo.");
    }
    return analyzeLandmarks(result.worldLandmarks[0]);
  }

  return { analyzeKibbePhotoOnDevice };
})();

/* =====================================================================
   ON-DEVICE GARMENT PHOTO ANALYZER (Checker's photo path)

   Replaces the previous Anthropic-vision-backed /api/checker/photo call
   (see api/checker_photo.php, now unused by the frontend — kept only in
   case a real vision-AI opinion is wired back in later with a key).
   Estimates the same four STYLE_AXES (structure, ornamentation, line,
   scale) the text checker above reads from typed words — but reads them
   from actual image pixels instead — so the photo checker reuses the
   exact same verdictFromExtractedAxes() scoring the text checker uses.
   Runs entirely in the browser on a small downscaled canvas; the photo
   never leaves the device.

   Three signals, each mapped onto axis evidence:
    - Edge/gradient analysis (Sobel on luminance) -> structure (average
      edge sharpness) and line (edge-orientation spread: edges clustered
      into one or two directions reads angular/geometric — straight
      seams, lapels, hard creases; edges spread broadly across
      directions reads curved/flowing, since drape and curl scatter
      gradient angles).
    - Color-palette clustering (coarse 12-bucket hue histogram plus
      average saturation) -> ornamentation (more distinct hue clusters
      and finer edge texture reads as pattern/embellishment; one or two
      flat clusters and sparse edges reads plain/minimal) and contributes
      to scale (bold, saturated color reads as bold scale, same
      correlation FAMILY_AXIS_PROFILE already encodes for the text path).
    - When a full body is visible, reusing the same MediaPipe pose
      landmarker the Kibbe quiz's photo-refine step already loads
      (KibbeOnDeviceAnalyzer above) to crop to the torso/hip region and
      compare the crop's width against the skeleton's own shoulder/hip
      width — a coarse fitted-vs-loose proxy that sharpens structure and
      scale. This is a bounding-box heuristic, not a real garment
      segmentation (MediaPipe's pose model gives joints, not a garment
      mask).

   Like KibbeOnDeviceAnalyzer, this is a small rule-based heuristic, not
   a trained garment classifier — it can't read fabric texture, and it
   can't reliably tell a bold print from a busy background. See the
   "on-device-kibbe-photo-analysis" project doc for the fuller design
   writeup and known blind spots.
===================================================================== */
const GarmentOnDeviceAnalyzer = (function(){
  const VISION_BUNDLE_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";
  const WASM_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";
  const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  const MAX_DIM = 260; // small canvas keeps the Sobel/color passes fast even on low-end phones

  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  // ---- lazy pose-landmarker singleton, independent from
  // KibbeOnDeviceAnalyzer's own so neither module depends on the other's
  // internals; jsdelivr/browser caching keeps a second load cheap ----
  let landmarkerPromise = null;
  async function getLandmarker(){
    if(!landmarkerPromise){
      landmarkerPromise = (async () => {
        const { FilesetResolver, PoseLandmarker } = await import(VISION_BUNDLE_URL);
        const filesetResolver = await FilesetResolver.forVisionTasks(WASM_BASE);
        return PoseLandmarker.createFromOptions(filesetResolver, {
          baseOptions: { modelAssetPath: MODEL_URL },
          runningMode: "IMAGE",
          numPoses: 1,
          outputSegmentationMasks: false,
        });
      })().catch(err => { landmarkerPromise = null; throw err; });
    }
    return landmarkerPromise;
  }

  function blobToImage(blob){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("Couldn't read that photo — try another."));
      img.src = URL.createObjectURL(blob);
    });
  }

  function drawToCanvas(img, box){
    const sx = box ? box.x : 0, sy = box ? box.y : 0;
    const sw = box ? box.w : img.naturalWidth, sh = box ? box.h : img.naturalHeight;
    const scale = Math.min(1, MAX_DIM / Math.max(sw, sh, 1));
    const w = Math.max(1, Math.round(sw * scale)), h = Math.max(1, Math.round(sh * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d", { willReadFrequently:true });
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    return ctx.getImageData(0, 0, w, h);
  }

  // ---- edge / gradient pass (Sobel on luminance) ----
  const SOBEL_X = [-1,0,1,-2,0,2,-1,0,1];
  const SOBEL_Y = [-1,-2,-1,0,0,0,1,2,1];

  function toLuminance(imageData){
    const { data, width, height } = imageData;
    const lum = new Float32Array(width*height);
    for(let i=0, p=0; i<data.length; i+=4, p++){
      lum[p] = 0.2126*data[i] + 0.7152*data[i+1] + 0.0722*data[i+2];
    }
    return { lum, width, height };
  }

  function edgeAnalysis(imageData){
    const { lum, width, height } = toLuminance(imageData);
    let count=0, magSum=0, strongCount=0;
    const orientationBins = [0,0,0,0]; // folded 0..PI into 4 wedges
    for(let y=1; y<height-1; y++){
      for(let x=1; x<width-1; x++){
        let gx=0, gy=0, k=0;
        for(let dy=-1; dy<=1; dy++){
          for(let dx=-1; dx<=1; dx++){
            const v = lum[(y+dy)*width+(x+dx)];
            gx += v*SOBEL_X[k]; gy += v*SOBEL_Y[k]; k++;
          }
        }
        const mag = Math.sqrt(gx*gx+gy*gy);
        count++; magSum += mag;
        if(mag > 40){ // empirically-chosen "this is a real edge" threshold on 0..255 luminance gradients
          strongCount++;
          let angle = Math.atan2(gy, gx);
          angle = ((angle % Math.PI) + Math.PI) % Math.PI; // fold to 0..PI
          const bin = Math.min(3, Math.floor((angle / Math.PI) * 4));
          orientationBins[bin]++;
        }
      }
    }
    const edgeDensity = count ? strongCount / count : 0;
    const avgMag = count ? magSum / count : 0;
    const total = orientationBins.reduce((a,b)=>a+b,0);
    let peakiness = 0;
    if(total > 0){
      const maxBin = Math.max(...orientationBins);
      const uniform = total/4;
      peakiness = clamp01((maxBin - uniform) / (total - uniform || 1));
    }
    return { edgeDensity, avgMag, peakiness, sampleCount: total };
  }

  // ---- color-palette pass (coarse HSV histogram) ----
  function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    let h=0;
    if(d!==0){
      if(max===r) h=((g-b)/d)%6;
      else if(max===g) h=(b-r)/d+2;
      else h=(r-g)/d+4;
      h*=60; if(h<0) h+=360;
    }
    const s = max===0?0:d/max;
    const v = max;
    return [h,s,v];
  }

  const HUE_BUCKETS = 12; // 30-degree wedges
  function colorAnalysis(imageData){
    const { data } = imageData;
    const hist = new Array(HUE_BUCKETS).fill(0);
    let satSum=0, valSum=0, n=0, grayCount=0;
    for(let i=0;i<data.length;i+=4){
      const hsv = rgbToHsv(data[i],data[i+1],data[i+2]);
      const h=hsv[0], s=hsv[1], v=hsv[2];
      n++; satSum+=s; valSum+=v;
      if(s < 0.12){ grayCount++; continue; } // near-gray/white/black pixels don't vote a hue
      hist[Math.min(HUE_BUCKETS-1, Math.floor(h/30))]++;
    }
    const colored = n - grayCount;
    const significant = hist.filter(c => colored>0 && (c/colored) > 0.06).length; // buckets holding >6% of colored pixels
    return {
      distinctHues: significant,
      avgSat: n ? satSum/n : 0,
      avgVal: n ? valSum/n : 0,
      grayFraction: n ? grayCount/n : 1,
    };
  }

  // ---- map raw signals onto the shared STYLE_AXES vocabulary ----
  function axesFromSignals(edge, color, silhouette){
    const out = {};
    {
      let value = clamp01(edge.avgMag / 70);
      let confidence = 0.5;
      if(silhouette){
        value = clamp01(value*0.5 + (1 - silhouette.looseness)*0.5);
        confidence = 0.75;
      }
      out.structure = { value, confidence, matched:["photo: edge sharpness" + (silhouette ? " + silhouette fit" : "")] };
    }
    if(edge.sampleCount >= 40){
      out.line = { value: edge.peakiness, confidence: clamp01(edge.sampleCount/400), matched:["photo: edge-orientation spread"] };
    }
    {
      let value = clamp01(color.avgSat*0.7 + (1-color.grayFraction)*0.3);
      if(silhouette) value = clamp01(value*0.6 + silhouette.looseness*0.4);
      out.scale = { value, confidence:0.5, matched:["photo: color boldness" + (silhouette ? " + silhouette scale" : "")] };
    }
    {
      const varietyScore = clamp01(color.distinctHues / 4);
      const textureScore = clamp01((edge.edgeDensity - 0.03) / 0.12);
      out.ornamentation = { value: clamp01(varietyScore*0.6 + textureScore*0.4), confidence:0.55, matched:["photo: color variety + fine detail"] };
    }
    return out;
  }

  // ---- optional person-silhouette pass ----
  async function trySilhouette(img){
    let landmarker;
    try{ landmarker = await getLandmarker(); }catch(e){ return null; }
    let result;
    try{ result = landmarker.detect(img); }catch(e){ return null; }
    const lm = result && result.landmarks && result.landmarks[0];
    if(!lm) return null;
    const need = [11,12,23,24]; // shoulders + hips
    for(const i of need){ if(!lm[i] || (lm[i].visibility||0) < 0.5) return null; }
    const xs = lm.map(p=>p.x*img.naturalWidth), ys = lm.map(p=>p.y*img.naturalHeight);
    const shoulderW = Math.abs(lm[11].x - lm[12].x) * img.naturalWidth;
    const hipW = Math.abs(lm[23].x - lm[24].x) * img.naturalWidth;
    const top = Math.min(lm[11].y, lm[12].y) * img.naturalHeight;
    const bottom = Math.max(...ys);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const boxX = Math.max(0, minX - shoulderW*0.4);
    const boxW = Math.min(img.naturalWidth - boxX, (maxX - minX) + shoulderW*0.8);
    const boxY = Math.max(0, top - shoulderW*0.3);
    const boxH = Math.min(img.naturalHeight - boxY, (bottom - top) + shoulderW*0.6);
    if(boxW < 4 || boxH < 4) return null;
    // Rough looseness proxy: how much wider the garment region reads than
    // the skeleton's own shoulder/hip width — a bounding-box stand-in for
    // a real garment mask, which MediaPipe's pose model doesn't provide.
    const skeletonWidth = Math.max(shoulderW, hipW, 1);
    const looseness = clamp01((boxW - skeletonWidth) / skeletonWidth / 1.5);
    return { box:{ x:boxX, y:boxY, w:boxW, h:boxH }, looseness };
  }

  async function analyzePhotoAxes(photoBlob){
    const img = await blobToImage(photoBlob);
    let silhouette = null;
    try{ silhouette = await trySilhouette(img); }catch(e){ silhouette = null; }
    let imageData;
    try{
      imageData = drawToCanvas(img, silhouette ? silhouette.box : null);
    }finally{
      URL.revokeObjectURL(img.src);
    }
    const edge = edgeAnalysis(imageData);
    const color = colorAnalysis(imageData);
    const axes = axesFromSignals(edge, color, silhouette);
    return { axes, usedBodyCrop: !!silhouette };
  }

  return { analyzePhotoAxes, _internal: { edgeAnalysis, colorAnalysis, axesFromSignals, toLuminance } };
})();

function TypeSwatch({ id, pct, list }){
  const info = (list || KIBBE_TYPES).find(x => x.id === id);
  if(!info) return null;
  return e("span", { className:"swatch", style:{ background: info.color } },
    e("span", { className:"swatch-dot" }),
    info.name + (pct !== undefined ? " " + pct + "%" : "")
  );
}

function BlendBar({ blend, ids }){
  const sorted = sortedBlend(blend, ids || KIBBE_TYPES).filter(x => x.pct > 0);
  return e("div", { className:"blend-bar" },
    sorted.map(x => e("div", {
      key:x.id,
      className:"blend-bar-seg",
      style:{ width:x.pct+"%", background:x.color },
      title:x.name+" "+x.pct+"%"
    }))
  );
}

function BlendList({ blend, ids }){
  const sorted = sortedBlend(blend, ids || KIBBE_TYPES).filter(x => x.pct > 0);
  return e("div", { className:"blend-list" },
    sorted.map(x => e("div", { key:x.id, className:"blend-row" },
      e("span", { className:"swatch-dot", style:{ background:x.color, width:9, height:9 } }),
      e("span", { className:"blend-row-name" }, x.name),
      e("span", { className:"blend-row-pct mono" }, x.pct+"%")
    ))
  );
}

function VerdictPill({ verdict }){
  const map = {
    match: { cls:"verdict-match", label:"Matches your Kibbe type" },
    neutral: { cls:"verdict-neutral", label:"Could go either way" },
    avoid: { cls:"verdict-avoid", label:"Off your Kibbe type" },
  };
  const v = map[verdict] || map.neutral;
  return e("span", { className:"verdict-pill "+v.cls }, v.label);
}

function Thinking({ label }){
  return e("span", { className:"thinking" },
    e("span", { className:"dot-pulse" }), e("span", { className:"dot-pulse" }), e("span", { className:"dot-pulse" }),
    label || "Working…"
  );
}

function Banner({ kind, children }){
  return e("div", { className:"banner banner-"+(kind||"info") }, children);
}

function EmptyState({ icon, children }){
  return e("div", { className:"empty-state" }, Icon(icon||"sparkle"), e("p", null, children));
}

function VideoEmbed({ url }){
  const info = parseVideoLink(url);
  if(!info) return null;
  if(info.kind === "youtube" || info.kind === "vimeo"){
    return e("div", { className:"video-frame" },
      e("iframe", {
        src: info.embed,
        title: "Video",
        allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture",
        allowFullScreen: true,
        loading: "lazy",
      })
    );
  }
  return e("a", { className:"video-link-card", href:info.href, target:"_blank", rel:"noopener noreferrer" },
    e("span", { className:"play-badge" }, Icon("play")),
    e("span", null, "Watch video")
  );
}

/* A round avatar: a real photo when the person has set one, otherwise the
   same initials-on-a-tinted-circle treatment used everywhere in this app. */
function Avatar({ url, name, size }){
  const s = size || 32;
  const style = { width:s, height:s, fontSize: Math.max(11, Math.round(s * 0.36)) };
  if(url) return e("img", { src:url, alt:"", className:"avatar-img", style });
  return e("span", { className:"post-avatar", style }, initialsOf(name));
}

function AccountGate({ onComplete }){
  const [mode, setMode] = useState("signup"); // signup | login | forgot
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [agreeTerms, setAgreeTerms] = useState(false);
  const [agreeGuidelines, setAgreeGuidelines] = useState(false);
  const [showTerms, setShowTerms] = useState(false);
  const [showGuidelines, setShowGuidelines] = useState(false);
  const [touched, setTouched] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [forgotSent, setForgotSent] = useState(false);

  const emailValid = isValidEmail(email);
  const nameValid = name.trim().length >= 2;
  const passwordValid = password.length >= 8;
  const canSubmit = mode === "signup"
    ? (nameValid && emailValid && passwordValid && agreeTerms && agreeGuidelines)
    : mode === "forgot"
    ? emailValid
    : (emailValid && password.length > 0);

  function switchMode(next){
    setMode(next); setError(null); setTouched(false); setPassword(""); setForgotSent(false);
  }

  async function submit(ev){
    ev.preventDefault();
    setTouched(true);
    setError(null);
    if(!canSubmit) return;
    setBusy(true);
    try{
      if(mode === "forgot"){
        await Api.forgotPassword(email.trim());
        setForgotSent(true);
      } else {
        const account = mode === "signup"
          ? await Api.signup({ name:name.trim(), email:email.trim(), password })
          : await Api.login({ email:email.trim(), password });
        onComplete({
          name:account.name, email:account.email, joinedAt: Date.now(), visitorId: account.id,
          token: account.token,
          // Only the signup response reports this; a returning user who
          // logs in is assumed already-verified until told otherwise (e.g.
          // by the 403 a post attempt would surface).
          emailVerified: account.emailVerified !== undefined ? account.emailVerified : true,
        });
      }
    }catch(err){
      setError(err.message || (mode === "signup" ? "Couldn't create your account — try again." : mode === "forgot" ? "Couldn't send that right now — try again." : "Couldn't log in — try again."));
    }finally{
      setBusy(false);
    }
  }

  if(mode === "forgot"){
    return e("div", { className:"gate-wrap" },
      e("div", { className:"wordmark", style:{ marginBottom:2, display:"flex", alignItems:"center", gap:"0.12em" } },
        e(LogoMark, { size:"0.85em" }), "Style-LORE"),
      e("div", { className:"eyebrow", style:{ marginBottom:20 } }, "Reset your password"),
      e("p", { className:"screen-lede", style:{ marginBottom:28 } },
        "Enter the email on your account and, if it matches one, we'll send a link to reset your password."),
      forgotSent
        ? e(Banner, { kind:"info" }, "If an account exists for that email, we've sent a link to reset your password. Check your inbox (and spam folder).")
        : e("form", { onSubmit: submit },
            e("div", { className:"field" },
              e("label", { htmlFor:"gate-forgot-email" }, "Email"),
              e("input", { id:"gate-forgot-email", type:"email", value:email,
                placeholder:"you@example.com",
                onChange: ev => setEmail(ev.target.value) }),
              (touched && !emailValid) ? e("div", { className:"field-error" }, "Enter a valid email address.") : null
            ),
            error ? e(Banner, { kind:"error" }, error) : null,
            e("button", { type:"submit", className:"btn btn-accent btn-block", disabled:busy, style:{ marginTop:18 } },
              busy ? "Sending…" : "Send reset link")
          ),
      e("p", { className:"footnote", style:{ marginTop:16 } },
        e("button", { type:"button", className:"link-btn", onClick:()=>switchMode("login") }, "Back to log in"))
    );
  }

  return e("div", { className:"gate-wrap" },
    e("div", { className:"wordmark", style:{ marginBottom:2, display:"flex", alignItems:"center", gap:"0.12em" } },
        e(LogoMark, { size:"0.85em" }), "Style-LORE"),
    e("div", { className:"eyebrow", style:{ marginBottom:20 } }, "A style quiz, closet, and community for finding your look"),
    e("p", { className:"screen-lede", style:{ marginBottom:28 } },
      "Find your body type, your Kibbe style, and your style language, check them against your closet, and talk style with people who share your look."),

    e("div", { className:"tabs", style:{ marginBottom:22 } },
      e("button", { type:"button", className:"tab-chip", "aria-pressed": mode==="signup" ? "true" : "false", onClick:()=>switchMode("signup") }, "Create account"),
      e("button", { type:"button", className:"tab-chip", "aria-pressed": mode==="login" ? "true" : "false", onClick:()=>switchMode("login") }, "Log in")
    ),

    e("form", { onSubmit: submit },
      mode === "signup" ? e("div", { className:"field" },
        e("label", { htmlFor:"gate-name" }, "Display name"),
        e("input", { id:"gate-name", type:"text", value:name, maxLength:40,
          placeholder:"What should we call you?",
          onChange: ev => setName(ev.target.value) }),
        (touched && !nameValid) ? e("div", { className:"field-error" }, "Enter at least 2 characters.") : null
      ) : null,
      e("div", { className:"field" },
        e("label", { htmlFor:"gate-email" }, "Email"),
        e("input", { id:"gate-email", type:"email", value:email,
          placeholder:"you@example.com",
          onChange: ev => setEmail(ev.target.value) }),
        (touched && !emailValid) ? e("div", { className:"field-error" }, "Enter a valid email address.") : null
      ),
      e("div", { className:"field" },
        e("label", { htmlFor:"gate-password" }, "Password"),
        e("input", { id:"gate-password", type:"password", value:password,
          placeholder: mode === "signup" ? "At least 8 characters" : "Your password",
          autoComplete: mode === "signup" ? "new-password" : "current-password",
          onChange: ev => setPassword(ev.target.value) }),
        (mode === "signup" && touched && !passwordValid) ? e("div", { className:"field-error" }, "Password must be at least 8 characters.") : null
      ),
      mode === "login" ? e("p", { style:{ margin:"-8px 0 4px" } },
        e("button", { type:"button", className:"link-btn", onClick:()=>switchMode("forgot") }, "Forgot password?")
      ) : null,
      mode === "signup" ? e("div", { className:"checkline" },
        e("input", { type:"checkbox", id:"gate-terms", checked:agreeTerms,
          onChange: ev => setAgreeTerms(ev.target.checked) }),
        e("label", { htmlFor:"gate-terms" },
          "I agree to the ", e("button", { type:"button", className:"link-btn", onClick:()=>setShowTerms(true) }, "Terms of Service"), ".")
      ) : null,
      mode === "signup" ? e("div", { className:"checkline" },
        e("input", { type:"checkbox", id:"gate-guidelines", checked:agreeGuidelines,
          onChange: ev => setAgreeGuidelines(ev.target.checked) }),
        e("label", { htmlFor:"gate-guidelines" },
          "I agree to the ", e("button", { type:"button", className:"link-btn", onClick:()=>setShowGuidelines(true) }, "Community Guidelines"),
          " — no abusive language, photos, or videos toward other members.")
      ) : null,
      (mode === "signup" && touched && !(agreeTerms && agreeGuidelines)) ? e("div", { className:"field-error", style:{marginBottom:12} }, "Both agreements are required to continue.") : null,
      error ? e(Banner, { kind:"error" }, error) : null,
      e("button", { type:"submit", className:"btn btn-accent btn-block", disabled:busy, style:{ marginTop:18 } },
        busy ? (mode==="signup" ? "Creating account…" : "Logging in…") : (mode==="signup" ? "Create account" : "Log in")),
      e("p", { className:"footnote", style:{ marginTop:16 } },
        mode === "signup"
          ? "Your password is hashed on the server and never stored as plain text. You'll get a verification email after signing up — posting in Community requires a verified email."
          : e("span", null, "New here? ", e("button", { type:"button", className:"link-btn", onClick:()=>switchMode("signup") }, "Create an account"), " instead."))
    ),
    (showTerms || showGuidelines) ? e(LegalSheet, {
      title: showTerms ? "Terms of Service" : "Community Guidelines",
      text: showTerms ? TERMS_TEXT : GUIDELINES_TEXT,
      onClose: () => { setShowTerms(false); setShowGuidelines(false); }
    }) : null
  );
}

function LegalSheet({ title, text, onClose }){
  return e("div", { className:"sheet-backdrop", onClick: onClose },
    e("div", { className:"sheet", onClick: ev => ev.stopPropagation() },
      e("div", { className:"sheet-handle" }),

        e("h2", { className:"display", style:{ fontSize:20, fontWeight:700 } }, title),

    )
