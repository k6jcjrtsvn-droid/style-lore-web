}

function ResetPasswordScreen({ token, onDone, onCancel }){
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(false);
  const [touched, setTouched] = useState(false);

  const passwordValid = password.length >= 8;
  const matches = password === confirm;
  const canSubmit = passwordValid && matches;

  async function submit(ev){
    ev.preventDefault();
    setTouched(true);
    setError(null);
    if(!canSubmit) return;
    setBusy(true);
    try{
      const result = await Api.resetPassword(token, password);
      if(result && result.id){
        onDone({ name:result.name, email:result.email, joinedAt: Date.now(), visitorId: result.id, token: result.token, emailVerified: true });
      } else {
        setDone(true);
      }
    }catch(err){
      setError(err.message || "That reset link is invalid or has expired.");
    }finally{
      setBusy(false);
    }
  }

  return e("div", { className:"gate-wrap" },
    e("div", { className:"wordmark", style:{ marginBottom:2, display:"flex", alignItems:"center", gap:"0.12em" } },
        e(LogoMark, { size:"0.85em" }), "Style-LORE"),
    e("div", { className:"eyebrow", style:{ marginBottom:20 } }, "Choose a new password"),
    done
      ? e("div", null,
          e(Banner, { kind:"info" }, "Your password has been reset. Log in with your new password."),
          e("button", { type:"button", className:"btn btn-accent btn-block", style:{ marginTop:18 }, onClick:onCancel }, "Go to log in")
        )
      : e("form", { onSubmit: submit },
          e("div", { className:"field" },
            e("label", { htmlFor:"reset-password" }, "New password"),
            e("input", { id:"reset-password", type:"password", value:password, autoComplete:"new-password",
              placeholder:"At least 8 characters",
              onChange: ev => setPassword(ev.target.value) }),
            (touched && !passwordValid) ? e("div", { className:"field-error" }, "Password must be at least 8 characters.") : null
          ),
          e("div", { className:"field" },
            e("label", { htmlFor:"reset-confirm" }, "Confirm new password"),
            e("input", { id:"reset-confirm", type:"password", value:confirm, autoComplete:"new-password",
              placeholder:"Type it again",
              onChange: ev => setConfirm(ev.target.value) }),
            (touched && !matches) ? e("div", { className:"field-error" }, "Passwords don't match.") : null
          ),
          error ? e(Banner, { kind:"error" }, error) : null,
          e("button", { type:"submit", className:"btn btn-accent btn-block", disabled:busy, style:{ marginTop:18 } },
            busy ? "Saving…" : "Reset password")
        ),
    e("p", { className:"footnote", style:{ marginTop:16 } },
      e("button", { type:"button", className:"link-btn", onClick:onCancel }, "Back to log in"))
  );
}

function VerifyEmailScreen({ token, onDone }){
  const [status, setStatus] = useState("checking"); // checking | ok | error
  const [message, setMessage] = useState(null);

  useEffect(() => {
    let cancelled = false;
    Api.verifyEmail(token).then(() => {
      if(!cancelled) setStatus("ok");
    }).catch(err => {
      if(!cancelled){ setStatus("error"); setMessage(err.message || "That verification link is invalid or has expired."); }
    });
    return () => { cancelled = true; };
  }, [token]);

  return e("div", { className:"gate-wrap" },
    e("div", { className:"wordmark", style:{ marginBottom:2, display:"flex", alignItems:"center", gap:"0.12em" } },
        e(LogoMark, { size:"0.85em" }), "Style-LORE"),
    e("div", { className:"eyebrow", style:{ marginBottom:20 } }, "Email verification"),
    status === "checking" ? e(Thinking, { label:"Verifying your email…" }) : null,
    status === "ok" ? e(Banner, { kind:"info" }, "Your email is verified — you're all set to post in Community.") : null,
    status === "error" ? e(Banner, { kind:"error" }, message) : null,
    status !== "checking" ? e("button", {
      type:"button", className:"btn btn-accent btn-block", style:{ marginTop:18 }, onClick:onDone
    }, "Continue") : null
  );
}

/* =====================================================================
   STYLE QUIZ — a single unified quiz, not two separate ones. Structural
   questions (bone, flesh, scale, yin/yang lean) still resolve to one of
   the 13 KIBBE_TYPES internally via matchKibbeType(), but that structural
   read is never surfaced as its own labeled "body type" result — it only
   exists to produce the Kibbe-type match. Style-language questions score
   against the open STYLE_WORDS vocabulary, so the result is whichever
   words actually fit, not a forced category. Both parts share one
   intro/flow and one combined result screen, with independent retakes.
===================================================================== */

const KIBBE_QUIZ_QUESTIONS = BODY_QUESTIONS.map(q => ({ ...q, kind:"body" }))
  .concat(MOD_QUESTIONS.map(q => ({ ...q, kind:"mod" })));

function buildKibbeResult(bodyAnswers, modAnswers){
  const familyBlend = computeBlend(bodyAnswers, BODY_QUESTIONS, FAMILIES);
  const modScore = computeModScore(modAnswers);
  const match = matchKibbeType(familyBlend, modScore);
  return { familyBlend, modScore, kibbeBlend: match.blend, kibbeTypeId: match.typeId, confidence: match.confidence };
}

function StyleQuizScreen({ kibbeResult, styleLanguageResult, onSaveKibbe, onSaveStyle }){
  const initialStage = (kibbeResult && kibbeResult.kibbeTypeId) || (styleLanguageResult) ? "result" : "intro";
  const [stage, setStage] = useState(initialStage); // intro | quiz | photo | style-intro | style-quiz | result
  const [bodyAnswers, setBodyAnswers] = useState({});
  const [modAnswers, setModAnswers] = useState({});
  const [qIndex, setQIndex] = useState(0);
  const [kibbeQuizResult, setKibbeQuizResult] = useState(kibbeResult);
  const [photoBlob, setPhotoBlob] = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [photoError, setPhotoError] = useState(null);
  const [styleAnswers, setStyleAnswers] = useState({});
  const [styleQIndex, setStyleQIndex] = useState(0);
  const [styleQuizBlend, setStyleQuizBlend] = useState(styleLanguageResult);
  // Optional, skippable — "women" | "men" | "both" | null (null and
  // "both" behave identically: no reweighting at all).
  const [genderLean, setGenderLean] = useState(null);

  function choose(q, idx){
    if(q.kind === "mod"){
      const next = { ...modAnswers, [q.id]: idx };
      setModAnswers(next);
      if(qIndex < KIBBE_QUIZ_QUESTIONS.length - 1){
        setTimeout(() => setQIndex(qIndex + 1), 180);
      } else {
        setKibbeQuizResult(buildKibbeResult(bodyAnswers, next));
        setStage("photo");
      }
    } else {
      const next = { ...bodyAnswers, [q.id]: idx };
      setBodyAnswers(next);
      setTimeout(() => setQIndex(qIndex + 1), 180);
    }
  }

  function pickPhoto(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    setPhotoError(null);
    downscaleImage(file, 640, 0.8).then(dataUrl => {
      setPhotoPreview(dataUrl);
      setPhotoBlob(dataUrlToBlob(dataUrl));
    }).catch(()=>setPhotoError("Couldn't read that photo — try another."));
  }

  function afterKibbePart(result){
    onSaveKibbe(result);
    if(styleQuizBlend) setStage("result");
    else setStage("style-intro");
  }

  async function analyzePhoto(){
    if(!photoBlob || !kibbeQuizResult) return;
    setAnalyzing(true); setPhotoError(null);
    try{
      const result = await KibbeOnDeviceAnalyzer.analyzeKibbePhotoOnDevice(photoBlob);
      const totals = {};
      FAMILIES.forEach(x => totals[x.id] = Number(result.blend && result.blend[x.id]) || 0);
      const photoFamilyBlend = normalizeBlend(totals, FAMILIES);
      const mergedFamily = mergeBlends(kibbeQuizResult.familyBlend, photoFamilyBlend, 0.5, 0.5, FAMILIES);
      const match = matchKibbeType(mergedFamily, kibbeQuizResult.modScore);
      const merged = { familyBlend: mergedFamily, modScore: kibbeQuizResult.modScore, kibbeBlend: match.blend, kibbeTypeId: match.typeId, confidence: match.confidence };
      setKibbeQuizResult(merged);
      afterKibbePart(merged);
    }catch(err){
      setPhotoError(err.message || "Couldn't analyze that photo — try again.");
    }finally{
      setAnalyzing(false);
    }
  }

  function skipPhoto(){
    afterKibbePart(kibbeQuizResult);
  }

  function retakeKibbe(){
    setBodyAnswers({}); setModAnswers({}); setQIndex(0); setPhotoBlob(null); setPhotoPreview(null); setPhotoError(null);
    setStage("intro");
  }

  function chooseStyle(qId, idx){
    const next = { ...styleAnswers, [qId]: idx };
    setStyleAnswers(next);
    if(styleQIndex < STYLE_LANGUAGE_QUESTIONS.length - 1){
      setTimeout(() => setStyleQIndex(styleQIndex + 1), 180);
    } else {
      const b = computeBlend(next, STYLE_LANGUAGE_QUESTIONS, STYLE_WORDS, genderLean);
      setStyleQuizBlend(b);
      onSaveStyle(b);
      setStage("result");
    }
  }

  function retakeStyle(){
    setStyleAnswers({}); setStyleQIndex(0); setStage("style-intro");
  }

  if(stage === "intro"){
    return e("div", null,
      e("div", { className:"eyebrow" }, "Style Quiz"),
      e("h1", { className:"screen-title" }, "Two quick parts"),
      e("p", { className:"screen-lede", style:{ marginBottom:8 } },
        "First, some questions about your build and proportions — bone, flesh, and scale, plus your natural yin/yang lean — to place you into one of 13 style archetypes that suggest which silhouettes tend to work for you. Then a short round on the actual words that describe how you like to dress."),
      e("p", { className:"screen-lede", style:{ marginBottom:18 } },
        "This is about structure and line, not gender — the quiz works the same for everyone. If a question doesn't feel clear-cut, use \"Not sure — skip this one\" rather than guessing; a skipped question won't tilt your result in the wrong direction."
        + " After the first part you can optionally upload a photo for a refined read — analyzed right on your device, never uploaded anywhere."),
      e("div", { className:"card", style:{ marginBottom:24 } },
        e("div", { className:"eyebrow", style:{ marginBottom:10 } }, "Quick primer — four words this quiz uses a lot"),
        e("div", { className:"primer-row" },
          e("span", { className:"primer-swatch", style:{ clipPath:"polygon(50% 0%, 100% 100%, 0% 100%)" } }),
          e("div", { className:"primer-text" }, e("b", null, "Sharp / angular"), e("p", null, "Clean corners, like a triangle — think a strong jawline or a defined collarbone."))
        ),
        e("div", { className:"primer-row" },
          e("span", { className:"primer-swatch", style:{ borderRadius:"50%" } }),
          e("div", { className:"primer-text" }, e("b", null, "Soft / curved"), e("p", null, "Rounded, with no corners — think a circle."))
        ),
        e("div", { className:"primer-row" },
          e("span", { className:"primer-swatch", style:{ height:8, borderRadius:2, marginTop:10 } }),
          e("div", { className:"primer-text" }, e("b", null, "Broad / blunt"), e("p", null, "Straight-edged and solid — neither sharp nor curved."))
        ),
        e("div", { className:"primer-row" },
          e("span", { className:"primer-swatch", style:{ borderRadius:"6px 14px 6px 14px" } }),
          e("div", { className:"primer-text" }, e("b", null, "Balanced"), e("p", null, "A mix of the above — nothing about it reads as extreme."))
        )
      ),
      e("button", { className:"btn btn-accent btn-block", onClick:()=>setStage("quiz") }, "Start the quiz"),
      (kibbeQuizResult || styleQuizBlend) ? e("button", { className:"btn btn-ghost btn-block", style:{ marginTop:10 }, onClick:()=>setStage("result") }, "See my last result") : null
    );
  }

  if(stage === "quiz"){
    const q = KIBBE_QUIZ_QUESTIONS[qIndex];
    const answeredIdx = q.kind === "mod" ? modAnswers[q.id] : bodyAnswers[q.id];
    return e("div", null,
      e("div", { className:"progress-track" }, e("div", { className:"progress-fill", style:{ width:((qIndex)/KIBBE_QUIZ_QUESTIONS.length*100)+"%" } })),
      e("div", { className:"kicker-num", style:{ marginBottom:6 } }, "Question " + (qIndex+1) + " of " + KIBBE_QUIZ_QUESTIONS.length),
      e("div", { className:"eyebrow" }, q.hint),
      e("h2", { className:"screen-title", style:{ fontSize:23, marginBottom:6 } }, q.prompt),
      q.help ? e("p", { className:"field-hint", style:{ marginBottom:16 } }, q.help) : null,
      q.options.map((opt, idx) => e("button", {
        key:idx,
        className:"option-btn",
        "aria-pressed": answeredIdx === idx ? "true" : "false",
        onClick: () => choose(q, idx)
      }, opt.label)),
      qIndex > 0 ? e("button", { className:"btn-text", onClick:()=>setQIndex(qIndex-1) }, "← Back") : null
    );
  }

  if(stage === "photo"){
    return e("div", null,
      e("div", { className:"eyebrow" }, "Optional"),
      e("h1", { className:"screen-title" }, "Refine with a photo?"),
      e("p", { className:"screen-lede", style:{ marginBottom:18 } },
        "Upload a front-facing, full-body photo and we'll blend a read of your visible bone structure and scale 50/50 with your quiz result. This runs entirely on your device — the photo is never uploaded or sent anywhere, and it's discarded the moment analysis finishes."),
      e("div", null,
        e("div", { className:"photo-frame" },
          photoPreview
            ? e("img", { src:photoPreview, alt:"Selected preview" })
            : e("label", { className:"photo-frame-label", htmlFor:"kibbe-photo-input" }, Icon("camera"), e("span", null, "Tap to upload a photo"))
        ),
        e("input", { id:"kibbe-photo-input", type:"file", accept:"image/*", className:"visually-hidden", onChange:pickPhoto }),
        !photoPreview ? e("label", { htmlFor:"kibbe-photo-input", className:"btn btn-ghost btn-block", style:{ marginBottom:10 } }, "Choose photo") : null,
        photoError ? e(Banner, { kind:"error" }, photoError) : null,
        photoPreview ? e("button", { className:"btn btn-accent btn-block", disabled:analyzing, onClick:analyzePhoto, style:{ marginBottom:10 } },
          analyzing ? e(Thinking, { label:"Analyzing photo on your device…" }) : "Analyze photo") : null
      ),
      e("button", { className:"btn-text", onClick:skipPhoto }, "Skip — use quiz result only")
    );
  }

  if(stage === "style-intro"){
    return e("div", null,
      e("div", { className:"eyebrow" }, "Style language"),
      e("h1", { className:"screen-title" }, "Twelve quick questions"),
      e("p", { className:"screen-lede", style:{ marginBottom:18 } },
        "This is about how you actually want to dress — silhouette, color, fabric, and mood. There's no fixed list of categories here: the result is whichever handful of words genuinely fit, out of a wide, open vocabulary. If a question doesn't feel clear-cut, use \"Not sure — skip this one\" rather than guessing."),
      e("div", { className:"field", style:{ marginBottom:20 } },
        e("label", null, "Shopping for — optional"),
        e("div", { style:{ display:"flex", gap:8, flexWrap:"wrap", marginTop:8 } },
          [ ["women","Womenswear"], ["men","Menswear"], ["both","Both / no preference"] ].map(([val,label]) => e("button", {
            key:val,
            type:"button",
            className:"tab-chip",
            "aria-pressed": genderLean === val ? "true" : "false",
            onClick: () => setGenderLean(prev => prev === val ? null : val)
          }, label))
        ),
        e("div", { className:"field-hint" }, "Nudges your word results toward pieces more associated with what you shop for. Skip it and nothing changes.")
      ),
      e("button", { className:"btn btn-accent btn-block", onClick:()=>setStage("style-quiz") }, "Start this part"),
      styleQuizBlend ? e("button", { className:"btn btn-ghost btn-block", style:{ marginTop:10 }, onClick:()=>setStage("result") }, "See my last result") : null
    );
  }

  if(stage === "style-quiz"){
    const q = STYLE_LANGUAGE_QUESTIONS[styleQIndex];
    return e("div", null,
      e("div", { className:"progress-track" }, e("div", { className:"progress-fill", style:{ width:((styleQIndex)/STYLE_LANGUAGE_QUESTIONS.length*100)+"%" } })),
      e("div", { className:"kicker-num", style:{ marginBottom:6 } }, "Question " + (styleQIndex+1) + " of " + STYLE_LANGUAGE_QUESTIONS.length),
      e("div", { className:"eyebrow" }, q.hint),
      e("h2", { className:"screen-title", style:{ fontSize:23, marginBottom:6 } }, q.prompt),
      q.options.map((opt, idx) => e("button", {
        key:idx,
        className:"option-btn",
        "aria-pressed": styleAnswers[q.id] === idx ? "true" : "false",
        onClick: () => chooseStyle(q.id, idx)
      }, opt.label)),
      styleQIndex > 0 ? e("button", { className:"btn-text", onClick:()=>setStyleQIndex(styleQIndex-1) }, "← Back") : null
    );
  }

  // result — combined, each half independently retakeable
  const kibbeType = (kibbeQuizResult && kibbeQuizResult.kibbeTypeId) ? KIBBE_BY_ID[kibbeQuizResult.kibbeTypeId] : null;
  const words = styleQuizBlend ? topWords(styleQuizBlend, STYLE_WORDS, 6) : [];
  const hasKibbe = !!kibbeType;
  const hasStyle = words.length > 0;

  if(!hasKibbe && !hasStyle){
    return e("div", null,
      e("div", { className:"eyebrow" }, "Your style quiz"),
      e("h1", { className:"screen-title", style:{ marginBottom:12 } }, "Not enough to go on yet"),
      e("p", { className:"screen-lede", style:{ marginBottom:20 } },
        "Every question came back \"not sure,\" so there's nothing to read. Retake it and answer at least a few — your best guess beats no read at all."),
      e("button", { className:"btn btn-accent btn-block", onClick:retakeKibbe }, "Retake the quiz")
    );
  }

  return e("div", null,
    e("div", { className:"eyebrow" }, "Your style quiz"),
    e("h1", { className:"screen-title", style:{ marginBottom:20 } }, "Your results"),

    e("div", { style:{ marginBottom:28 } },
      e("div", { className:"eyebrow", style:{ marginBottom:4 } }, "Body & shape type"),
      hasKibbe ? e(React.Fragment, null,
        e("h2", { className:"screen-title", style:{ fontSize:22, marginBottom:4 } }, kibbeType.name),
        e("p", { className:"screen-lede", style:{ marginBottom:14 } }, kibbeType.tag),
        e("div", { className:"card" },
          e("p", { style:{ fontSize:14, lineHeight:1.6, marginBottom:14 } }, kibbeType.desc),
          e(BlendBar, { blend: kibbeQuizResult.kibbeBlend, ids: KIBBE_TYPES }),
          e(BlendList, { blend: kibbeQuizResult.kibbeBlend, ids: KIBBE_TYPES })
        ),
        e("p", { className:"footnote", style:{ marginTop:14, marginBottom:10 } },
          "This is a starting read, not a fixed label — treat it as a v1 to refine as you log your closet and try the checker."),
        e("button", { className:"btn-text", onClick:retakeKibbe }, "Retake this part")
      ) : e(React.Fragment, null,
        e("p", { className:"footnote", style:{ marginBottom:10 } }, "No result yet for this part."),
        e("button", { className:"btn-text", onClick:retakeKibbe }, "Take this part")
      )
    ),

    e("div", { className:"rule" }),

    e("div", { style:{ marginTop:20 } },
      e("div", { className:"eyebrow", style:{ marginBottom:4 } }, "Style words"),
      hasStyle ? e(React.Fragment, null,
        e("h2", { className:"screen-title", style:{ marginBottom:14 } }, words.map(w => w.name).join(", ")),
        e("div", { className:"card" },
          e(BlendBar, { blend: styleQuizBlend, ids: STYLE_WORDS }),
          e(BlendList, { blend: styleQuizBlend, ids: STYLE_WORDS })
        ),
        e("p", { className:"footnote", style:{ marginTop:14, marginBottom:10 } },
          "This is a starting read of your style language, not a fixed label — it's meant to describe taste, and taste can shift."),
        e("button", { className:"btn-text", onClick:retakeStyle }, "Retake this part")
      ) : e(React.Fragment, null,
        e("p", { className:"footnote", style:{ marginBottom:10 } }, "No result yet for this part."),
        e("button", { className:"btn-text", onClick:retakeStyle }, "Take this part")
      )
    )

}

/* =====================================================================
   COLOR PALETTE — a separate quiz from body/Kibbe type: this is about your
   natural coloring (skin, hair, eyes), not facial lines. No AI is
   involved on this local build; the optional photo step samples pixel
   colors on your own device with plain canvas math (see
   featuresFromSamples above) and nothing is uploaded anywhere.
===================================================================== */

const SAMPLE_STEPS = [
  { key:"skin", label:"Tap a clear patch of your skin", sub:"Cheek or forehead — away from shadow, makeup, or glare." },
  { key:"hair", label:"Now tap your hair", sub:"Away from any bright highlight or shine." },
  { key:"eye", label:"Now tap the iris of your eye", sub:"The colored ring, not the pupil or the white." },
];

function PhotoColorSampler({ onDone }){
  const [dataUrl, setDataUrl] = useState(null);
  const [step, setStep] = useState(0);
  const [points, setPoints] = useState([]);
  const [error, setError] = useState(null);
  const imgRef = useRef(null);
  const canvasRef = useRef(null);
  const samplesRef = useRef({});
  if(!canvasRef.current) canvasRef.current = document.createElement("canvas");

  function pickPhoto(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    downscaleImage(file, 640, 0.85).then(url => {
      setError(null);
      setStep(0); setPoints([]); samplesRef.current = {};
      const img = new Image();
      img.onload = () => {
        const canvas = canvasRef.current;
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);
        setDataUrl(url);
      };
      img.onerror = () => setError("Couldn't read that photo — try another.");
      img.src = url;
    }).catch(() => setError("Couldn't read that photo — try another."));
  }

  function handleClick(ev){
    const canvas = canvasRef.current;
    if(!imgRef.current || !canvas.width || step >= SAMPLE_STEPS.length) return;
    const rect = imgRef.current.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (ev.clientX - rect.left) * scaleX;
    const y = (ev.clientY - rect.top) * scaleY;
    const rgb = samplePixel(canvas, x, y, 5);
    const key = SAMPLE_STEPS[step].key;
    samplesRef.current[key] = rgb;
    setPoints(prev => [...prev, { x: ev.clientX - rect.left, y: ev.clientY - rect.top }]);
    if(step === SAMPLE_STEPS.length - 1){
      const s = samplesRef.current;
      onDone(featuresFromSamples(s.skin, s.hair, s.eye));
    } else {
      setStep(step + 1);
    }
  }

  if(!dataUrl){
    return e("div", null,
      e("div", { className:"photo-frame" },
        e("label", { className:"photo-frame-label", htmlFor:"color-photo-input" }, Icon("camera"), e("span", null, "Tap to upload a photo"))
      ),
      e("input", { id:"color-photo-input", type:"file", accept:"image/*", className:"visually-hidden", onChange:pickPhoto }),
      error ? e(Banner, { kind:"error" }, error) : null
    );
  }

  return e("div", null,
    step < SAMPLE_STEPS.length
      ? e("div", null,
          e("p", { style:{ fontWeight:600, marginBottom:4 } }, SAMPLE_STEPS[step].label),
          e("p", { className:"field-hint", style:{ marginBottom:12 } }, SAMPLE_STEPS[step].sub)
        )
      : e("p", { style:{ fontWeight:600, marginBottom:12 } }, "Got it — reading your colors…"),
    e("div", { className:"sample-frame" },
      e("img", { ref:imgRef, src:dataUrl, alt:"", onClick:handleClick }),
      points.map((p,i) => e("span", { key:i, className:"sample-dot", style:{ left:p.x, top:p.y } }))
    )
  );
}

function ColorScreen({ colorResult, onSaveColor }){
  const [stage, setStage] = useState(colorResult ? "result" : "intro"); // intro | quiz | photo | result
  const [answers, setAnswers] = useState({});
  const [qIndex, setQIndex] = useState(0);
  const [quizFeatures, setQuizFeatures] = useState(null);
  const [finalResult, setFinalResult] = useState(colorResult);

  function choose(qId, idx){
    const next = { ...answers, [qId]: idx };
    setAnswers(next);
    if(qIndex < COLOR_QUESTIONS.length - 1){
      setTimeout(() => setQIndex(qIndex + 1), 150);
    } else {
      setQuizFeatures(computeColorFeatures(next));
      setStage("photo");
    }
  }

  function saveResult(features, source){
    const { season, confidence } = matchSeason(features);
    const result = { seasonId: season.id, confidence, source, updatedAt: Date.now() };
    setFinalResult(result);
    onSaveColor(result);
    setStage("result");
  }

  function finishWithQuizOnly(){ saveResult(quizFeatures, "quiz"); }
  function finishWithPhoto(photoFeatures){ saveResult(mergeFeatures(quizFeatures, photoFeatures, 0.5, 0.5), "quiz+photo"); }

  function restart(){
    setAnswers({}); setQIndex(0); setQuizFeatures(null);
    setStage("intro");
  }

  if(stage === "intro"){
    return e("div", null,
      e("div", { className:"eyebrow" }, "Color palette"),
      e("h1", { className:"screen-title" }, "Find your best colors"),
      e("p", { className:"screen-lede", style:{ marginBottom:8 } },
        "A separate, short quiz about your natural coloring — skin, hair, and eyes — not your body/Kibbe type. It places you in one of 12 color \"seasons\" and gives you a palette to shop from."),
      e("p", { className:"screen-lede", style:{ marginBottom:24 } },
        "Six easy questions, then an optional photo step to double-check the read. The photo never leaves this device — colors are sampled right here in the browser."),
      e("button", { className:"btn btn-accent btn-block", onClick:()=>setStage("quiz") }, "Start the quiz"),
      finalResult ? e("button", { className:"btn btn-ghost btn-block", style:{ marginTop:10 }, onClick:()=>setStage("result") }, "See my last result") : null
    );
  }

  if(stage === "quiz"){
    const q = COLOR_QUESTIONS[qIndex];
    return e("div", null,
      e("div", { className:"progress-track" }, e("div", { className:"progress-fill", style:{ width:((qIndex)/COLOR_QUESTIONS.length*100)+"%" } })),
      e("div", { className:"kicker-num", style:{ marginBottom:6 } }, "Question " + (qIndex+1) + " of " + COLOR_QUESTIONS.length),
      e("div", { className:"eyebrow" }, q.hint),
      e("h2", { className:"screen-title", style:{ fontSize:23, marginBottom:6 } }, q.prompt),
      e("p", { className:"field-hint", style:{ marginBottom:16 } }, q.help),
      q.options.map((opt, idx) => e("button", {
        key:idx, className:"option-btn", "aria-pressed": answers[q.id] === idx ? "true" : "false",
        onClick: () => choose(q.id, idx)
      }, opt.label)),
      qIndex > 0 ? e("button", { className:"btn-text", onClick:()=>setQIndex(qIndex-1) }, "← Back") : null
    );
  }

  if(stage === "photo"){
    return e("div", null,
      e("div", { className:"eyebrow" }, "Optional"),
      e("h1", { className:"screen-title" }, "Double-check with a photo?"),
      e("p", { className:"screen-lede", style:{ marginBottom:18 } },
        "Upload a well-lit, makeup-free photo taken in daylight, then tap your skin, hair, and eye when asked. We'll blend the sampled colors 50/50 with your quiz answers."),
      e(PhotoColorSampler, { onDone: finishWithPhoto }),
      e("button", { className:"btn-text", style:{ marginTop:14 }, onClick:finishWithQuizOnly }, "Skip — use quiz result only")
    );
  }

  // result
  if(!finalResult){
    return e("div", null, e(EmptyState, { icon:"sparkle" }, "Take the quiz to see your color palette."),
      e("button", { className:"btn btn-accent btn-block", style:{ marginTop:16 }, onClick:()=>setStage("quiz") }, "Start the quiz"));
  }
  const season = COLOR_SEASON_BY_ID[finalResult.seasonId];
  return e("div", null,
    e("div", { className:"eyebrow" }, "Your color season"),
    e("h1", { className:"screen-title", style:{ marginBottom:6 } }, season.name),
    e("p", { className:"screen-lede", style:{ marginBottom:16 } }, season.blurb),
    e("div", { className:"card", style:{ marginBottom:16 } },
      e("div", { className:"eyebrow", style:{ marginBottom:10 } }, "Your best colors"),
      e("div", { className:"color-chip-grid" },
        season.swatches.map((hex,i) => e("span", { key:i, className:"color-chip", style:{ background:hex }, title:hex }))
      )
    ),
    e("p", { className:"footnote", style:{ marginBottom:20 } },
      finalResult.source === "quiz+photo"
        ? "Based on your quiz answers and a photo sample — an approximate read, not a substitute for in-person draping."
        : "Based on your quiz answers alone — add a photo any time for a more precise read."),
    e("button", { className:"btn btn-ghost btn-block", onClick:restart }, "Retake the quiz")
  );
}

/* =====================================================================
   CLOSET (per-browser; unaffected by the file-storage question — it
   already lived only in this browser's localStorage, no size cap)
===================================================================== */

function ClosetScreen({ closet, setCloset, blend, styleWordBlend, kibbeTypeName, topStyleWords, profile:viewer, isPremium, closetFreeLimit, onUpgrade, syncStatus, onRetrySync }){
  const [showAdd, setShowAdd] = useState(false);
  const profile = { kibbeBlend: blend, styleWordBlend, kibbeTypeName, topStyleWords };
  const atCap = !isPremium && closet.length >= closetFreeLimit;

  function addItem(item){
    if(!isPremium && closet.length >= closetFreeLimit){
      setShowAdd(false);
      if(onUpgrade) onUpgrade("closet");
      return;
    }
    setCloset([{ ...item, id: uid(), createdAt: Date.now() }, ...closet]);
    setShowAdd(false);
  }
  function removeItem(id){
    setCloset(closet.filter(x => x.id !== id));
  }
  function toggleItemVisibility(id){
    setCloset(closet.map(x => x.id === id ? Object.assign({}, x, { visibility: x.visibility === "public" ? "hidden" : "public" }) : x));
  }
  function handleAddClick(){
    if(atCap){ if(onUpgrade) onUpgrade("closet"); return; }
    setShowAdd(true);
  }

  const gapAnalysis = (blend || styleWordBlend) ? styleGapAnalysis(closet, profile) : null;
  let gapBanner = null;
  if (gapAnalysis){
    if (gapAnalysis.itemsWithSignal === 0){
      gapBanner = e(Banner, { kind:"info" }, "Add a bit more detail to your item descriptions (fabric, fit, silhouette) and the closet can start running gap analysis against your blend.");
    } else if (gapAnalysis.gaps.length > 0){
      gapBanner = e(Banner, { kind:"info" }, "Gap check: " + gapAnalysis.gaps.slice(0, 2).join(" "));
    } else {
      gapBanner = e(Banner, { kind:"good" }, "Nice balance — your logged pieces track well with " + (kibbeTypeName ? "your " + kibbeTypeName + " blend" : "your Kibbe blend") + " so far.");
    }
  }

  // Free-plan usage banner — silent unless premium isn't active. Once
  // there are 3 or fewer slots left it names the exact count; once the
  // cap is actually hit it becomes the upgrade prompt itself (the "+ Add"
  // button also opens the paywall directly at that point, via atCap).
  let capBanner = null;
  if (!isPremium){
    if (atCap){
      capBanner = e(Banner, { kind:"info" },
        "You've used all " + closetFreeLimit + " free closet slots. ",
        e("button", { className:"btn-text", style:{ padding:0, fontSize:"inherit", textDecoration:"underline" }, onClick:()=>onUpgrade && onUpgrade("closet") }, "Upgrade to Premium"),
        " for up to 300."
      );
    } else if (closet.length >= closetFreeLimit - 3){
      capBanner = e(Banner, { kind:"info" }, closet.length + " of " + closetFreeLimit + " free closet slots used.");
    }
  }

  // Surfaces a failed server sync instead of leaving it silently
  // swallowed -- see the closetSyncStatus effect in App() for why this
  // matters (it's exactly the failure mode behind the "public closet
  // items not showing up" bug).
  let syncBanner = null;
  if (syncStatus === "error"){
    syncBanner = e(Banner, { kind:"error" },
      "Couldn't save your last closet change — retrying automatically. ",
      e("button", { className:"btn-text", style:{ padding:0, fontSize:"inherit", textDecoration:"underline" }, onClick:onRetrySync }, "Retry now")
    );
  }

  return e("div", null,
    e("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:6 } },
      e("div", null,
        e("div", { className:"eyebrow" }, "Your closet"),
        e("h1", { className:"screen-title" }, "Closet")
      ),
      e("button", { className:"btn btn-accent btn-sm", onClick:handleAddClick }, "+ Add")
    ),
    e("p", { className:"screen-lede", style:{ marginBottom:14 } }, "Log what you own — a running record of your capsule. Each item is Hidden by default; mark one Public to show it on your profile and in Community's Closets tab."),

    !blend ? e(Banner, { kind:"info" }, "Take the body & Kibbe quiz first to start building a picture of your capsule against it.") : null,
    capBanner,
    syncBanner,

    closet.length === 0
      ? e(EmptyState, { icon:"closet" }, "Nothing logged yet. Add your first piece to get started.")
      : e("div", { className:"row-list" },
          closet.map(item => e(ClosetRow, {
            key:item.id, item, profile, onRemove:()=>removeItem(item.id),
            onToggleVisibility: viewer ? ()=>toggleItemVisibility(item.id) : null,
          }))
        ),

    gapBanner,
    gapAnalysis ? e(ShopTheGap, { labels: gapAnalysis.gapLabels }) : null,

    e(Banner, { kind:"info" }, "Verdicts and gap analysis run right on your device from item descriptions — no account, key, or network call needed. It's a rule-based style-language match, not a professional styling opinion."),

    showAdd ? e(AddItemSheet, { onAdd:addItem, onClose:()=>setShowAdd(false) }) : null
  );
}

function PaywallSheet({ reason, onClose, onPurchased }){
  useBackClose(onClose);
  const [offerings, setOfferings] = useState(null);
  const [busy, setBusy] = useState(null); // a package identifier, "restore", or null
  const [error, setError] = useState(null);
  const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
  const Purchases = isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.Purchases;

  useEffect(() => {
    if(!Purchases || !REVENUECAT_PUBLIC_SDK_KEY_ANDROID) return;
    let cancelled = false;
    Purchases.getOfferings().then(res => {
      if(!cancelled) setOfferings(res && res.current ? res.current.availablePackages : []);
    }).catch(() => { if(!cancelled) setError("Couldn't load subscription options — try again in a moment."); });
    return () => { cancelled = true; };
  }, []);

  async function buy(pkg){
    if(!Purchases || busy) return;
    setBusy(pkg.identifier);
    setError(null);
    try{
      await Purchases.purchasePackage({ aPackage: pkg });
      onPurchased();
    }catch(err){
      // RevenueCat's SDK marks a user-cancelled purchase distinctly —
      // not worth showing an error banner for.
      if(!(err && (err.userCancelled || err.code === "1"))){
        setError((err && err.message) || "That purchase didn't go through — try again.");
      }
    }finally{
      setBusy(null);
    }
  }

  async function restore(){
    if(!Purchases || busy) return;
    setBusy("restore");
    setError(null);
    try{
      const { customerInfo } = await Purchases.restorePurchases();
      const active = customerInfo && customerInfo.entitlements && customerInfo.entitlements.active;
      if(active && active[REVENUECAT_ENTITLEMENT_ID]) onPurchased();
      else setError("No previous Style-LORE Premium purchase found on this account.");
    }catch(err){
      setError((err && err.message) || "Couldn't restore purchases right now.");
    }finally{
      setBusy(null);
    }
  }

  const reasonCopy = reason === "closet"
    ? "You've hit the free plan's closet item limit."
    : reason === "checker"
      ? "The AI Stylist — a real, detailed style read on your photo from Claude — is a Premium feature."
      : "Unlock everything Style-LORE Premium includes.";

  let plansContent;
  if (!isNative){
    plansContent = e(Banner, { kind:"info" }, "Subscriptions are handled through the Style-LORE mobile app right now — open the app on your phone to upgrade.");
  } else if (!REVENUECAT_PUBLIC_SDK_KEY_ANDROID){
    plansContent = e(Banner, { kind:"info" }, "Premium isn't fully set up yet — check back soon.");
  } else if (offerings === null){
    plansContent = e("p", { style:{ fontSize:13, color:"var(--ink-soft)" } }, "Loading plans…");
  } else if (offerings.length === 0){
    plansContent = e(Banner, { kind:"info" }, "No plans are available right now — check back soon.");
  } else {
    plansContent = e("div", { style:{ display:"flex", flexDirection:"column", gap:10, marginBottom:12 } },
      offerings.map(pkg => e("button", {
        key: pkg.identifier, className:"btn btn-accent btn-block",
        disabled: !!busy, onClick: ()=>buy(pkg),
      }, busy === pkg.identifier ? "Processing…" : (pkg.product.title || pkg.product.identifier) + " — " + pkg.product.priceString)),
      e("button", { className:"btn-text", style:{ fontSize:12.5 }, disabled:!!busy, onClick:restore }, busy === "restore" ? "Restoring…" : "Restore purchases")
    );
  }

  return e("div", { className:"sheet-backdrop", onClick:onClose },
    e("div", { className:"sheet", onClick: ev=>ev.stopPropagation() },
      e("div", { className:"sheet-handle" }),
      e("div", { className:"sheet-head" },
        e("h2", { className:"display", style:{ fontSize:20, fontWeight:700 } }, "Style-LORE Premium"),
        e("button", { className:"close-btn", onClick:onClose, "aria-label":"Close" }, Icon("x"))
      ),
      e("p", { style:{ fontSize:14, color:"var(--ink-soft)", marginBottom:16 } }, reasonCopy),
      e("ul", { style:{ margin:"0 0 20px", paddingLeft:20, fontSize:13.5, color:"var(--ink-soft)", display:"flex", flexDirection:"column", gap:6 } },
        e("li", null, "AI Stylist — real Claude-powered photo styling feedback, not just an on-device estimate"),
        e("li", null, "Closet up to 300 items instead of 20"),
        e("li", null, "Supports Style-LORE directly")
      ),
      plansContent,
      error ? e(Banner, { kind:"error" }, error) : null
    )
  );
}

/* =====================================================================
   CHECKER — on-device fit verdicts, no API key or network call
===================================================================== */

function CheckerScreen({ blend, styleWordBlend, kibbeTypeName, topStyleWords, visitorId, authToken, isPremium, onUpgrade }){
  const [description, setDescription] = useState("");
  const [checked, setChecked] = useState(null);
  const profile = { kibbeBlend: blend, styleWordBlend, kibbeTypeName, topStyleWords };

  // Photo checker — a separate, independent flow from the text checker
  // above: its own state, its own button, its own result area. Deliberately
  // does not touch `description`/`checked` or runCheck() at all, so this
  // addition can't interfere with the existing on-device text checker,
  // which keeps working exactly as it always has (with or without a
  // network connection, with or without an AI key configured).
  //
  // The photo path is on-device too now (see GarmentOnDeviceAnalyzer +
  // photoStyleVerdict above) — it no longer calls out to Anthropic's API,
  // so there's no "unavailable, no key configured" state to show anymore.
  const [photoPreview, setPhotoPreview] = useState(null);
  const [photoBlob, setPhotoBlob] = useState(null);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [photoResult, setPhotoResult] = useState(null);
  const [photoError, setPhotoError] = useState(null);

  // AI Stylist — Style-LORE Premium. Reuses whatever photo was just
  // uploaded for the free on-device photo checker above (same photoBlob),
  // so someone can get both the instant free read and, if they're
  // Premium, a real Claude vision read from the exact same photo without
  // uploading it twice. Its own busy/result/error state, and its own
  // gating on isPremium — the server (has_premium() in checker_photo.php)
  // enforces this independently either way, so onUpgrade here is purely
  // about giving a good UI prompt, never the actual access control.
  const [aiBusy, setAiBusy] = useState(false);
  const [aiResult, setAiResult] = useState(null);
  const [aiError, setAiError] = useState(null);

  function runCheck(){
    if (!description.trim()) return;
    setChecked(styleCheckVerdict(description.trim(), profile));
  }

  function pickCheckerPhoto(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    setPhotoResult(null);
    setPhotoError(null);
    setAiResult(null);
    setAiError(null);
    downscaleImage(file, 900, 0.8).then(dataUrl => {
      setPhotoPreview(dataUrl);
      setPhotoBlob(dataUrlToBlob(dataUrl));
    }).catch(() => setPhotoError("Couldn't read that photo — try a different one."));
  }

  async function runPhotoCheck(){
    if(!photoBlob || photoBusy) return;
    setPhotoBusy(true);
    setPhotoResult(null);
    setPhotoError(null);
    try{
      const { axes, usedBodyCrop } = await GarmentOnDeviceAnalyzer.analyzePhotoAxes(photoBlob);
      setPhotoResult(photoStyleVerdict(axes, profile, usedBodyCrop));
    }catch(err){
      setPhotoError(err.message || "Couldn't run the photo check right now.");
    }finally{
      setPhotoBusy(false);
    }
  }

  async function runAiStylist(){
    if(!photoBlob || aiBusy) return;
    if(!isPremium){ if(onUpgrade) onUpgrade("checker"); return; }
    setAiBusy(true);
    setAiResult(null);
    setAiError(null);
    try{
      const result = await Api.checkPhoto({ visitorId, authToken, photoBlob, kibbeTypeName, topStyleWords });
      setAiResult(result);
    }catch(err){
      if(err.code === "premium_required"){
        if(onUpgrade) onUpgrade("checker");
      } else {
        setAiError(err.message || "Couldn't run the AI Stylist right now — try again.");
      }
    }finally{
      setAiBusy(false);
    }
  }

  return e("div", null,
    e("div", { className:"eyebrow" }, "Does this match me?"),
    e("h1", { className:"screen-title" }, kibbeTypeName ? "Checker · " + kibbeTypeName : "Checker"),
    e("p", { className:"screen-lede", style:{ marginBottom:20 } },
      kibbeTypeName
        ? `Describe an item for an instant fit verdict against your ${kibbeTypeName} blend${topStyleWords && topStyleWords.length ? " and your own style words (" + topStyleWords.slice(0, 3).join(", ") + ")" : ""}.`
        : "Describe an item for an instant fit verdict against your Kibbe type."
    ),
    !blend ? e(Banner, { kind:"info" }, "Take the style quiz first so the checker has a type to compare against.") : null,

    e("div", { className:"field" },
      e("label", { htmlFor:"checker-desc" }, "Describe the item"),
      e("textarea", { id:"checker-desc", value:description, maxLength:200,
        placeholder:"e.g. Flowy floral maxi dress with a fitted bodice",
        onChange: ev=>setDescription(ev.target.value) })
    ),
    e("button", { className:"btn btn-accent btn-block", disabled:!description.trim(), onClick:runCheck, style:{ marginBottom:20 } }, "Check fit"),

    checked ? e("div", { className:"card", style:{ padding:16, marginBottom:16 } },
      e("div", { style:{ display:"flex", alignItems:"center", gap:10, marginBottom:8 } },
        checked.score !== null ? e(VerdictPill, { verdict: checked.verdictPill }) : null,
        checked.score !== null ? e("span", { className:"mono", style:{ fontSize:13, color:"var(--ink-soft)" } }, checked.score + "%") : null
      ),
      e("div", { style:{ fontSize:15, fontWeight:600, marginBottom:6 } }, checked.headline),
      checked.detail ? e("p", { style:{ fontSize:13.5, color:"var(--ink-soft)", marginBottom:0 } }, checked.detail) : null,
      checked.axisNotes.length > 0 ? e("div", { style:{ marginTop:10, display:"flex", flexDirection:"column", gap:6 } },
        checked.axisNotes.map(n => e("div", { key:n.axis, style:{ fontSize:13, color: n.aligned ? "var(--ink-soft)" : "var(--ink)" } },
          (n.aligned ? "Match — " : "Note — ") + "reads " + n.itemReads + (n.typeWants ? "; your type leans toward " + n.typeWants : "") + "."
        ))
      ) : null,
      checked.personalWords && checked.personalWords.length
        ? e("p", { style:{ fontSize:13, color:"var(--accent)", marginTop:10, marginBottom:0 } },
            (checked.personalWords.length === 1 ? "That's also one of " : "Those are also among ") + "your own style-quiz words: " + checked.personalWords.join(", ") + " — right in your language."
          )
        : null
    ) : null,

    checked && checked.axisNotes ? e(ShopTheGap, { labels: checked.axisNotes.filter(n => !n.aligned && n.typeWants).map(n => n.typeWants) }) : null,

    e(Banner, { kind:"info" }, "This check runs entirely on your device from the words you type — no account, key, or network call. It's a rule-based style-language match, not a professional styling opinion."),

    e("hr", { className:"rule", style:{ margin:"28px 0" } }),

    e("div", { className:"eyebrow" }, "Or show it a photo"),
    e("h2", { className:"screen-title", style:{ fontSize:20 } }, "Photo checker"),
    e("p", { className:"screen-lede", style:{ marginBottom:16 } },

function postsForSpace(visible, space, ctx){
  if(!space) return [];
  if(space.kind === "quick"){
    if(space.id === "all") return visible;
    if(space.id === "foryou") return ctx.myTop ? visible.filter(p => p.kibbeTag === ctx.myTop.id) : [];
    if(space.id === "following") return visible.filter(p => ctx.followingIds.has(p.authorId));
  }
  if(space.kind === "kibbe") return visible.filter(p => p.kibbeTag === space.id);
  if(space.kind === "style") return visible.filter(p => (p.styleTags||[]).includes(space.id));
  return [];
}

function spaceLabel(space){
  if(!space) return "";
  if(space.kind === "quick"){
    if(space.id === "foryou") return "For You";
    if(space.id === "following") return "Following";
    if(space.id === "all") return "All";
  }
  if(space.kind === "kibbe") return (KIBBE_BY_ID[space.id] || {}).name || "";
  if(space.kind === "style") return (STYLE_WORD_BY_ID[space.id] || {}).name || "";
  return "";
}

function patchPostLocal(setPosts, id, patch){
  setPosts(prev => prev ? prev.map(p => p.id === id ? Object.assign({}, p, patch) : p) : prev);
}

function CommunityScreen({ profile, blend, onOpenProfile }){
  const [posts, setPosts] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [followingIds, setFollowingIds] = useState(() => new Set());
  const [space, setSpace] = useState(null); // null = directory home, else {kind, id}
  const [showCompose, setShowCompose] = useState(false);

  const [groups, setGroups] = useState(null);
  const [groupFeed, setGroupFeed] = useState(null);
  const [showCreateGroup, setShowCreateGroup] = useState(false);
  const [groupBusy, setGroupBusy] = useState(false);

  const [stories, setStories] = useState(null);
  const [viewingStoryAuthor, setViewingStoryAuthor] = useState(null);
  const [showAddStory, setShowAddStory] = useState(false);

  // Closets — a community-wide feed of everyone's Public closet items (see
  // Api.getClosetFeed / api/closet_feed.php). Kept separate from the
  // posts-based feed state above since it's a different shape entirely
  // (closet items, not posts) and only loads when that space is open.
  const [closetFeed, setClosetFeed] = useState(null);

  const refreshFollows = useCallback(() => {
    if(!profile) return;
    Api.getFollows(profile.visitorId).then(ids => setFollowingIds(new Set(ids))).catch(()=>{});
  }, [profile && profile.visitorId]);
  const refreshGroups = useCallback(() => {
    if(!profile) return;
    Api.getGroups(profile.visitorId).then(setGroups).catch(()=>{});
  }, [profile && profile.visitorId]);
  const refreshStories = useCallback(() => {
    if(!profile) return;
    Api.getStories(profile.visitorId, profile.token).then(setStories).catch(()=>{});
  }, [profile && profile.visitorId, profile && profile.token]);

  useEffect(() => {
    refreshPosts();
    const t = setInterval(refreshPosts, 4000); // polling stands in for realtime push
    return () => clearInterval(t);
  }, [refreshPosts]);

  useEffect(() => {
    refreshFollows();
    const t = setInterval(refreshFollows, 6000);

      const next = new Set(prev);
      wasFollowing ? next.delete(authorId) : next.add(authorId);
      return next;
    });
    try{
      if(wasFollowing) await Api.unfollow(profile.visitorId, authorId, profile.token);
      else await Api.follow(profile.visitorId, profile.name, authorId, authorName, profile.token);
    }catch(err){
      refreshFollows(); // resync on failure
    }

  const myTop = blend ? sortedBlend(blend, KIBBE_TYPES)[0] : null;

  const ctx = { myTop, followingIds };

  const kibbeCounts = {}; KIBBE_TYPES.forEach(x => kibbeCounts[x.id] = 0);

  function openCompose(){ setShowCompose(true); }

      ),

      e("div", { className:"eyebrow", style:{ marginTop:22, marginBottom:10 } }, "Kibbe communities"),
      e("div", { className:"kibbe-tile-grid", style:{ marginBottom:8 } },
        KIBBE_TYPES.map(x => e("button", { key:x.id, className:"kibbe-tile", style:{ background:x.color }, onClick:()=>setSpace({kind:"kibbe", id:x.id}) },

function ComposeSheet({ profile, defaults, onPosted, onClose }){
  useBackClose(onClose);
  const [caption, setCaption] = useState("");
  const [photoFile, setPhotoFile] = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [videoFile, setVideoFile] = useState(null);
  const [videoPreviewUrl, setVideoPreviewUrl] = useState(null);
  const [videoUrl, setVideoUrl] = useState("");
  const [kibbeTag, setKibbeTag] = useState((defaults && defaults.kibbe) || KIBBE_TYPES[0].id);
  const [styleTags, setStyleTags] = useState((defaults && defaults.styles) || []);
  const [posting, setPosting] = useState(false);
  const [error, setError] = useState(null);

  function pickPhoto(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    downscaleImage(file, 1080, 0.78).then(dataUrl => {
      setPhotoPreview(dataUrl);
      setPhotoFile(dataUrlToBlob(dataUrl));
    }).catch(()=>setError("Couldn't read that photo — try another."));
  }

  function pickVideo(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    setError(null);
    const objectUrl = URL.createObjectURL(file);
    const probe = document.createElement("video");
    probe.preload = "metadata";
    probe.onloadedmetadata = () => {
      const dur = probe.duration;
      if(!isFinite(dur) || dur < 1){
        setError("Couldn't read that clip's length — try another file.");
        URL.revokeObjectURL(objectUrl);
        return;
      }
      if(dur > 35){
        setError("Keep clips to about 30 seconds — this one's " + Math.round(dur) + "s long.");
        URL.revokeObjectURL(objectUrl);
        return;
      }
      setVideoFile(file);
      setVideoPreviewUrl(objectUrl);
      setVideoUrl(""); // an uploaded file takes priority over a pasted link
    };
    probe.onerror = () => {
      setError("Couldn't read that video file — try another.");
      URL.revokeObjectURL(objectUrl);
    };
    probe.src = objectUrl;
  }

  function removeVideo(){
    if(videoPreviewUrl) URL.revokeObjectURL(videoPreviewUrl);
    setVideoFile(null);
    setVideoPreviewUrl(null);
  }

  function toggleStyleTag(id){
    setStyleTags(prev => {
      if(prev.includes(id)) return prev.filter(x => x !== id);
      if(prev.length >= MAX_STYLE_TAGS) return prev;
      return [...prev, id];
    });
  }

  async function submit(){
    const trimmedCaption = caption.trim();
    const trimmedLink = videoUrl.trim();
    if(trimmedLink && !videoFile && !parseVideoLink(trimmedLink)){
      setError("That doesn't look like a valid video link — paste the full URL (e.g. from YouTube or Vimeo).");
      return;
    }
    if(!trimmedCaption && !photoFile && !videoFile && !trimmedLink) return;
    setPosting(true); setError(null);
    try{
      const fd = new FormData();
      fd.append("authorName", profile.name);
      fd.append("authorId", profile.visitorId);
      fd.append("authToken", profile.token || "");
      fd.append("kibbeTag", kibbeTag);
      fd.append("styleTags", JSON.stringify(styleTags));
      fd.append("caption", trimmedCaption);
      if(photoFile) fd.append("photo", photoFile, "photo.jpg");
      if(videoFile) fd.append("video", videoFile, videoFile.name || "clip.mp4");
      if(trimmedLink && !videoFile) fd.append("videoUrl", trimmedLink);
      if(defaults && defaults.groupId) fd.append("groupId", defaults.groupId);
      const created = await Api.createPost(fd);
      onPosted(created);
      onClose();
    }catch(err){
      setError(err.message || "Couldn't post right now — try again in a moment.");
    }finally{
      setPosting(false);
    }
  }

  return e("div", { className:"sheet-backdrop", onClick:onClose },
    e("div", { className:"sheet", onClick: ev=>ev.stopPropagation() },
      e("div", { className:"sheet-handle" }),
      e("div", { className:"sheet-head" },
        e("h2", { className:"display", style:{ fontSize:20, fontWeight:700 } }, "New post"),
        e("button", { className:"close-btn", onClick:onClose, "aria-label":"Close" }, Icon("x"))
      ),
      e("div", { className:"field" },
        e("label", { htmlFor:"post-caption" }, "Caption"),
        e("textarea", { id:"post-caption", value:caption, maxLength:280,
          placeholder:"What are you wearing, styling, or thinking about?",
          onChange: ev=>setCaption(ev.target.value) })
      ),
      e("div", { className:"photo-frame", style:{ aspectRatio:"16/10" } },
        photoPreview ? e("img", { src:photoPreview, alt:"" })
          : e("label", { className:"photo-frame-label", htmlFor:"post-photo-input" }, Icon("camera"), e("span", null, "Add a photo (optional)"))
      ),
      e("input", { id:"post-photo-input", type:"file", accept:"image/*", className:"visually-hidden", onChange:pickPhoto }),

      e("div", { className:"field" },
        e("label", null, "Video (optional — a short clip, ~10–30s)"),
        videoPreviewUrl
          ? e("div", null,
              e("video", { className:"compose-video-preview", src:videoPreviewUrl, controls:true, playsInline:true }),
              e("button", { type:"button", className:"btn-text", style:{ padding:0, fontSize:12.5 }, onClick:removeVideo }, "Remove clip")
            )
          : e("label", { htmlFor:"post-video-input", className:"btn btn-ghost btn-block", style:{ marginBottom:8 } }, Icon("clip"), " Upload a short clip"),
        e("input", { id:"post-video-input", type:"file", accept:"video/*", className:"visually-hidden", onChange:pickVideo }),
        !videoFile ? e("div", { style:{ marginTop:8 } },
          e("label", { htmlFor:"post-video-url", style:{ display:"block", fontSize:11.5, color:"var(--ink-soft)", marginBottom:6 } }, "…or paste a link to a clip hosted elsewhere"),
          e("input", { id:"post-video-url", type:"url", value:videoUrl, placeholder:"https://youtube.com/shorts/…",
            onChange: ev=>setVideoUrl(ev.target.value) })
        ) : null
      ),

      e("div", { className:"field" },
        e("label", null, "Tag with Kibbe type"),
        e("div", { className:"tabs", style:{ marginBottom:0 } },
          KIBBE_TYPES.map(x => e("button", { key:x.id, className:"tab-chip", "aria-pressed": kibbeTag===x.id, onClick:()=>setKibbeTag(x.id) }, x.name))
        )
      ),
      e("div", { className:"field" },
        e("label", null, "Style (optional, up to " + MAX_STYLE_TAGS + ")"),
        e("div", { className:"style-chip-row" },
          STYLE_WORDS.map(x => e("button", {
            key:x.id,
            type:"button",
            className:"tab-chip tab-chip-accent",
            "aria-pressed": styleTags.includes(x.id),
            disabled: !styleTags.includes(x.id) && styleTags.length >= MAX_STYLE_TAGS,
            onClick: () => toggleStyleTag(x.id)
          }, x.name))
        )
      ),
      error ? e(Banner, { kind:"error" }, error) : null,
      e("button", { className:"btn btn-accent btn-block", disabled:posting || (!caption.trim() && !photoFile && !videoFile && !videoUrl.trim()), onClick:submit },
        posting ? "Posting…" : "Post to Community")
    )
  );
}

function PostCard({ post, profile, followingIds, onToggleFollow, onOpenProfile, onPatch, onRemove }){
  const [showComments, setShowComments] = useState(false);
  const [commentText, setCommentText] = useState("");
  const [confirmReport, setConfirmReport] = useState(false);
  const [editing, setEditing] = useState(false);
  const [editCaption, setEditCaption] = useState(post.caption || "");
  const [confirmDeletePost, setConfirmDeletePost] = useState(false);
  const [actionError, setActionError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [followBusy, setFollowBusy] = useState(false);

  const liked = !!(post.likes && post.likes[profile.visitorId]);
  const likeCount = post.likes ? Object.values(post.likes).filter(Boolean).length : 0;
  const isOwnPost = post.authorId === profile.visitorId;
  const isFollowing = !!(followingIds && post.authorId && followingIds.has(post.authorId));

  async function handleToggleFollow(){
    if(!onToggleFollow || followBusy) return;
    setFollowBusy(true);
    try{ await onToggleFollow(post.authorId, post.authorName); }
    finally{ setFollowBusy(false); }
  }

  async function toggleLike(){
    const nextLiked = !liked;
    onPatch({ likes: Object.assign({}, post.likes || {}, { [profile.visitorId]: nextLiked }) });
    try{ await Api.like(post.id, profile.visitorId, nextLiked, profile.token); }
    catch(err){ /* transient — next poll resyncs */ }
  }

  async function submitComment(){
    if(!commentText.trim()) return;
    setBusy(true);
    try{
      const updated = await Api.comment(post.id, profile.visitorId, profile.token, commentText.trim());
      if(updated) onPatch({ comments: updated.comments });
      setCommentText("");
    }catch(err){ /* ignore */ }
    finally{ setBusy(false); }
  }

  async function report(){
    setBusy(true);
    try{
      await Api.report(post.id, profile.visitorId, profile.token);
      onRemove();
    }catch(err){ /* ignore */ }
    finally{ setBusy(false); setConfirmReport(false); }
  }

  function startEditing(){
    setEditCaption(post.caption || "");
    setActionError(null);
    setConfirmDeletePost(false);
    setEditing(true);
  }

  async function saveEdit(){
    const trimmed = editCaption.trim();
    if(!trimmed && !post.photoUrl && !post.videoFileUrl && !post.videoUrl){
      setActionError("A post needs a caption, photo, or video.");
      return;
    }
    setBusy(true);
    setActionError(null);
    try{
      const updated = await Api.editPost(post.id, profile.visitorId, profile.token, { caption: trimmed });
      onPatch({ caption: updated.caption, styleTags: updated.styleTags, kibbeTag: updated.kibbeTag });
      setEditing(false);
    }catch(err){ setActionError(err.message || "Couldn't update your post — try again."); }
    finally{ setBusy(false); }
  }

  async function deletePost(){
    setBusy(true);
    setActionError(null);
    try{
      await Api.deletePost(post.id, profile.visitorId, profile.token);
      onRemove();
      // No need to reset confirmDeletePost/busy — onRemove drops this
      // post from the parent's list, unmounting this component.
    }catch(err){
      setActionError(err.message || "Couldn't delete your post — try again.");
      setBusy(false);
    }
  }

  const kt = KIBBE_BY_ID[post.kibbeTag];

  const openProfile = () => onOpenProfile && onOpenProfile(post.authorId);

  return e("div", { className:"post" },
    e("div", { className:"post-head" },
      onOpenProfile
        ? e("button", { className:"avatar-btn", onClick:openProfile, "aria-label":"View " + post.authorName + "’s profile" },
            e(Avatar, { url:post.authorAvatarUrl, name:post.authorName, size:32 }))
        : e(Avatar, { url:post.authorAvatarUrl, name:post.authorName, size:32 }),
      e("button", { style:{ flex:1, textAlign:"left" }, onClick: onOpenProfile ? openProfile : undefined },
        e("div", { className:"post-name" }, post.authorName),
        e("div", { className:"post-time" }, timeAgo(post.createdAt))
      ),
      e("div", { style:{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:5 } },
        kt ? e(TypeSwatch, { id:kt.id, list:KIBBE_TYPES }) : null,
        (!isOwnPost && onToggleFollow) ? e("button", {
          className:"btn-text",
          style:{ padding:0, fontSize:11.5, color: isFollowing ? "var(--ink-soft)" : "var(--accent)" },
          disabled: followBusy,
          onClick: handleToggleFollow
        }, isFollowing ? "Following" : "+ Follow") : null
      )
    ),
    editing
      ? e("div", { style:{ marginBottom:10 } },
          e("div", { className:"field", style:{ marginBottom:6 } },
            e("textarea", { value:editCaption, maxLength:280, rows:3, placeholder:"Say something about this…",
              onChange: ev=>setEditCaption(ev.target.value) })
          ),
          e("div", { style:{ display:"flex", gap:14 } },
            e("button", { className:"btn-text", style:{ padding:0, fontSize:12.5, color:"var(--accent)" }, disabled:busy, onClick:saveEdit }, busy ? "Saving…" : "Save"),
            e("button", { className:"btn-text", style:{ padding:0, fontSize:12.5 }, disabled:busy, onClick:()=>{ setEditing(false); setActionError(null); } }, "Cancel")
          )
        )
      : (post.caption ? e("p", { className:"post-caption" }, post.caption) : null),
    (post.styleTags && post.styleTags.length) ? e("div", { className:"style-chip-row", style:{ marginBottom:10 } },
      post.styleTags.map(id => STYLE_WORD_BY_ID[id] ? e("span", { key:id, className:"style-chip" }, STYLE_WORD_BY_ID[id].name) : null)
    ) : null,
    post.videoFileUrl ? e("video", { className:"post-video", src:post.videoFileUrl, controls:true, playsInline:true, preload:"metadata" })
      : post.videoUrl ? e(VideoEmbed, { url:post.videoUrl })
      : null,
    post.photoUrl ? e("img", { className:"post-photo", src:post.photoUrl, alt:"" }) : null,
    e("div", { className:"post-actions" },
      e("button", { className:"post-action", "aria-pressed":liked, disabled:busy, onClick:toggleLike }, Icon("heart"), likeCount || ""),
      e("button", { className:"post-action", onClick:()=>setShowComments(!showComments) }, Icon("comment"), (post.comments||[]).length || ""),
      isOwnPost
        ? e("div", { style:{ marginLeft:"auto", display:"flex", gap:16 } },
            e("button", { className:"post-action", "aria-label":"Edit post", onClick:startEditing }, Icon("edit")),
            e("button", { className:"post-action", "aria-label":"Delete post", onClick:()=>{ setConfirmDeletePost(true); setEditing(false); setActionError(null); } }, Icon("trash"))
          )
        : e("button", { className:"post-action", style:{ marginLeft:"auto" }, onClick:()=>setConfirmReport(true) }, Icon("flag"))
    ),
    confirmReport ? e("div", { style:{ marginTop:10, display:"flex", alignItems:"center", gap:12 } },
      e("span", { style:{ fontSize:12.5, color:"var(--ink-soft)" } }, "Report and hide this post for everyone?"),
      e("button", { className:"btn-text", style:{ padding:0, fontSize:12.5, color:"var(--danger)" }, disabled:busy, onClick:report }, "Report"),
      e("button", { className:"btn-text", style:{ padding:0, fontSize:12.5 }, onClick:()=>setConfirmReport(false) }, "Cancel")
    ) : null,
    confirmDeletePost ? e("div", { style:{ marginTop:10, display:"flex", alignItems:"center", gap:12 } },
      e("span", { style:{ fontSize:12.5, color:"var(--ink-soft)" } }, "Delete this post? This can't be undone."),
      e("button", { className:"btn-text", style:{ padding:0, fontSize:12.5, color:"var(--danger)" }, disabled:busy, onClick:deletePost }, busy ? "Deleting…" : "Delete"),
      e("button", { className:"btn-text", style:{ padding:0, fontSize:12.5 }, disabled:busy, onClick:()=>{ setConfirmDeletePost(false); setActionError(null); } }, "Cancel")
    ) : null,
    actionError ? e("p", { style:{ fontSize:12, color:"var(--danger)", marginTop:6 } }, actionError) : null,
    showComments ? e("div", { className:"comment-list" },
      (post.comments||[]).map((c,i) => e("div", { key:i, className:"comment-row" }, e("b", null, c.authorName+": "), c.text)),
      e("div", { className:"comment-input-row" },
        e("input", { type:"text", value:commentText, maxLength:180, placeholder:"Add a comment…",
          onChange: ev=>setCommentText(ev.target.value),
          onKeyDown: ev => { if(ev.key === "Enter") submitComment(); } }),
        e("button", { className:"btn-text", disabled:busy || !commentText.trim(), onClick:submitComment }, "Send")
      )
    ) : null
  );
}

   PROFILE
===================================================================== */

function ProfileScreen({ id, viewer, onBack, onOpenProfile, onNameChange, onMessage, viewerKibbeBlend, viewerStyleWordBlend, viewerKibbeTypeName, viewerTopStyleWords }){
  const [profileRow, setProfileRow] = useState(null); // null = still loading
  const [posts, setPosts] = useState(null);
  const [followerIds, setFollowerIds] = useState(null); // Set|null
  const [followingCount, setFollowingCount] = useState(null);
  const [followBusy, setFollowBusy] = useState(false);
  const [showEdit, setShowEdit] = useState(false);
  const [showCompare, setShowCompare] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [closetItems, setClosetItems] = useState(null); // this account's Public closet items, null while loading

  const isMe = id === viewer.visitorId;

  const load = useCallback(() => {
    Api.getProfile(id).then(setProfileRow).catch(() => setLoadError("Couldn't load this profile."));
    Api.getPosts({ authorId:id }).then(setPosts).catch(() => setPosts([]));
    Api.getFollowers(id).then(ids => setFollowerIds(new Set(ids))).catch(() => setFollowerIds(new Set()));
    Api.getFollows(id).then(ids => setFollowingCount(ids.length)).catch(() => setFollowingCount(0));
    Api.getCloset(id).then(setClosetItems).catch(() => setClosetItems([]));
  }, [id]);

  useEffect(() => { load(); }, [load]);

  async function toggleFollow(){
    if(isMe || followBusy || !followerIds) return;
    const wasFollowing = followerIds.has(viewer.visitorId);
    setFollowerIds(prev => {
      const next = new Set(prev);
      wasFollowing ? next.delete(viewer.visitorId) : next.add(viewer.visitorId);
      return next;
    });
    setFollowBusy(true);
    try{
      if(wasFollowing) await Api.unfollow(viewer.visitorId, id, viewer.token);
      else await Api.follow(viewer.visitorId, viewer.name, id, profileRow ? profileRow.name : "", viewer.token);
    }catch(err){
      load(); // resync on failure
    }finally{
      setFollowBusy(false);
    }
  }

  function handleSaved(updated){
    setProfileRow(updated);
    setShowEdit(false);
    if(onNameChange) onNameChange(updated.name);
  }

  const displayName = (profileRow && profileRow.name) || "Someone";
  const isFollowing = !!(followerIds && followerIds.has(viewer.visitorId));

  // Auto-populated from this person's own Kibbe Quiz + Style Quiz results
  // (see api/profile_style.php) — never hand-entered.
  const styleWordNames = (profileRow && profileRow.styleWords && profileRow.styleWords.length)
    ? profileRow.styleWords.map(id => { const w = STYLE_WORDS.find(x => x.id === id); return w ? w.name : null; }).filter(Boolean)
    : [];
  const hasStyleSummary = !!(profileRow && profileRow.kibbeTypeName) || styleWordNames.length > 0;

  return e("div", null,
    e("button", { className:"btn-text", style:{ padding:0, marginBottom:14 }, onClick:onBack }, "← Back"),
    loadError ? e(Banner, { kind:"error" }, loadError) : null,

    e("div", { className:"profile-head" },
      e(Avatar, { url: profileRow ? profileRow.avatarUrl : null, name:displayName, size:72 }),
      e("div", { style:{ flex:1, minWidth:0 } },
        e("div", { className:"profile-name" }, displayName),
        (profileRow && profileRow.bio)
          ? e("p", { className:"profile-bio" }, profileRow.bio)
          : e("p", { className:"profile-bio-empty" }, isMe ? "Add a bio to tell people about your style." : "No bio yet."),
        e("div", { className:"profile-stats" },
          e("div", { className:"profile-stat" }, e("b", null, posts === null ? "—" : posts.length), e("span", null, "Posts")),
          e("div", { className:"profile-stat" }, e("b", null, followerIds === null ? "—" : followerIds.size), e("span", null, "Followers")),
          e("div", { className:"profile-stat" }, e("b", null, followingCount === null ? "—" : followingCount), e("span", null, "Following"))
        ),
        e("div", { style:{ display:"flex", gap:8, flexWrap:"wrap" } },
          isMe
            ? e("button", { className:"btn btn-ghost btn-sm", onClick:()=>setShowEdit(true) }, "Edit profile")
            : e("button", {
                className:"btn btn-sm " + (isFollowing ? "btn-ghost" : "btn-accent"),
                disabled: followBusy || !followerIds,
                onClick: toggleFollow
              }, isFollowing ? "Following" : "Follow"),
          // "Compare styles" is available on anyone's profile, including
          // your own (comparing yourself is a harmless no-op the sheet
          // handles gracefully) — it only needs the other profile's own
          // quiz data, already returned by the same Api.getProfile(id)
          // call this screen already makes (profileRow.kibbeBlend /
          // .styleWordBlend), plus the viewer's own quiz data passed down
          // from App(). No extra network call to open it.
          !isMe ? e("button", { className:"btn btn-ghost btn-sm", onClick:()=>setShowCompare(true) }, "Compare styles") : null,
          (!isMe && onMessage) ? e("button", { className:"btn btn-ghost btn-sm", onClick:()=>onMessage(id, displayName) }, "Message") : null
        )
      )
    ),

    hasStyleSummary ? e("div", { className:"profile-style-summary", style:{ margin:"14px 0" } },
      (profileRow && profileRow.kibbeTypeName) ? e("span", { className:"tab-chip", style:{ marginRight:6, marginBottom:6, display:"inline-block" } }, profileRow.kibbeTypeName) : null,
      styleWordNames.map(name => e("span", { key:name, className:"tab-chip tab-chip-accent", "aria-pressed":"true", style:{ marginRight:6, marginBottom:6, display:"inline-block" } }, name))
    ) : null,

    (closetItems && closetItems.length > 0) ? e("div", { style:{ margin:"14px 0" } },
      e("div", { className:"eyebrow", style:{ marginBottom:8 } }, isMe ? "Your public closet items" : displayName + "’s closet"),
      e("div", { className:"row-list" },
        closetItems.slice(0, 6).map(item => e("div", { key:item.id, className:"row-list-item" },
          item.photo ? e("img", { src:item.photo, alt:"", style:{ width:44, height:44, borderRadius:8, objectFit:"cover", flexShrink:0 } })
            : e("span", { style:{ width:44, height:44, borderRadius:8, background:"var(--paper-raised)", border:"1px solid var(--line)", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, color:"var(--ink-soft)" } }, Icon("shirt")),
          e("span", { style:{ flex:1, minWidth:0, fontSize:13.5 } }, item.description)
        ))
      )
    ) : (isMe && closetItems && closetItems.length === 0) ? e("p", { style:{ fontSize:12, color:"var(--ink-soft)", margin:"14px 0" } },
      "None of your closet items are Public yet — mark one Public from the Closet tab to show it here."
    ) : null,

    e("hr", { className:"rule" }),

    posts === null ? e("div", { style:{ padding:"20px 0" } }, e(Thinking, { label:"Loading posts…" }))
      : posts.length === 0
        ? e(EmptyState, { icon:"community" }, isMe ? "You haven't posted anything yet." : displayName + " hasn't posted anything yet.")
        : e("div", null, posts.map(p => e(PostCard, {
            key:p.id, post:p, profile:viewer, followingIds:new Set(), onOpenProfile,
            onPatch: patch => setPosts(prev => prev ? prev.map(x => x.id===p.id ? Object.assign({}, x, patch) : x) : prev),
            onRemove: () => setPosts(prev => prev ? prev.filter(x => x.id !== p.id) : prev),
          }))),

    showEdit ? e(EditProfileSheet, {
      viewer,
      currentProfile: profileRow || { name:viewer.name, bio:"", avatarUrl:null },
      onSaved: handleSaved,
      onClose: () => setShowEdit(false)
    }) : null,

    showCompare ? e(CompareSheet, {
      myName: viewer.name,
      theirName: displayName,
      me: { kibbeBlend: viewerKibbeBlend, styleWordBlend: viewerStyleWordBlend, kibbeTypeName: viewerKibbeTypeName, topStyleWords: viewerTopStyleWords },
      them: profileRow ? {
        kibbeBlend: profileRow.kibbeResult ? profileRow.kibbeResult.kibbeBlend : null,
        styleWordBlend: profileRow.styleBlend || null,
        kibbeTypeName: profileRow.kibbeTypeName,
        topStyleWords: profileRow.styleWords,
      } : null,
      onClose: () => setShowCompare(false)
    }) : null
  );
}

/* Side-by-side style comparison between the signed-in viewer and whatever
   profile they're looking at — see compareProfiles() for the actual
   similarity math. Entirely on-device once both people's quiz data is in
   hand (the viewer's own from App()'s state, the other person's already
   fetched by ProfileScreen's normal profile load). */
function CompareSheet({ myName, theirName, me, them, onClose }){
  if(!them){
    return e("div", { className:"sheet-backdrop", onClick:onClose },
      e("div", { className:"sheet", onClick: ev=>ev.stopPropagation() },
        e("div", { className:"sheet-handle" }),
        e("div", { className:"sheet-head" },
          e("h2", { className:"display", style:{ fontSize:20, fontWeight:700 } }, "Compare styles"),
          e("button", { className:"close-btn", onClick:onClose, "aria-label":"Close" }, Icon("x"))
        ),
        e("div", { style:{ padding:"20px 0" } }, e(Thinking, { label:"Loading…" }))
      )
    );
  }

  const result = compareProfiles(me, them);

  return e("div", { className:"sheet-backdrop", onClick:onClose },
    e("div", { className:"sheet", onClick: ev=>ev.stopPropagation() },
      e("div", { className:"sheet-handle" }),
      e("div", { className:"sheet-head" },
        e("h2", { className:"display", style:{ fontSize:20, fontWeight:700 } }, "Compare styles"),
        e("button", { className:"close-btn", onClick:onClose, "aria-label":"Close" }, Icon("x"))
      ),

      !result.ready
        ? e(Banner, { kind:"info" },
            result.missingA && result.missingB
              ? "Neither of you has taken the Kibbe Quiz or Style Quiz yet — take one first, then come back to compare."
              : result.missingA
                ? "Take the Kibbe Quiz or Style Quiz first so there's something of yours to compare."
                : `${theirName} hasn't taken the Kibbe Quiz or Style Quiz yet — nothing to compare against yet.`
          )
        : e("div", null,
            e("div", { className:"card", style:{ padding:16, marginBottom:16 } },
              e("div", { style:{ display:"flex", alignItems:"center", gap:10, marginBottom:8 } },
                result.overallScore !== null
                  ? e(VerdictPill, { verdict: result.overallScore >= 75 ? "match" : result.overallScore >= 50 ? "neutral" : "avoid" })
                  : null,
                result.overallScore !== null ? e("span", { className:"mono", style:{ fontSize:13, color:"var(--ink-soft)" } }, result.overallScore + "% match") : null
              ),
              e("div", { style:{ fontSize:15, fontWeight:600, marginBottom:6 } }, result.headline),
              e("p", { style:{ fontSize:13.5, color:"var(--ink-soft)", marginBottom:0 } },
                result.sameType
                  ? `You're both ${result.aTypeName || "the same Kibbe type"}.`
                  : (result.aTypeName && result.bTypeName)
                    ? `${myName || "You"}: ${result.aTypeName} · ${theirName}: ${result.bTypeName}` + (result.sameFamily ? " — same family, different variant." : ".")
                    : "Not everything is in yet, so this comparison uses whatever both of you have."
              )
            ),

            result.axisRows.length > 0 ? e("div", { style:{ marginBottom:16 } },

              e("div", { style:{ display:"flex", flexDirection:"column", gap:8 } },
