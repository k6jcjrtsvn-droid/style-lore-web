<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Moderation — Style-LORE</title>
<style>
  :root{
    --paper:#FBF0F3; --paper-raised:#FFF8F9; --ink:#2E1620; --ink-soft:#6C4C56;
    --line:#EACBD3; --accent:#C92C69; --danger:#B3483D; --good:#4C6A45;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#1C1015; --paper-raised:#25141A; --ink:#F6E6EB; --ink-soft:#BB93A1; --line:#3D212B; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{ max-width:720px; margin:0 auto; }
  h1{ font-size:22px; margin:0 0 4px; }
  p.lede{ color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; }
  .gate{ background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .gate input{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:14px; margin-bottom:10px;
  }
  button{
    font:inherit; border:none; border-radius:8px; padding:9px 16px; cursor:pointer;
  }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .card-head b{ font-size:15px; }
  .flag-count{ font-size:12px; color:var(--danger); font-weight:600; }
  .meta{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .caption{ font-size:13.5px; margin-bottom:10px; white-space:pre-wrap; }
  img, video{ max-width:100%; border-radius:8px; margin-bottom:10px; display:block; }
  .actions{ display:flex; gap:8px; }
  .empty{ color:var(--ink-soft); font-size:14px; padding:30px 0; text-align:center; }
  .error{ color:var(--danger); font-size:13px; margin-top:8px; }
  #logout{ font-size:12px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; }
  .tabs{ display:flex; gap:6px; }
  .tab{ border:1px solid var(--line); background:transparent; color:var(--ink-soft);
        border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .tab.is-on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .fsec{ margin:0 0 22px; }
  .fsec h2{ font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);
            margin:0 0 8px; font-weight:600; }
  .fbig{ font-size:28px; font-weight:700; margin:0 0 2px; }
  .fbig small{ font-size:13px; font-weight:400; color:var(--ink-soft); }
  table.f{ width:100%; border-collapse:collapse; font-size:14px; }
  table.f th, table.f td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  table.f th{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; }
  table.f td.n{ text-align:right; font-variant-numeric:tabular-nums; }
  .fnote{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-top:14px; }
  .comment-text{ font-size:14.5px; margin:6px 0 4px; }
  .comment-context{ font-size:12px; color:var(--ink-soft); border-left:2px solid var(--line);
                    padding-left:10px; margin-top:8px; }
  .hidden-badge{ font-size:11px; text-transform:uppercase; letter-spacing:.08em;
                 color:var(--danger); margin-left:8px; }
  .findbar{ display:flex; gap:8px; margin-bottom:18px; }
  .findbar input{ flex:1 1 auto; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
                  background:var(--paper-raised); color:var(--ink); font-size:14px; }
  .pill{ display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
         font-weight:600; border-radius:999px; padding:3px 9px; margin-left:6px;
         border:1px solid var(--line); color:var(--ink-soft); }
  .pill.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .pill.off{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .kv{ font-size:13px; color:var(--ink-soft); line-height:1.7; }
  .kv b{ color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Moderation queue</h1>
  <p class="lede">Posts and comments with at least one open report. Not indexed, not linked from the app — bookmark this page.</p>

  <div id="gate" class="gate">
    <label for="secret" style="font-size:13px; display:block; margin-bottom:6px;">Admin secret</label>
    <input id="secret" type="password" placeholder="Paste your ADMIN_SECRET" autocomplete="off">
    <button class="btn-accent" id="unlock">Unlock</button>
    <div class="error" id="gate-error"></div>
  </div>

  <div id="app" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px;">
      <div class="tabs">
        <button id="tab-posts" class="tab is-on" data-kind="posts">Posts</button>
        <button id="tab-comments" class="tab" data-kind="comments">Comments</button>
        <button id="tab-funnel" class="tab" data-kind="funnel">Funnel</button>
        <button id="tab-find" class="tab" data-kind="find">Find a person</button>
      </div>
      <button id="logout">Lock this page</button>
    </div>
    <div class="error" id="action-error"></div>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
  var SECRET_KEY = "lore_admin_secret";
  var gate = document.getElementById("gate");
  var app = document.getElementById("app");
  var list = document.getElementById("list");
  var gateError = document.getElementById("gate-error");
  var actionError = document.getElementById("action-error");
  // Which queue is showing. Posts and comments are two separate GETs (see
  // api/admin_moderation.php for why the response stayed a bare array).
  var kind = "posts";
  // The Find tab's last query, kept so switching away and back does not lose
  // it. Empty means "show the search box and nothing else" — this tab never
  // lists everyone, because a wildcard dump of every account is not a thing
  // an admin page should do casually.
  var findQuery = "";

  function secret(){ return localStorage.getItem(SECRET_KEY) || ""; }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function timeAgo(ms){
    var s = Math.floor((Date.now() - ms) / 1000);
    if(s < 60) return "just now";
    var m = Math.floor(s/60); if(m < 60) return m + "m ago";
    var h = Math.floor(m/60); if(h < 24) return h + "h ago";
    return Math.floor(h/24) + "d ago";
  }

  function renderPost(p){
    var media = "";
    if(p.photoUrl) media = '<img src="' + esc(p.photoUrl) + '" alt="">';
    else if(p.videoFileUrl) media = '<video src="' + esc(p.videoFileUrl) + '" controls playsinline></video>';

    return (
      '<div class="card" data-id="' + esc(p.id) + '">' +
        '<div class="card-head"><b>' + esc(p.authorName) + '</b>' +
          '<span class="flag-count">' + p.reportCount + (p.reportCount === 1 ? " report" : " reports") + '</span></div>' +
        '<div class="meta">' + esc(p.kibbeTag || "") + ' &middot; ' + timeAgo(p.createdAt) + '</div>' +
        (p.caption ? '<div class="caption">' + esc(p.caption) + '</div>' : '') +
        media +
        '<div class="actions">' +
          '<button class="btn-danger" data-action="hide">Hide post</button>' +
          '<button class="btn-ghost" data-action="dismiss">Dismiss reports</button>' +
        '</div>' +
      '</div>'
    );
  }

  // One reported comment, shown with enough of its post to judge it —
  // "that's disgusting" reads very differently under a coat than under a
  // person. Hidden comments stay in the queue with a badge so a wrong
  // auto-hide can be undone; that was the whole point of building this.
  function renderComment(c){
    return (
      '<div class="card" data-id="' + esc(c.id) + '">' +
        '<div class="card-head"><b>' + esc(c.authorName) + '</b>' +
          (c.hidden ? '<span class="hidden-badge">hidden</span>' : '') +
          '<span class="flag-count">' + c.reportCount + (c.reportCount === 1 ? " report" : " reports") + '</span></div>' +
        '<div class="meta">' + timeAgo(c.createdAt) + '</div>' +
        '<div class="comment-text">' + esc(c.text) + '</div>' +
        '<div class="comment-context">on ' + esc(c.postAuthorName || "a post") +
          (c.postCaption ? ': &ldquo;' + esc(c.postCaption) + '&rdquo;' : '') + '</div>' +
        '<div class="actions">' +
          '<button class="btn-danger" data-action="hide">Hide comment</button>' +
          '<button class="btn-ghost" data-action="dismiss">' +
            (c.hidden ? 'Restore &amp; dismiss' : 'Dismiss reports') + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* The funnel tab. Clicks and signups are two separate populations - see
     api/admin_funnel.php - so they are shown side by side and never divided
     into each other. "iOS" on the signup side means the account was created
     from the iOS app, which started being recorded on 23 Sep 2026; anything
     older reads as (unrecorded) rather than as web. */
  function renderFunnel(d){
    var signups = d.signups || [], clicks = d.clicks || [], bySource = d.clicksBySource || [];
    var LABEL = { ios:"iOS app", android:"Android app", web:"Web", "(unrecorded)":"Before 23 Sep (not recorded)" };
    function num(x){ return Number(x || 0).toLocaleString(); }

    var total = signups.reduce(function(a, r){ return a + Number(r.total || 0); }, 0);
    var ios = signups.filter(function(r){ return r.device === "ios"; })[0];

    /* How far an account gets, in the order the person experiences it. This
       is the number that decides whether the product works, and until now
       nothing reported it. The blind spot is stated, not hidden: the quiz
       runs signed out, so anyone who took it and left never reached this
       table at all. */
    var st = d.stage || {};
    var order = [
      ["accounts",     "Made an account"],
      ["verified",     "Verified their email"],
      ["tookQuiz",     "Finished the quiz"],
      ["loggedCloset", "Logged a closet item"],
      ["posted",       "Posted in Community"],
      ["premium",      "Went Premium"]
    ];
    var base = Number(st.accounts || 0);
    var stage = '<div class="fsec"><h2>How far people get</h2><table class="f">' +
      '<tr><th>Step</th><th class="n">People</th><th class="n">Of accounts</th></tr>' +
      order.map(function(o){
        var v = Number(st[o[0]] || 0);
        var pct = base ? Math.round(v / base * 100) + "%" : "\u2014";
        return '<tr><td>' + esc(o[1]) + '</td><td class="n">' + num(v) +
               '</td><td class="n">' + (o[0] === "accounts" ? "\u2014" : pct) + '</td></tr>';
      }).join("") + '</table>' +
      '<p class="fnote">Accounts only. The quiz works signed out, so anyone who took it, read their type and left without signing up is invisible here.</p></div>';

    /* The room census. A type with members and no posts is a room that
       greets its own people with "be the first" — the most common reason a
       new member never comes back. */
    function slug(n){ return String(n || "").toLowerCase().replace(/\s+/g, "-"); }
    var accByType = {}, postByType = {}, authByType = {}, types = {};
    (d.roomAccounts || []).forEach(function(r){ var k = slug(r.type); accByType[k] = Number(r.accounts || 0); types[k] = r.type; });
    (d.roomPosts || []).forEach(function(r){ var k = String(r.type || "");
      postByType[k] = Number(r.posts || 0); authByType[k] = Number(r.authors || 0);
      if(!types[k]) types[k] = k.replace(/-/g, " ").replace(/\b\w/g, function(c){ return c.toUpperCase(); }); });
    var keys = Object.keys(types).sort(function(a, b){ return (postByType[b] || 0) - (postByType[a] || 0); });
    var dead = keys.filter(function(k){ return !postByType[k]; }).length;
    var census = keys.length ? '<div class="fsec"><h2>Rooms \u2014 who is in them, who posts</h2><table class="f">' +
      '<tr><th>Type</th><th class="n">Members</th><th class="n">Posts</th><th class="n">People posting</th></tr>' +
      keys.map(function(k){
        var empty = !postByType[k];
        return '<tr><td>' + esc(types[k]) + (empty ? ' <span class="pill off">Empty</span>' : '') +
               '</td><td class="n">' + num(accByType[k] || 0) +
               '</td><td class="n">' + num(postByType[k] || 0) +
               '</td><td class="n">' + num(authByType[k] || 0) + '</td></tr>';
      }).join("") + '</table>' +
      '<p class="fnote">' + (dead ? dead + ' of these rooms have no posts at all. Someone of that type who finishes the quiz is shown the rest of their Kibbe family instead of an empty room \u2014 but the room is still theirs to start.' : 'Every room here has something in it.') + '</p></div>' : "";

    var head = stage + census + '<div class="fsec">' +
      '<h2>Signups from iOS</h2>' +
      '<p class="fbig">' + num(ios && ios.total) +
        ' <small>of ' + num(total) + ' accounts \u00b7 ' + num(ios && ios.last7) + ' in the last 7 days</small></p>' +
      '</div>';

    var t1 = '<div class="fsec"><h2>Signups by platform</h2><table class="f">' +
      '<tr><th>Platform</th><th class="n">Accounts</th><th class="n">Last 7 days</th><th class="n">Email verified</th></tr>' +
      (signups.length ? signups.map(function(r){
        return '<tr><td>' + esc(LABEL[r.device] || r.device) + '</td><td class="n">' + num(r.total) +
               '</td><td class="n">' + num(r.last7) + '</td><td class="n">' + num(r.verified) + '</td></tr>';
      }).join("") : '<tr><td colspan="4">No accounts yet.</td></tr>') + '</table></div>';

    var t2 = '<div class="fsec"><h2>Share-link clicks</h2><table class="f">' +
      '<tr><th>Link</th><th class="n">Clicks</th><th class="n">Distinct IPs</th><th class="n">Last 7 days</th><th class="n">On that platform</th></tr>' +
      (clicks.length ? clicks.map(function(r){
        return '<tr><td>/' + esc(r.slug) + '</td><td class="n">' + num(r.total) +
               '</td><td class="n">' + num(r.unique_ips) + '</td><td class="n">' + num(r.last7) +
               '</td><td class="n">' + num(r.right_platform) + '</td></tr>';
      }).join("") : '<tr><td colspan="5">No clicks recorded yet.</td></tr>') + '</table></div>';

    var t3 = bySource.length ? '<div class="fsec"><h2>Clicks by tag</h2><table class="f">' +
      '<tr><th>Link</th><th>Tag (?s=)</th><th class="n">Clicks</th></tr>' +
      bySource.map(function(r){
        return '<tr><td>/' + esc(r.slug) + '</td><td>' + esc(r.source) + '</td><td class="n">' + num(r.n) + '</td></tr>';
      }).join("") + '</table></div>' : "";

    return head + t1 + t2 + t3 + '<p class="fnote">' + esc(d.note || "") + '</p>';
  }

  /* The Find tab. Answers "is this person in here, and how far did they
     get?" — the thing neither the funnel (aggregates) nor the broadcast
     endpoint (counts) could tell you. Accounts and beta sign-ups are listed
     separately on purpose: asking for a beta invite is not having an
     account, and showing them in one list is how you end up telling someone
     they signed up when they did not. */
  function renderFind(d){
    var box = '<div class="findbar">' +
      '<input id="find-q" type="search" placeholder="Name, or any part of an email" value="' + esc(findQuery) + '" autocomplete="off">' +
      '<button class="btn-accent" id="find-go">Search</button></div>';
    if(!d) return box + '<div class="empty">Search accounts, profiles and beta sign-ups by name or email.</div>';

    function when(ms){ return ms ? (new Date(Number(ms)).toLocaleDateString() + " \u00b7 " + timeAgo(Number(ms))) : "\u2014"; }

    var accounts = d.accounts || [], betas = d.betaSignups || [];
    var acc = '<div class="fsec"><h2>Accounts (' + accounts.length + ')</h2>' +
      (accounts.length ? accounts.map(function(a){
        return '<div class="card">' +
          '<div class="card-head"><b>' + esc(a.name || "(no profile name)") + '</b>' +
            '<span>' + (a.verified ? '<span class="pill on">Verified</span>' : '<span class="pill off">Unverified</span>') +
            (a.isPremium ? '<span class="pill on">Premium</span>' : '') + '</span></div>' +
          '<div class="kv">' +
            '<b>' + esc(a.email) + '</b><br>' +
            'Signed up ' + esc(when(a.createdAt)) + ' on <b>' + esc(a.signupDevice) + '</b><br>' +
            'Kibbe type: <b>' + esc(a.kibbeType || "not taken") + '</b> \u00b7 ' +
            'Posts: <b>' + a.posts + '</b> \u00b7 Closet items: <b>' + a.closetItems + '</b><br>' +
            'Emails: ' + (a.emailOptOut ? '<b>opted out</b>' : 'opted in') +
              ' \u00b7 digest ' + esc(when(a.digestSentAt)) + ' \u00b7 survey ' + esc(when(a.surveySentAt)) +
            (a.productId ? '<br>Subscription: <b>' + esc(a.productId) + '</b> until ' + esc(when(a.expiresAt)) : '') +
          '</div></div>';
      }).join("") : '<div class="empty">No account matches that.</div>') + '</div>';

    var bet = '<div class="fsec"><h2>Beta sign-ups (' + betas.length + ')</h2>' +
      (betas.length ? '<table class="f"><tr><th>Name</th><th>Email</th><th>Status</th><th>Signed up</th></tr>' +
        betas.map(function(b){
          return '<tr><td>' + esc(b.name || "\u2014") + '</td><td>' + esc(b.email) +
                 '</td><td>' + esc(b.status) + '</td><td>' + esc(when(b.createdAt)) + '</td></tr>';
        }).join("") + '</table>'
       : '<div class="empty">No beta sign-up matches that.</div>') + '</div>';

    return box + acc + bet + '<p class="fnote">' + esc(d.note || "") +
      ' There are ' + Number(d.totalAccounts || 0).toLocaleString() + ' accounts in total.</p>';
  }

  async function load(){
    actionError.textContent = "";
    list.innerHTML = '<div class="empty">Loading…</div>';
    var wanted = kind;
    if(wanted === "find"){
      if(!findQuery){ list.innerHTML = renderFind(null); return; }
      try{
        var lr = await fetch("/api/admin/lookup?q=" + encodeURIComponent(findQuery), { headers:{ "X-Admin-Secret": secret() } });
        if(lr.status === 401){ lock("That secret didn't work."); return; }
        if(!lr.ok) throw new Error("Server said " + lr.status);
        var ld = await lr.json();
        if(wanted !== kind) return;
        list.innerHTML = renderFind(ld);
      }catch(err){
        list.innerHTML = renderFind(null).replace("Search accounts, profiles and beta sign-ups by name or email.",
          "Couldn't search \u2014 " + esc(err.message));
      }
      return;
    }
    if(wanted === "funnel"){
      try{
        var fr = await fetch("/api/admin/funnel", { headers:{ "X-Admin-Secret": secret() } });
        if(fr.status === 401){ lock("That secret didn't work."); return; }
        if(!fr.ok) throw new Error("Server said " + fr.status);
        var fd = await fr.json();
        if(wanted !== kind) return;
        list.innerHTML = renderFunnel(fd);
      }catch(err){
        list.innerHTML = '<div class="empty">Couldn\'t load the funnel — ' + esc(err.message) + '</div>';
      }
      return;
    }
    try{
      var url = "/api/admin/moderation" + (wanted === "comments" ? "?type=comments" : "");
      var r = await fetch(url, { headers:{ "X-Admin-Secret": secret() } });
      if(r.status === 401){ lock("That secret didn't work."); return; }
      if(!r.ok) throw new Error("Server said " + r.status);
      var rows = await r.json();
      if(wanted !== kind) return; // tab switched while this was in flight
      if(!rows.length){
        list.innerHTML = '<div class="empty">' +
          (wanted === "comments" ? "No reported comments right now." : "Nothing flagged right now.") + '</div>';
        return;
      }
      list.innerHTML = rows.map(wanted === "comments" ? renderComment : renderPost).join("");
    }catch(err){
      list.innerHTML = '<div class="empty">Couldn\'t load the queue — ' + esc(err.message) + '</div>';
    }
  }

  async function act(id, action, btn){
    btn.disabled = true;
    actionError.textContent = "";
    try{
      var payload = kind === "comments"
        ? { commentId: Number(id), action: action }
        : { postId: id, action: action };
      var r = await fetch("/api/admin/moderation", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Secret": secret() },
        body: JSON.stringify(payload),
      });
      if(!r.ok) throw new Error("Server said " + r.status);
      load();
    }catch(err){
      btn.disabled = false;
      // Inline, not alert(): a modal here blocks the page and there is
      // nothing useful to do in it.
      actionError.textContent = "Couldn't do that — " + err.message;
    }
  }

  function runFind(){
    var input = document.getElementById("find-q");
    findQuery = input ? input.value.trim() : "";
    load();
  }
  list.addEventListener("click", function(ev){
    if(ev.target.id === "find-go"){ runFind(); return; }
    var btn = ev.target.closest("button[data-action]");
    if(!btn) return;
    var card = ev.target.closest(".card");
    act(card.getAttribute("data-id"), btn.getAttribute("data-action"), btn);
  });

  list.addEventListener("keydown", function(ev){
    if(ev.target.id === "find-q" && ev.key === "Enter"){ ev.preventDefault(); runFind(); }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(tab){
    tab.addEventListener("click", function(){
      kind = tab.getAttribute("data-kind");
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
        t.classList.toggle("is-on", t === tab);
      });
      load();
    });
  });

  function unlock(){
    var val = document.getElementById("secret").value.trim();
    if(!val) return;
    localStorage.setItem(SECRET_KEY, val);
    gateError.textContent = "";
    gate.style.display = "none";
    app.style.display = "block";
    load();
  }

  function lock(message){
    localStorage.removeItem(SECRET_KEY);
    app.style.display = "none";
    gate.style.display = "block";
    gateError.textContent = message || "";
  }

  document.getElementById("unlock").addEventListener("click", unlock);
  document.getElementById("secret").addEventListener("keydown", function(ev){ if(ev.key === "Enter") unlock(); });
  document.getElementById("logout").addEventListener("click", function(){ lock(""); });

  if(secret()){
    gate.style.display = "none";
    app.style.display = "block";
    load();
  }
})();
</script>
</body>
</html>
