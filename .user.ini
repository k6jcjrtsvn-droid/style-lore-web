; Per-account PHP settings for style-lore.com (public_html).
; Applies to this directory and everything below it, including api/.
;
; session.upload_progress.enabled = 0
;   Mitigation for PHP2Shell / CVE-2026-109619 (stale global state leading to
;   remote code execution), disclosed 2026-10-21. PHP's own advisory lists
;   this directive as the way to close that bug's known attack path without
;   updating PHP. Safe for us: the backend uses bearer-token auth and never
;   calls session_start() or touches $_SESSION, so nothing here depends on
;   PHP's session upload-progress feature.
;
;   This is a MITIGATION, NOT THE FIX. The fix is the host's patched PHP
;   build (upstream 8.3.36; GoDaddy/CloudLinux backport the fix without
;   changing the version number). Check api/selftest.php -> runtime.buildDate
;   before deciding this line is no longer needed.
session.upload_progress.enabled = 0
